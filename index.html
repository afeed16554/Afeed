<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFEED</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide for icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            scroll-behavior: smooth;
        }
        /* Chapter card hover animations */
        .chapter-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chapter-card.active:hover {
            border-color: #6366f1; /* Indigo 500 */
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.1);
        }
        .chapter-card.planned {
            opacity: 0.55;
            filter: grayscale(80%);
            cursor: default;
        }
        .chapter-card.planned:hover {
            opacity: 0.8;
            filter: grayscale(40%);
        }
        /* Subject Tab Animations */
        .subject-tab {
            transition: all 0.2s ease;
        }
        .subject-tab.active {
            background-color: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
            color: #818cf8;
            box-shadow: 0 0 15px -3px rgba(99, 102, 241, 0.3);
        }
        .subject-tab:not(.active):hover {
            background-color: rgba(30, 41, 59, 0.8);
            border-color: #475569;
        }
        /* Glassmorphism */
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Smooth expand/collapse animation */
        .sim-list-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }
        .sim-list-container.expanded {
            grid-template-rows: 1fr;
        }
        .sim-list-content {
            overflow: hidden;
        }
        /* Brand text */
        .brand-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            letter-spacing: -0.05em;
        }
        .brand-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

           {
               id: "bio_paper1",         // MUST BE UNIQUE! Used for scrolling navigation.

               themeColor: "emerald",    // Available colors: blue, orange, emerald, teal, rose, pink, cyan

           Inside the `chapters` array, add a chapter object. Default status is "planned".

                            { id: "i1c1", name: "World & Bangladesh Perspective", bn: "বিশ্ব ও বাংলাদেশ প্রেক্ষিত", status: "planned", icon: "globe-2", keywords: ["virtual reality", "ai", "biometrics", "robotics"] },
                            { id: "i1c2", name: "Communication Systems & Networking", bn: "কমিউনিকেশন সিস্টেমস ও নেটওয়ার্কিং", status: "planned", icon: "network", keywords: ["topology", "bandwidth", "fiber optic", "wireless"] },
                            { id: "i1c3", name: "Number Systems & Digital Devices", bn: "সংখ্যা পদ্ধতি ও ডিজিটাল ডিভাইস", status: "planned", icon: "binary", keywords: ["binary", "logic gates", "boolean", "encoder", "decoder"] },
                            { id: "i1c4", name: "Web Design & HTML", bn: "ওয়েব ডিজাইন পরিচিতি এবং HTML", status: "planned", icon: "layout-template", keywords: ["website", "tags", "hyperlink", "tables"] },
                            { id: "i1c5", name: "Programming Language (C)", bn: "প্রোগ্রামিং ভাষা", status: "planned", icon: "code", keywords: ["loops", "functions", "array", "algorithm", "flowchart"] },
                            { id: "i1c6", name: "Database Management System", bn: "ডেটাবেজ ম্যানেজমেন্ট সিস্টেম", status: "planned", icon: "database", keywords: ["dbms", "sql", "keys", "relations", "sorting"] }
                        ]
                    }
                ]
            }
        };

        // State Management
        let currentSubject = 'physics';

        // Switch subject and trigger re-render
        window.switchSubject = function(subjectKey) {
            currentSubject = subjectKey;
            document.getElementById('searchBar').value = ''; // Clear search
            renderApp();
        };

        // Determine color classes based on theme
        function getThemeClasses(themeColor) {
            const maps = {
                blue: { bg: 'bg-blue-500/10', text: 'text-blue-400', border: 'border-blue-500/20', shadow: 'shadow-blue-500/5' },
                orange: { bg: 'bg-orange-500/10', text: 'text-orange-400', border: 'border-orange-500/20', shadow: 'shadow-orange-500/5' },
                emerald: { bg: 'bg-emerald-500/10', text: 'text-emerald-400', border: 'border-emerald-500/20', shadow: 'shadow-emerald-500/5' },
                teal: { bg: 'bg-teal-500/10', text: 'text-teal-400', border: 'border-teal-500/20', shadow: 'shadow-teal-500/5' },
                rose: { bg: 'bg-rose-500/10', text: 'text-rose-400', border: 'border-rose-500/20', shadow: 'shadow-rose-500/5' },
                pink: { bg: 'bg-pink-500/10', text: 'text-pink-400', border: 'border-pink-500/20', shadow: 'shadow-pink-500/5' },
                cyan: { bg: 'bg-cyan-500/10', text: 'text-cyan-400', border: 'border-cyan-500/20', shadow: 'shadow-cyan-500/5' }
            };
            return maps[themeColor] || maps.blue;
        }

        // Determines the status badge
        function getStatusBadge(status, simCount = 0) {
            if (status === 'available') {
                return `<span class="bg-indigo-500/10 text-indigo-400 text-[10px] px-2.5 py-1 rounded-md border border-indigo-500/20 font-bold uppercase tracking-wide flex items-center gap-1.5 shadow-sm">${simCount} Active Labs <i data-lucide="flask-conical" class="w-3 h-3"></i></span>`;
            } else if (status === 'partial') {
                return '<span class="bg-amber-500/10 text-amber-500 text-[10px] px-2.5 py-1 rounded-md border border-amber-500/20 font-bold uppercase tracking-wide">Partial</span>';
            }
            return '<span class="bg-slate-800/80 text-slate-500 text-[10px] px-2.5 py-1 rounded-md border border-slate-700/50 font-bold uppercase tracking-wide">Planned</span>';
        }

        // Expanded State Management
        function saveExpandedState(id, isExpanded) {
            let expanded = JSON.parse(localStorage.getItem('afeed_expanded') || '[]');
            if (isExpanded && !expanded.includes(id)) expanded.push(id);
            if (!isExpanded) expanded = expanded.filter(i => i !== id);
            localStorage.setItem('afeed_expanded', JSON.stringify(expanded));
        }

        // History Management
        window.trackRecentLearning = function(simTitle, simLink, chapterName) {
            let recent = JSON.parse(localStorage.getItem('afeed_recent') || '[]');
            recent = recent.filter(item => item.link !== simLink);
            recent.unshift({ title: simTitle, link: simLink, chapter: chapterName });
            if (recent.length > 4) recent.pop();
            localStorage.setItem('afeed_recent', JSON.stringify(recent));
        }

        // Toggle Chapter Card
        window.toggleChapter = function(chapterId) {
            const container = document.getElementById(`sim-container-${chapterId}`);
            const chevron = document.getElementById(`chevron-${chapterId}`);
            const card = document.getElementById(`card-${chapterId}`);

            const isExpanding = !container.classList.contains('expanded');

            if (isExpanding) {
                container.classList.add('expanded');
                chevron.style.transform = 'rotate(180deg)';
                card.classList.add('bg-slate-800/80', 'ring-1', 'ring-indigo-500/50');
                card.classList.remove('bg-slate-900');
            } else {
                container.classList.remove('expanded');
                chevron.style.transform = 'rotate(0deg)';
                card.classList.remove('bg-slate-800/80', 'ring-1', 'ring-indigo-500/50');
                card.classList.add('bg-slate-900');
            }
            saveExpandedState(chapterId, isExpanding);
        };

        // Create Individual Chapter Card
        // Now accepts `itemLabel` so we can dynamically call them "Simulations" or "Interactions"
        function createCard(chapter, expandedState, itemLabel = 'Simulation') {
            const isAvailable = chapter.status === 'available' || chapter.status === 'partial';
            const isExpanded = expandedState.includes(chapter.id);
            const iconName = chapter.icon || 'file-text';
            const simCount = chapter.simulations ? chapter.simulations.length : 0;
            
            let simulationsHtml = '';
            if (simCount > 0) {
                simulationsHtml = chapter.simulations.map(sim => `
                    <a href="${sim.link}" onclick="trackRecentLearning('${sim.title}', '${sim.link}', '${chapter.name}')" class="flex items-center justify-between p-3 mb-2 rounded-lg bg-slate-950/80 border border-slate-800 hover:border-indigo-500 hover:bg-slate-900 transition-colors group">
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 rounded-md bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                                <i data-lucide="play" class="w-3.5 h-3.5 ml-0.5"></i>
                            </div>
                            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">${sim.title}</span>
                        </div>
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-600 group-hover:text-indigo-400 transition-colors"></i>
                    </a>
                `).join('');
            }

            const activeClass = isAvailable ? 'active cursor-pointer bg-slate-900 border-slate-800' : 'planned bg-slate-900/50 border-transparent';
            const initialExpandedClass = isExpanded ? 'expanded' : '';
            const initialCardStyle = isExpanded ? 'bg-slate-800/80 ring-1 ring-indigo-500/50' : '';
            const chevronRotation = isExpanded ? 'transform: rotate(180deg)' : '';

            // Combine metadata for search indexing
            const searchMetadata = `${chapter.name} ${chapter.bn} ${chapter.keywords ? chapter.keywords.join(' ') : ''}`.toLowerCase();

            return `
                <div id="card-${chapter.id}" class="chapter-card border rounded-2xl overflow-hidden ${activeClass} ${initialCardStyle}" 
                     data-search="${searchMetadata}"
                     onclick="${isAvailable ? `toggleChapter('${chapter.id}')` : ''}">
                    <div class="p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-5">
                                <div class="w-10 h-10 rounded-xl bg-slate-800/80 flex items-center justify-center text-slate-300 shadow-inner">
                                    <i data-lucide="${iconName}" class="w-5 h-5"></i>
                                </div>
                                ${getStatusBadge(chapter.status, simCount)}
                            </div>
                            <h3 class="text-lg text-white font-bold mb-1">${chapter.name}</h3>
                            <p class="text-slate-500 text-sm mb-1">${chapter.bn}</p>
                        </div>
                        
                        <div class="mt-4 flex items-center justify-between">
                            ${isAvailable ? 
                                `<span class="text-indigo-400 text-xs font-semibold uppercase tracking-wider">${simCount} ${itemLabel}${simCount > 1 ? 's' : ''}</span>
                                 <i id="chevron-${chapter.id}" data-lucide="chevron-down" class="w-4 h-4 text-indigo-400 transition-transform duration-300" style="${chevronRotation}"></i>` : 
                                `<span class="text-slate-600 text-xs font-semibold uppercase tracking-wider">${itemLabel} Locked</span>`
                            }
                        </div>
                    </div>
                    ${isAvailable ? `
                    <div id="sim-container-${chapter.id}" class="sim-list-container bg-slate-800/30 border-t border-slate-800/80 ${initialExpandedClass}">
                        <div class="sim-list-content">
                            <div class="p-4 pt-3">
                                ${simulationsHtml}
                            </div>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        // Render Tabs
        function renderSubjectTabs() {
            const container = document.getElementById('subject-selector');
            let html = '';
            
            for (const [key, data] of Object.entries(database)) {
                const isActive = key === currentSubject;
                const activeClass = isActive ? 'active' : 'text-slate-400 border border-slate-700 bg-slate-800/40';
                
                html += `
                    <button onclick="switchSubject('${key}')" 
                            class="subject-tab flex items-center gap-2 px-5 py-2.5 rounded-full font-semibold text-sm outline-none ${activeClass}">
                        <i data-lucide="${data.icon}" class="w-4 h-4"></i>
                        ${data.name}
                    </button>
                `;
            }
            container.innerHTML = html;
        }

        // Main App Render (Nav, Sections, Cards)
        function renderApp() {
            renderSubjectTabs();

            const subjectData = database[currentSubject];
            const papersContainer = document.getElementById('papers-container');
            const navContainer = document.getElementById('dynamic-nav-links');
            const expandedState = JSON.parse(localStorage.getItem('afeed_expanded') || '[]');

            let papersHtml = '';
            let navHtml = '';

            subjectData.papers.forEach((paper) => {
                const theme = getThemeClasses(paper.themeColor);
                
                navHtml += `<a href="#${paper.id}" class="hover:text-indigo-400 transition-colors">${paper.title.split(' ')[paper.title.split(' ').length - 2]} ${paper.title.split(' ')[paper.title.split(' ').length - 1]}</a>`;

                // Render paper section
                papersHtml += `
                    <section id="${paper.id}">
                        <div class="flex items-center gap-4 mb-8">
                            <div class="w-12 h-12 rounded-xl ${theme.bg} flex items-center justify-center border ${theme.border} shadow-lg ${theme.shadow}">
                                <i data-lucide="book-open" class="w-6 h-6 ${theme.text}"></i>
                            </div>
                            <div>
                                <h2 class="text-3xl font-bold text-white tracking-tight">${paper.title}</h2>
                                <p class="text-sm text-slate-400 mt-1">${paper.bn}</p>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
                            ${paper.chapters.map(ch => createCard(ch, expandedState, subjectData.itemLabel || 'Simulation')).join('')}
                        </div>
                    </section>
                `;
            });

            papersContainer.innerHTML = papersHtml;
            navContainer.innerHTML = navHtml;

            renderRecentModule();
            lucide.createIcons();
        }

        // Render "Continue Learning"
        function renderRecentModule() {
            const recentItems = JSON.parse(localStorage.getItem('afeed_recent') || '[]');
            const container = document.getElementById('recent-module');
            const grid = document.getElementById('recent-grid');

            if (recentItems.length > 0) {
                container.classList.remove('hidden');
                grid.innerHTML = recentItems.map(item => `
                    <a href="${item.link}" class="flex-none w-72 bg-slate-800/60 border border-indigo-500/20 rounded-xl p-4 snap-start hover:bg-slate-800 transition-colors group">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">${item.chapter}</span>
                            <i data-lucide="play-circle" class="w-4 h-4 text-slate-500 group-hover:text-white"></i>
                        </div>
                        <h4 class="text-white font-semibold text-sm line-clamp-1">${item.title}</h4>
                    </a>
                `).join('');
            } else {
                container.classList.add('hidden');
            }
        }

        // Live Search Logic
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.chapter-card');
            
            cards.forEach(card => {
                const metadata = card.getAttribute('data-search');
                if (term === '' || metadata.includes(term)) {
                    card.style.display = ''; 
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Initialize Platform
        window.onload = renderApp;
    </script>
</body>
</html>
