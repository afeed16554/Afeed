<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFEED</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide for icons (e.g., play button, book, zap) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Inter (English) and Noto Sans Bengali (Bangla) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- ========================================== -->
    <!-- CUSTOM CSS STYLES (Do not change unless modifying design) -->
    <!-- ========================================== -->
    <style>
        body {
            font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
            scroll-behavior: smooth;
        }
        /* Chapter card hover animations */
        .chapter-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .chapter-card.active:hover {
            border-color: #6366f1; /* Indigo 500 */
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.1);
        }
        /* Styling for chapters that don't have simulations yet */
        .chapter-card.planned {
            opacity: 0.55;
            filter: grayscale(80%);
            cursor: default;
        }
        .chapter-card.planned:hover {
            opacity: 0.8;
            filter: grayscale(40%);
        }
        /* Glassmorphism effect for the top navigation bar */
        .glass {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        /* Smooth expand/collapse animation classes for the dropdown list */
        .sim-list-container {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s ease-out;
        }
        .sim-list-container.expanded {
            grid-template-rows: 1fr;
        }
        .sim-list-content {
            overflow: hidden;
        }
        /* AFEED Brand specific styling (Purple/Indigo gradient) */
        .brand-text {
            font-family: 'Inter', sans-serif;
            font-weight: 900;
            letter-spacing: -0.05em;
        }
        .brand-gradient {
            background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        /* Hide scrollbar for the "Continue Learning" horizontal list */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-300 selection:bg-indigo-500/30">

    <!-- ========================================== -->
    <!-- TOP NAVIGATION BAR -->
    <!-- ========================================== -->
    <nav class="sticky top-0 z-50 border-b border-slate-800 glass">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="brand-text text-2xl tracking-tight brand-gradient">AFEED</span>
            </div>
            <!-- Quick links to scroll down to Paper 1 or Paper 2 -->
            <div class="hidden md:flex items-center gap-6 text-sm font-semibold text-slate-300">
                <a href="#paper1" class="hover:text-indigo-400 transition-colors">1st Paper</a>
                <a href="#paper2" class="hover:text-indigo-400 transition-colors">2nd Paper</a>
            </div>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- HERO SECTION (Big Logo & Search Bar) -->
    <!-- ========================================== -->
    <header class="relative py-20 px-4 overflow-hidden">
        <!-- Background blurred color blobs -->
        <div class="absolute inset-0 z-0 pointer-events-none">
            <div class="absolute top-0 left-1/4 w-96 h-96 bg-indigo-600/10 rounded-full blur-[120px]"></div>
            <div class="absolute bottom-0 right-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px]"></div>
        </div>
        
        <div class="relative z-10 max-w-4xl mx-auto text-center">
            <!-- Main Title -->
            <h1 class="brand-text text-6xl md:text-[6rem] mb-10 text-white leading-none">
                <span class="brand-gradient">AFEED</span>
            </h1>

            <!-- Advanced Search Bar -->
            <div class="max-w-xl mx-auto relative group">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors"></i>
                <input 
                    type="text" 
                    id="searchBar"
                    placeholder="Search chapters, topics, or keywords (e.g. Light, Vector)..." 
                    class="w-full bg-slate-900/80 backdrop-blur-sm border border-slate-700 rounded-2xl py-4 pl-12 pr-4 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500/50 transition-all shadow-2xl"
                >
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 pb-24">
        
        <!-- ========================================== -->
        <!-- "CONTINUE LEARNING" MODULE -->
        <!-- (This is hidden by default and only shows up via JavaScript 
             if the user has clicked on a simulation previously) -->
        <!-- ========================================== -->
        <section id="recent-module" class="mb-16 hidden">
            <div class="flex items-center gap-2 mb-4">
                <i data-lucide="clock" class="w-5 h-5 text-indigo-400"></i>
                <h3 class="text-lg font-bold text-white tracking-tight">Continue Learning</h3>
            </div>
            <!-- Horizontal scrolling grid for recent history -->
            <div id="recent-grid" class="flex gap-4 overflow-x-auto pb-4 no-scrollbar snap-x">
                <!-- Javascript will inject recent cards here -->
            </div>
        </section>

        <!-- ========================================== -->
        <!-- 1ST PAPER SECTION -->
        <!-- ========================================== -->
        <section id="paper1" class="mb-24">
            <!-- Section Header -->
            <div class="flex items-center gap-4 mb-8">
                <div class="w-12 h-12 rounded-xl bg-blue-500/10 flex items-center justify-center border border-blue-500/20 shadow-lg shadow-blue-500/5">
                    <i data-lucide="book-open" class="w-6 h-6 text-blue-400"></i>
                </div>
                <div>
                    <h2 class="text-3xl font-bold text-white tracking-tight">Physics 1st Paper</h2>
                    <p class="text-sm text-slate-400 mt-1">পদার্থবিজ্ঞান প্রথম পত্র</p>
                </div>
            </div>

            <!-- Grid container where Javascript will inject 1st Paper Chapters -->
            <div id="paper1Grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
            </div>
        </section>

        <!-- ========================================== -->
        <!-- 2ND PAPER SECTION -->
        <!-- ========================================== -->
        <section id="paper2">
            <!-- Section Header -->
            <div class="flex items-center gap-4 mb-8">
                <div class="w-12 h-12 rounded-xl bg-orange-500/10 flex items-center justify-center border border-orange-500/20 shadow-lg shadow-orange-500/5">
                    <i data-lucide="zap" class="w-6 h-6 text-orange-400"></i>
                </div>
                <div>
                    <h2 class="text-3xl font-bold text-white tracking-tight">Physics 2nd Paper</h2>
                    <p class="text-sm text-slate-400 mt-1">পদার্থবিজ্ঞান দ্বিতীয় পত্র</p>
                </div>
            </div>

            <!-- Grid container where Javascript will inject 2nd Paper Chapters -->
            <div id="paper2Grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
            </div>
        </section>

    </main>
    
    <!-- ========================================== -->
    <!-- FOOTER -->
    <!-- ========================================== -->
    <footer class="border-t border-slate-800 py-12 text-center">
        <div class="flex items-center justify-center gap-2 mb-4">
            <span class="brand-text text-xl brand-gradient">AFEED</span>
            <span class="text-slate-500 font-semibold">| Operating System for Physics</span>
        </div>
        <p class="text-slate-600 text-sm">Organized systematically. Stored locally.</p>
    </footer>

    <!-- ========================================================================= -->
    <!-- JAVASCRIPT LOGIC & CURRICULUM DATA -->
    <!-- THIS IS THE ONLY PART YOU NEED TO EDIT TO ADD SIMULATIONS -->
    <!-- ========================================================================= -->
    <script>
        /* ======================================================================
           HOW TO ADD A NEW SIMULATION
           ======================================================================
           Example: You want to add a simulation to "Physical World" (p1c1).
           
           Currently it looks like this:
           { id: "p1c1", name: "Physical World", bn: "ভৌত জগৎ", status: "planned", keywords: [...] }
           
           Change it to look like this:
           { 
             id: "p1c1", 
             name: "Physical World", 
             bn: "ভৌত জগৎ", 
             status: "available",   // 1. Change status to "available"
             icon: "globe",         // 2. Add an icon (find names at lucide.dev)
             keywords: ["units", "measurements", "errors"],
             simulations: [         // 3. Add the simulations array
                 { title: "My New Simulation", link: "My_Simulation_File.html" }
             ] 
           }

           To add a SECOND simulation to an already active chapter, just add a 
           new `{ title: "...", link: "..." }` to its simulations array!
           ======================================================================
        */

        const curriculum = {
            paper1: [
                // PLANNED CHAPTER (No simulations yet)
                { id: "p1c1", name: "Physical World", bn: "ভৌত জগৎ", status: "planned", keywords: ["units", "measurements", "errors"] },
                
                // AVAILABLE CHAPTER (Has simulations)
                { id: "p1c2", name: "Vectors", bn: "ভেক্টর", status: "available", icon: "move", keywords: ["direction", "scalar", "dot", "cross", "calculus", "field"], 
                  simulations: [
                      { title: "Vector Calculus & Fields", link: "Vector Calculus Simulation.html" }
                  ] 
                },
                
                { id: "p1c3", name: "Dynamics", bn: "গতিবিদ্যা", status: "planned", keywords: ["motion", "projectile", "velocity", "acceleration"] },
                { id: "p1c4", name: "Newtonian Mechanics", bn: "নিউটনিয়ান বলবিদ্যা", status: "planned", keywords: ["force", "friction", "momentum", "torque"] },
                { id: "p1c5", name: "Work, Energy & Power", bn: "কাজ, শক্তি ও ক্ষমতা", status: "planned", keywords: ["kinetic", "potential", "conservation"] },
                { id: "p1c6", name: "Gravitation", bn: "মহাকর্ষ ও অভিকর্ষ", status: "planned", keywords: ["gravity", "kepler", "escape velocity", "satellite"] },
                { id: "p1c7", name: "Structural Properties", bn: "পদার্থের গাঠনিক ধর্ম", status: "planned", keywords: ["elasticity", "stress", "strain", "fluids", "viscosity"] },
                
                // AVAILABLE CHAPTER WITH MULTIPLE SIMULATIONS
                { id: "p1c8", name: "Periodic Motion", bn: "পর্যাবৃত্ত গতি", status: "available", icon: "activity", keywords: ["shm", "pendulum", "spring", "oscillation"],
                  simulations: [
                      { title: "SHM Pendulum Dynamics", link: "SHM Pendulum Simulation.html" },
                      { title: "Basic Harmonic Oscillators", link: "Simple harmonic motion Simulation.html" }
                      // <-- Want a third simulation here? Just add a comma above and put a new { title: "...", link: "..." } here!
                  ] 
                },
                
                { id: "p1c9", name: "Waves", bn: "তরঙ্গ", status: "available", icon: "waves", keywords: ["sound", "interference", "superposition", "beats"],
                  simulations: [{ title: "Superposition & Interference", link: "Superposition of wave Simulation.html" }] 
                },
                { id: "p1c10", name: "Ideal Gas", bn: "আদর্শ গ্যাস ও গতিতত্ত্ব", status: "planned", keywords: ["pressure", "temperature", "rms", "kinetic theory"] }
            ],
            paper2: [
                { id: "p2c1", name: "Thermodynamics", bn: "তাপগতিবিদ্যা", status: "planned", keywords: ["heat", "entropy", "carnot", "engine"] },
                { id: "p2c2", name: "Static Electricity", bn: "স্থির তড়িৎ", status: "planned", keywords: ["charge", "coulomb", "electric field", "capacitor"] },
                { id: "p2c3", name: "Current Electricity", bn: "চল তড়িৎ", status: "planned", keywords: ["circuit", "ohm", "kirchhoff", "resistance"] },
                { id: "p2c4", name: "Magnetic Effect", bn: "চৌম্বক ক্রিয়া", status: "planned", keywords: ["magnet", "biot savart", "ampere", "lorentz"] },
                { id: "p2c5", name: "Electromagnetic Induction", bn: "তড়িৎ চৌম্বক আবেশ", status: "planned", keywords: ["faraday", "lenz", "ac current", "transformer"] },
                
                { id: "p2c6", name: "Geometric Optics", bn: "জ্যামিতিক আলোকবিজ্ঞান", status: "available", icon: "eye", keywords: ["light", "lens", "prism", "ray", "refraction", "mirror"],
                  simulations: [
                      { title: "Lens Ray Tracing & Focals", link: "Lens visual Simulation.html" },
                      { title: "Prism Deviation Angle", link: "Deviation Angle of Prism Simulation.html" }
                  ] 
                },
                
                { id: "p2c7", name: "Physical Optics", bn: "ভৌত আলোকবিজ্ঞান", status: "available", keywords: ["interference", "diffraction", "polarization", "double slit"],
                 simulations: [
                {title: "Double-Slit Experiment", link: "Double-Slit Experiment Simulation.html"}
                ]
                },
                { id: "p2c8", name: "Modern Physics", bn: "আধুনিক পদার্থবিজ্ঞান", status: "planned", keywords: ["relativity", "photoelectric", "compton", "quantum"] },
                { id: "p2c9", name: "Atomic Physics", bn: "পরমাণু মডেল ও নিউক্লিয়ার", status: "planned", keywords: ["bohr", "radioactivity", "half life", "fusion", "fission"] },
                { id: "p2c10", name: "Semiconductors", bn: "সেমিকন্ডাক্টর ও ইলেকট্রনিক্স", status: "partial", icon: "cpu", keywords: ["diode", "transistor", "logic gates", "band theory"] }
            ]
        };

        /* ========================================================================= */
        /* SYSTEM LOGIC BELOW (Do not edit below this line unless changing features) */
        /* ========================================================================= */

        // Function: Determines the color and text of the status badge (Available vs Planned)
        function getStatusBadge(status, simCount = 0) {
            if (status === 'available') {
                return `<span class="bg-indigo-500/10 text-indigo-400 text-[10px] px-2.5 py-1 rounded-md border border-indigo-500/20 font-bold uppercase tracking-wide flex items-center gap-1.5 shadow-sm">${simCount} Active Labs <i data-lucide="flask-conical" class="w-3 h-3"></i></span>`;
            } else if (status === 'partial') {
                return '<span class="bg-amber-500/10 text-amber-500 text-[10px] px-2.5 py-1 rounded-md border border-amber-500/20 font-bold uppercase tracking-wide">Partial</span>';
            }
            return '<span class="bg-slate-800/80 text-slate-500 text-[10px] px-2.5 py-1 rounded-md border border-slate-700/50 font-bold uppercase tracking-wide">Planned</span>';
        }

        // Function: Remembers which chapter menus you left open even after refreshing
        function saveExpandedState(id, isExpanded) {
            let expanded = JSON.parse(localStorage.getItem('afeed_expanded') || '[]');
            if (isExpanded && !expanded.includes(id)) expanded.push(id);
            if (!isExpanded) expanded = expanded.filter(i => i !== id);
            localStorage.setItem('afeed_expanded', JSON.stringify(expanded));
        }

        // Function: Saves clicked simulations to history for the "Continue Learning" section
        function trackRecentLearning(simTitle, simLink, chapterName) {
            let recent = JSON.parse(localStorage.getItem('afeed_recent') || '[]');
            recent = recent.filter(item => item.link !== simLink); // Remove duplicate
            recent.unshift({ title: simTitle, link: simLink, chapter: chapterName }); // Add to top
            if (recent.length > 4) recent.pop(); // Keep only 4 recent
            localStorage.setItem('afeed_recent', JSON.stringify(recent));
        }

        // Function: Handles the click event to open/close a chapter card
        window.toggleChapter = function(chapterId) {
            const container = document.getElementById(`sim-container-${chapterId}`);
            const chevron = document.getElementById(`chevron-${chapterId}`);
            const card = document.getElementById(`card-${chapterId}`);

            const isExpanding = !container.classList.contains('expanded');

            if (isExpanding) {
                // Open chapter
                container.classList.add('expanded');
                chevron.style.transform = 'rotate(180deg)';
                card.classList.add('bg-slate-800/80', 'ring-1', 'ring-indigo-500/50');
                card.classList.remove('bg-slate-900');
            } else {
                // Close chapter
                container.classList.remove('expanded');
                chevron.style.transform = 'rotate(0deg)';
                card.classList.remove('bg-slate-800/80', 'ring-1', 'ring-indigo-500/50');
                card.classList.add('bg-slate-900');
            }
            saveExpandedState(chapterId, isExpanding); // Save state
        };

        // Function: Generates the actual HTML code for a single chapter card
        function createCard(chapter, expandedState) {
            const isAvailable = chapter.status === 'available' || chapter.status === 'partial';
            const isExpanded = expandedState.includes(chapter.id);
            const iconName = chapter.icon || 'file-text';
            const simCount = chapter.simulations ? chapter.simulations.length : 0;
            
            // Build the inner list of simulations if they exist
            let simulationsHtml = '';
            if (simCount > 0) {
                simulationsHtml = chapter.simulations.map(sim => `
                    <a href="${sim.link}" onclick="trackRecentLearning('${sim.title}', '${sim.link}', '${chapter.name}')" class="flex items-center justify-between p-3 mb-2 rounded-lg bg-slate-950/80 border border-slate-800 hover:border-indigo-500 hover:bg-slate-900 transition-colors group">
                        <div class="flex items-center gap-3">
                            <div class="w-7 h-7 rounded-md bg-indigo-500/10 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                                <i data-lucide="play" class="w-3.5 h-3.5 ml-0.5"></i>
                            </div>
                            <span class="text-sm font-medium text-slate-300 group-hover:text-white transition-colors">${sim.title}</span>
                        </div>
                        <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-600 group-hover:text-indigo-400 transition-colors"></i>
                    </a>
                `).join('');
            }

            // Determine styles based on if it's available or expanded
            const activeClass = isAvailable ? 'active cursor-pointer bg-slate-900 border-slate-800' : 'planned bg-slate-900/50 border-transparent';
            const initialExpandedClass = isExpanded ? 'expanded' : '';
            const initialCardStyle = isExpanded ? 'bg-slate-800/80 ring-1 ring-indigo-500/50' : '';
            const chevronRotation = isExpanded ? 'transform: rotate(180deg)' : '';

            // Attach search metadata to DOM element for fast filtering (Combines English, Bangla, and keywords)
            const searchMetadata = `${chapter.name} ${chapter.bn} ${chapter.keywords ? chapter.keywords.join(' ') : ''}`.toLowerCase();

            // Return the full HTML string for the card
            return `
                <div id="card-${chapter.id}" class="chapter-card border rounded-2xl overflow-hidden ${activeClass} ${initialCardStyle}" 
                     data-search="${searchMetadata}"
                     onclick="${isAvailable ? `toggleChapter('${chapter.id}')` : ''}">
                    
                    <div class="p-5 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-5">
                                <div class="w-10 h-10 rounded-xl bg-slate-800/80 flex items-center justify-center text-slate-300 shadow-inner">
                                    <i data-lucide="${iconName}" class="w-5 h-5"></i>
                                </div>
                                ${getStatusBadge(chapter.status, simCount)}
                            </div>
                            <h3 class="text-lg text-white font-bold mb-1">${chapter.name}</h3>
                            <p class="text-slate-500 text-sm mb-1">${chapter.bn}</p>
                        </div>
                        
                        <div class="mt-4 flex items-center justify-between">
                            ${isAvailable ? 
                                `<span class="text-indigo-400 text-xs font-semibold uppercase tracking-wider">${simCount} Simulation${simCount > 1 ? 's' : ''}</span>
                                 <i id="chevron-${chapter.id}" data-lucide="chevron-down" class="w-4 h-4 text-indigo-400 transition-transform duration-300" style="${chevronRotation}"></i>` : 
                                `<span class="text-slate-600 text-xs font-semibold uppercase tracking-wider">Simulation Locked</span>`
                            }
                        </div>
                    </div>

                    ${isAvailable ? `
                    <div id="sim-container-${chapter.id}" class="sim-list-container bg-slate-800/30 border-t border-slate-800/80 ${initialExpandedClass}">
                        <div class="sim-list-content">
                            <div class="p-4 pt-3">
                                ${simulationsHtml}
                            </div>
                        </div>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        // Function: Loops through the curriculum data and injects the cards into the HTML grids
        function renderCurriculum() {
            const p1Grid = document.getElementById('paper1Grid');
            const p2Grid = document.getElementById('paper2Grid');
            const expandedState = JSON.parse(localStorage.getItem('afeed_expanded') || '[]');
            
            // Render Paper 1 Flat List
            p1Grid.innerHTML = curriculum.paper1.map(ch => createCard(ch, expandedState)).join('');

            // Render Paper 2 Flat List
            p2Grid.innerHTML = curriculum.paper2.map(ch => createCard(ch, expandedState)).join('');

            renderRecentModule(); // Render history
            lucide.createIcons(); // Initialize icons
        }

        // Function: Renders the "Continue Learning" section using saved history
        function renderRecentModule() {
            const recentItems = JSON.parse(localStorage.getItem('afeed_recent') || '[]');
            const container = document.getElementById('recent-module');
            const grid = document.getElementById('recent-grid');

            if (recentItems.length > 0) {
                container.classList.remove('hidden');
                grid.innerHTML = recentItems.map(item => `
                    <a href="${item.link}" class="flex-none w-72 bg-slate-800/60 border border-indigo-500/20 rounded-xl p-4 snap-start hover:bg-slate-800 transition-colors group">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">${item.chapter}</span>
                            <i data-lucide="play-circle" class="w-4 h-4 text-slate-500 group-hover:text-white"></i>
                        </div>
                        <h4 class="text-white font-semibold text-sm line-clamp-1">${item.title}</h4>
                    </a>
                `).join('');
            }
        }

        // Event Listener: Advanced Search Logic
        document.getElementById('searchBar').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const cards = document.querySelectorAll('.chapter-card');
            
            cards.forEach(card => {
                // Check if the search term exists in the card's hidden data-search attribute
                const metadata = card.getAttribute('data-search');
                // Use empty string to let CSS grid handle the display, 'none' to hide
                if (term === '' || metadata.includes(term)) {
                    card.style.display = ''; 
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // Initialize Platform when the page loads
        window.onload = renderCurriculum;
    </script>
</body>
</html>
