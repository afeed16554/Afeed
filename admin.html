<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afeed Admin Portal</title>
    <!-- Tailwind CSS with Dark Mode Class enabled -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide for icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen p-4 md:p-8">
    
    <div class="max-w-4xl mx-auto">
        <!-- HEADER -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 border-b border-slate-800 pb-6 gap-4">
            <div>
                <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-indigo-500 tracking-tight">AFEED Studio Manager</h1>
                <p class="text-sm text-slate-400 mt-1">Direct GitHub Repository Deployment Portal</p>
            </div>
            <button onclick="saveConfig()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-5 py-2.5 rounded-xl text-sm font-semibold transition-all focus:ring-2 focus:ring-indigo-500 outline-none w-full md:w-auto flex items-center justify-center gap-2">
                <i data-lucide="key" class="w-4 h-4"></i> Save API Config Locally
            </button>
        </header>

        <!-- CONFIGURATION SECTION -->
        <section class="bg-slate-900 border border-slate-800 p-6 rounded-2xl mb-8 space-y-4 shadow-xl">
            <h2 class="text-xs font-bold tracking-widest uppercase text-indigo-400 flex items-center gap-2">
                <i data-lucide="settings" class="w-4 h-4"></i> GitHub API Configuration
            </h2>
            <p class="text-xs text-slate-500">You only need to set these once. They are saved in your browser's local storage securely.</p>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">GitHub Username</label>
                    <input id="ghUser" type="text" placeholder="e.g. afeed16554" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Repository Name</label>
                    <input id="ghRepo" type="text" placeholder="e.g. Afeed" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Personal Access Token (PAT)</label>
                    <input id="ghToken" type="password" placeholder="github_pat_..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition">
                </div>
            </div>
        </section>

        <!-- UPLOAD SECTION -->
        <form id="uploadForm" onsubmit="handleUpload(event)" class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-6 shadow-xl">
            <h2 class="text-lg font-bold text-white flex items-center gap-2 border-b border-slate-800 pb-4">
                <i data-lucide="plus-circle" class="w-5 h-5 text-orange-500"></i> Add New Simulation to Database
            </h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dropdowns populated dynamically from data.json -->
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">1. Target Subject</label>
                    <select id="selSubject" onchange="updatePaperDropdown()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 cursor-pointer"></select>
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">2. Target Paper</label>
                    <select id="selPaper" onchange="updateChapterDropdown()" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 cursor-pointer"></select>
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">3. Target Chapter</label>
                <select id="selChapter" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 cursor-pointer"></select>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-slate-800/50">
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Simulation Title (Shown in UI)</label>
                    <input id="simTitle" required type="text" placeholder="e.g. Lens Ray Tracing" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">File Name (Include .html)</label>
                    <input id="fileName" required type="text" placeholder="e.g. Lens visual Simulation.html" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-200 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-xs uppercase font-semibold text-slate-400 mb-2">Select Simulation File</label>
                <input id="fileUpload" required type="file" accept=".html,.htm" class="w-full text-sm text-slate-400 file:mr-4 file:py-3 file:px-5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-slate-800 file:text-indigo-400 hover:file:bg-slate-700 cursor-pointer transition">
            </div>

            <button id="submitBtn" type="submit" class="w-full py-4 bg-orange-600 hover:bg-orange-500 text-white font-bold rounded-xl transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="cloud-upload" class="w-5 h-5"></i> Execute Push to GitHub
            </button>
            
            <div id="statusLog" class="text-sm font-mono text-center text-slate-400 p-4 rounded-xl bg-slate-950 hidden border border-slate-800"></div>
        </form>
    </div>

    <script>
        let registryDb = {};
        
        function saveConfig() {
            localStorage.setItem('afeed_gh_owner', document.getElementById('ghUser').value.trim());
            localStorage.setItem('afeed_gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('afeed_gh_pat', document.getElementById('ghToken').value.trim());
            
            const log = document.getElementById('statusLog');
            log.innerHTML = `<span class="text-emerald-400">Settings securely saved to local storage! Reloading database...</span>`;
            log.classList.remove('hidden');
            
            // Try fetching database after saving settings
            fetchDatabase();
        }

        // Helper to fetch directly from the user's Github to ensure we edit the real file
        async function fetchGitHubFile(path) {
            const owner = localStorage.getItem('afeed_gh_owner');
            const repo = localStorage.getItem('afeed_gh_repo');
            const token = localStorage.getItem('afeed_gh_pat');
            
            if(!owner || !repo) throw new Error("GitHub Username and Repository are required.");
            
            // Use the raw GitHub URL if token isn't provided (read-only), but for updating we need the API with token
            const headers = { 'Accept': 'application/vnd.github.v3+json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;

            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?t=${Date.now()}`, { headers });
            
            if (!res.ok) throw new Error(`Failed to fetch ${path}. Check repo details or Token permissions.`);
            return await res.json();
        }

        // Helper to upload a file (Create or Update)
        async function putGitHubFile(path, contentBase64, sha, message) {
            const owner = localStorage.getItem('afeed_gh_owner');
            const repo = localStorage.getItem('afeed_gh_repo');
            const token = localStorage.getItem('afeed_gh_pat');

            if(!token) throw new Error("A Personal Access Token is required to push files.");

            const body = { message, content: contentBase64 };
            if (sha) body.sha = sha; // Providing SHA means it's an update, not a new file

            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const errorData = await res.json();
                throw new Error(errorData.message || `Commit failed for ${path}`);
            }
            return await res.json();
        }

        // --- Dropdown Management ---
        function populateForm() {
            const subSel = document.getElementById('selSubject');
            subSel.innerHTML = Object.keys(registryDb).map(k => `<option value="${k}">${registryDb[k].name}</option>`).join('');
            updatePaperDropdown();
        }

        function updatePaperDropdown() {
            const sub = document.getElementById('selSubject').value;
            if(!sub) return;
            const paperSel = document.getElementById('selPaper');
            paperSel.innerHTML = registryDb[sub].papers.map(p => `<option value="${p.id}">${p.title}</option>`).join('');
            updateChapterDropdown();
        }

        function updateChapterDropdown() {
            const sub = document.getElementById('selSubject').value;
            const paperId = document.getElementById('selPaper').value;
            if(!sub || !paperId) return;
            const paper = registryDb[sub].papers.find(p => p.id === paperId);
            const chSel = document.getElementById('selChapter');
            chSel.innerHTML = paper.chapters.map(c => `<option value="${c.id}">${c.name} (${c.bn})</option>`).join('');
        }

        // --- Core Upload Logic ---
        async function handleUpload(e) {
            e.preventDefault();
            const log = document.getElementById('statusLog');
            const btn = document.getElementById('submitBtn');
            log.classList.remove('hidden');
            btn.disabled = true;

            try {
                log.innerHTML = `<span class="text-orange-400">Step 1/3: Reading and formatting file...</span>`;
                const file = document.getElementById('fileUpload').files[0];
                let fileName = document.getElementById('fileName').value.trim();
                const simTitle = document.getElementById('simTitle').value.trim();
                const subject = document.getElementById('selSubject').value;
                const paperId = document.getElementById('selPaper').value;
                const chapterId = document.getElementById('selChapter').value;

                if(!fileName.endsWith('.html')) fileName += '.html';

                // Convert file to Base64 (Using FileReader reads binary correctly)
                const base64File = await new Promise((res, rej) => {
                    const reader = new FileReader();
                    reader.onload = () => res(reader.result.split(',')[1]); // Strip data URL prefix
                    reader.onerror = rej;
                    reader.readAsDataURL(file);
                });

                log.innerHTML = `<span class="text-orange-400">Step 2/3: Deploying new simulation HTML to GitHub...</span>`;
                
                // Check if file already exists so we can get its SHA to overwrite it
                let existingSha = null;
                try {
                    const existing = await fetchGitHubFile(fileName);
                    existingSha = existing.sha;
                } catch(e) { 
                    // File doesn't exist, which is fine for a new upload
                } 
                
                await putGitHubFile(fileName, base64File, existingSha, `Upload simulation: ${fileName}`);

                log.innerHTML = `<span class="text-orange-400">Step 3/3: Updating data.json registry...</span>`;
                
                // Fetch the latest data.json directly from GitHub to prevent conflicts
                const jsonFileData = await fetchGitHubFile('data.json');
                
                // Decode GitHub's base64 payload (Handles Bengali unicode properly via decodeURIComponent)
                const decodedJsonText = decodeURIComponent(escape(atob(jsonFileData.content)));
                const liveDb = JSON.parse(decodedJsonText);

                // Locate the exact chapter in the object hierarchy
                const targetChapter = liveDb[subject].papers
                    .find(p => p.id === paperId).chapters
                    .find(c => c.id === chapterId);

                // Update the chapter details
                if (!targetChapter.simulations) targetChapter.simulations = [];
                
                // Check if simulation link already exists, if so, update title, else push new
                const existingSimIndex = targetChapter.simulations.findIndex(s => s.link === fileName);
                if(existingSimIndex >= 0) {
                    targetChapter.simulations[existingSimIndex].title = simTitle;
                } else {
                    targetChapter.simulations.push({ title: simTitle, link: fileName });
                }
                
                targetChapter.status = "available"; // Automatically unlock the chapter

                // Convert JSON back to Base64 (safely encoding unicode)
                const updatedJsonString = JSON.stringify(liveDb, null, 2);
                const updatedJsonBase64 = btoa(unescape(encodeURIComponent(updatedJsonString)));
                
                await putGitHubFile('data.json', updatedJsonBase64, jsonFileData.sha, `Register ${simTitle} in ${targetChapter.name}`);

                log.innerHTML = `<span class="text-emerald-400 flex items-center justify-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i> Success! Database updated and file uploaded. Refresh your main site.</span>`;
                lucide.createIcons();
                
                // Refresh local form state
                registryDb = liveDb;
                e.target.reset(); // Clear form inputs
                document.getElementById('fileName').value = ""; // Force clear
                
            } catch (err) {
                log.innerHTML = `<span class="text-red-400 flex items-center justify-center gap-2"><i data-lucide="alert-triangle" class="w-4 h-4"></i> Error: ${err.message}</span>`;
                lucide.createIcons();
            } finally {
                btn.disabled = false;
            }
        }

        async function fetchDatabase() {
            try {
                // If the user has entered their github details, try to fetch the live repo version
                // If not, try to fetch the local 'data.json' relative path.
                const owner = localStorage.getItem('afeed_gh_owner');
                const repo = localStorage.getItem('afeed_gh_repo');
                
                let res;
                if(owner && repo) {
                    res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/main/data.json?t=${Date.now()}`);
                } else {
                    res = await fetch(`data.json?t=${Date.now()}`);
                }
                
                registryDb = await res.json();
                populateForm();
            } catch (e) {
                console.warn("Could not load data.json on init. Make sure you set your GitHub details above.");
            }
        }

        // Initialize
        window.onload = function() {
            lucide.createIcons();
            
            // Load saved config
            document.getElementById('ghUser').value = localStorage.getItem('afeed_gh_owner') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('afeed_gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('afeed_gh_pat') || '';

            fetchDatabase();
        };
    </script>
</body>
</html>
