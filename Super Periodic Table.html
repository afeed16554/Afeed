<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Periodic Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        body { 
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            overscroll-behavior-y: none; /* Prevents pull-to-refresh on mobile when scrolling modals */
        }
        
        /* High contrast text for heatmap */
        .text-heatmap-contrast {
            color: #ffffff !important;
            text-shadow: 0px 1px 3px rgba(0,0,0,0.9), 0px 2px 6px rgba(0,0,0,0.8) !important;
        }

        /* Smooth scrolling for the table container */
        .table-scroll-container {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
        }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 selection:bg-red-500/30 overflow-x-hidden min-h-screen flex flex-col">

    <!-- Main Container -->
    <div class="max-w-[1400px] mx-auto w-full p-4 md:p-8 flex-1 flex flex-col">
        
        <!-- Header Section (Responsive Flex) -->
        <div class="flex flex-col md:flex-row items-center md:items-start justify-between mb-6 gap-6 relative z-30">
            <!-- Titles -->
            <div class="text-center md:text-left flex-1">
                <h1 class="text-3xl md:text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-2">
                    Super Periodic Table
                </h1>
                <p class="text-slate-400 mb-4 text-sm md:text-base">Interactive Trends & Chemistry Visualization Engine</p>
                
                <div class="flex justify-center md:justify-start items-center gap-2 text-xs md:text-sm text-slate-300 mb-2">
                    <div class="w-4 h-4 border-2 border-amber-500/80 bg-amber-900/40 rounded-sm"></div>
                    <span>অর্ধপরিবাহী (Semiconductors - Stair Line)</span>
                </div>

                <div id="legendContainer" class="hidden flex justify-center md:justify-start items-center gap-2 md:gap-3 mt-4 bg-slate-800/50 py-2 px-4 md:px-6 rounded-full inline-flex border border-slate-700 w-full md:w-auto">
                    <span class="text-[10px] md:text-xs font-bold text-slate-300">Low</span>
                    <div class="w-32 md:w-48 h-2 md:h-3 rounded bg-gradient-to-r from-[hsl(240,80%,35%)] to-[hsl(0,80%,50%)] shadow-inner"></div>
                    <span class="text-[10px] md:text-xs font-bold text-slate-300">High</span>
                </div>
            </div>

            <!-- Mode Dropdown -->
            <div class="flex flex-col items-center md:items-end w-full md:w-auto">
                <label class="text-[10px] md:text-xs text-slate-400 mb-1 font-medium tracking-wide uppercase">Property Heatmap</label>
                <select id="modeSelect" class="bg-slate-800 border border-slate-600 text-slate-200 text-sm rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-lg w-full md:w-64">
                    <option value="none">None</option>
                    <option value="rad">Atomic Radius (Empirical)</option>
                    <option value="zeff">Simplified Zeff (Valence Pull)</option>
                    <option value="density">Charge Density Approx.</option>
                    <option value="ie1">1st Ionisation Energy</option>
                    <option value="ea">Electron Affinity</option>
                    <option value="en">Pauling Electronegativity</option>
                    <option value="mp">Melting Point</option>
                    <option value="bp">Boiling Point</option>
                    <option value="physDensity">Physical Density</option>
                </select>
            </div>
        </div>

        <!-- Mobile Swipe Hint -->
        <div class="md:hidden text-slate-400 text-xs text-center mb-2 animate-pulse flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
            Swipe horizontally to explore
        </div>

        <!-- Scrollable Table Area -->
        <div class="table-scroll-container overflow-x-auto pb-24 -mx-4 px-4 md:mx-0 md:px-0">
            <!-- Main Grid -->
            <div id="mainTableGrid" class="relative grid gap-1 md:gap-2 mb-8 min-w-[1000px] md:min-w-[1100px]" style="grid-template-columns: 60px repeat(2, minmax(2.5rem, 1fr)) 0.5rem repeat(10, minmax(2.5rem, 1fr)) 0.5rem repeat(6, minmax(2.5rem, 1fr))">
                <!-- Dynamically populated via RenderEngine -->
            </div>

            <!-- F-Block -->
            <div class="mt-8 md:mt-12 flex flex-col items-center min-w-[1000px] md:min-w-[1100px] pl-[60px]">
                <div id="fBlockGrid" class="grid grid-cols-[repeat(15,minmax(2.5rem,1fr))] gap-1 md:gap-2 w-full">
                    <!-- Dynamically populated via RenderEngine -->
                </div>
                <div class="w-full max-w-[800px] mt-4 flex flex-col items-center text-slate-400 border-t border-slate-600 relative pt-2">
                    <div class="absolute top-[-10px] left-0 w-[1px] h-[10px] bg-slate-600"></div>
                    <div class="absolute top-[-10px] right-0 w-[1px] h-[10px] bg-slate-600"></div>
                    <span class="bg-[#0f172a] px-4 font-bold tracking-widest translate-y-[-18px] text-sm">15</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Action Buttons -->
    <div class="fixed bottom-4 right-4 md:bottom-6 md:right-6 z-40 flex flex-col md:flex-row gap-3 items-end pointer-events-none">
        <button id="resetBtn" class="pointer-events-auto hidden bg-slate-800 hover:bg-slate-700 text-slate-300 shadow-[0_0_15px_rgba(0,0,0,0.5)] px-4 py-2.5 md:py-3 rounded-full font-bold flex items-center gap-2 transition-transform hover:scale-105 border border-slate-600 text-sm md:text-base">
            <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            <span class="hidden md:inline">Reset All</span>
        </button>

        <button id="openCompareBtn" class="pointer-events-auto bg-blue-600 hover:bg-blue-500 text-white shadow-[0_0_20px_rgba(37,99,235,0.4)] px-5 py-2.5 md:px-6 md:py-3 rounded-full font-bold flex items-center gap-2 transition-transform hover:scale-105 border border-blue-400 text-sm md:text-base">

            <span id="compareCountLabel">Compare Lab (0)</span>
        </button>
    </div>

    <!-- Element Detail Modal -->
    <div id="elementModal" class="fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4 bg-black/70 backdrop-blur-sm hidden" onclick="RenderEngine.closeModals()">
        <div class="bg-[#1e293b] rounded-t-xl md:rounded-xl shadow-2xl border-t md:border border-slate-600 w-full max-w-lg max-h-[85vh] md:max-h-[90vh] flex flex-col relative transform transition-all overflow-hidden" onclick="event.stopPropagation()">
            <!-- Drag Handle for Mobile -->
            <div class="w-full flex justify-center py-2 md:hidden" onclick="RenderEngine.closeModals()">
                <div class="w-12 h-1.5 bg-slate-600 rounded-full"></div>
            </div>
            
            <div class="flex flex-col border-b border-slate-700 bg-slate-800">
                <div class="flex items-center space-x-4 px-5 pb-3 pt-2 md:pt-5">
                   <div id="modalSymIcon" class="w-14 h-14 md:w-16 md:h-16 bg-[#0f172a] border-2 border-slate-600 rounded-lg flex items-center justify-center text-2xl md:text-3xl font-bold text-white shadow-inner"></div>

                     <p id="modalZ" class="text-emerald-400 font-medium text-xs md:text-sm"></p>
                   </div>
                   <button onclick="RenderEngine.closeModals()" class="self-start text-slate-400 hover:text-white p-1 rounded-full hover:bg-slate-700 transition-colors hidden md:block">
                      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                   </button>
                </div>
                <div class="px-5 pb-4">
                    <button id="modalToggleCompareBtn" class="w-full py-2.5 rounded-md text-sm font-bold transition-all bg-blue-600 hover:bg-blue-500 text-white shadow-lg touch-manipulation">
                      + Add to Compare
                    </button>
                </div>
            </div>
            
            <div class="overflow-y-auto p-4 md:p-5 space-y-2 table-scroll-container" id="modalDetailsContainer">
                <!-- Details injected via JS -->
            </div>
        </div>
    </div>

    <!-- Compare Lab Modal -->

            </div>

               </div>
               <button onclick="RenderEngine.closeModals()" class="text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-700 hidden md:block">

            </div>
    
            <div class="p-4 md:p-5 flex-1 overflow-y-auto table-scroll-container">

                    <div class="flex gap-2">

                        <button onclick="UIState.clearCompareList()" class="flex-1 sm:flex-none bg-red-500/20 text-red-400 border border-red-500/50 hover:bg-red-500/30 px-4 py-2.5 rounded-md font-bold transition-colors touch-manipulation">Clear List</button>
                    </div>
                </div>

                        <!-- Trends injected -->
                    </div>
                </div>
            </div>
        </div>
    </div>

        // ==========================================
        // 2. CHEMISTRY ENGINE (Compute & Cache Layer)
        // ==========================================
        const ChemistryEngine = {
            elementsList: [],
            elementMap: {},
            cache: {},
            bounds: {
                rad: { min: Infinity, max: -Infinity }, 
                zeff: { min: Infinity, max: -Infinity }, 
                density: { min: Infinity, max: -Infinity }, 
                ie1: { min: Infinity, max: -Infinity }, 
                ie2: { min: Infinity, max: -Infinity }, 
                ie3: { min: Infinity, max: -Infinity }, 
                ea: { min: Infinity, max: -Infinity }, 
                en: { min: Infinity, max: -Infinity },
                mp: { min: Infinity, max: -Infinity }, 
                bp: { min: Infinity, max: -Infinity }, 
                physDensity: { min: Infinity, max: -Infinity },
                reactivity: { min: Infinity, max: -Infinity },
                stability: { min: Infinity, max: -Infinity }
            },

            init() {
                // 1. Parse Elements
                this.elementsList = ChemistryData.rawElements.split(';').map(item => {
                    const parts = item.trim().split(',');
                    if (parts.length < 6) return null;
                    return { z: parseInt(parts[0]), sym: parts[1], mass: parts[2], group: parseInt(parts[3]), period: parseInt(parts[4]), block: parts[5] };
                }).filter(Boolean);
                
                this.elementsList.forEach(e => this.elementMap[e.z] = e);

                // 2. Parse Properties
                const propsMap = {};
                ChemistryData.masterDataRaw.trim().split('\n').filter(Boolean).forEach(line => {
                    const [z, rad, ie1, ie2, ie3, ea, en, mp, bp, dens, conf] = line.trim().split('|');
                    propsMap[parseInt(z)] = { rad, ie1, ie2, ie3, ea, en, mp, bp, dens, conf };
                });

                // 3. Precompute EVERYTHING
                this.elementsList.forEach(el => {
                    const z = el.z;
                    const props = propsMap[z] || { rad: '-', conf: '-', ie1: '-', ie2: '-', ie3: '-', ea: '-', en: '-', mp: '-', bp: '-', dens: '-' };
                    
                    // Valance Approx
                    let val = 2;
                    if (el.group >= 13) val = el.group - 10;
                    if (el.group === 1 || el.group === 2) val = el.group;
                    if (el.group === 11 || el.group === 6) val = 1; 
                    if (z === 2) val = 2; 

                    const zeff = z - this.getPreviousNobleGas(z);
                    const radFloat = parseFloat(props.rad);
                    const ie1Float = parseFloat(props.ie1);
                    const enFloat = parseFloat(props.en);
                    const chargeDensity = (!isNaN(radFloat) && radFloat > 0) ? (val / radFloat) : null;

                    // Curated Reactivity & Stability Heuristics
                    const reactivity = this.computeReactivity(z, el.group, ie1Float, enFloat);
                    const stability = reactivity !== null ? -reactivity : null;

                    this.cache[z] = {
                        ...el,
                        ...props,
                        val,
                        computed: {
                            rad: isNaN(radFloat) ? null : radFloat,
                            zeff: zeff,
                            density: chargeDensity,
                            ie1: isNaN(ie1Float) ? null : ie1Float,
                            ie2: isNaN(parseFloat(props.ie2)) ? null : parseFloat(props.ie2),
                            ie3: isNaN(parseFloat(props.ie3)) ? null : parseFloat(props.ie3),
                            ea: isNaN(parseFloat(props.ea)) ? null : parseFloat(props.ea),
                            en: isNaN(enFloat) ? null : enFloat,
                            mp: isNaN(parseFloat(props.mp)) ? null : parseFloat(props.mp),
                            bp: isNaN(parseFloat(props.bp)) ? null : parseFloat(props.bp),
                            physDensity: isNaN(parseFloat(props.dens)) ? null : parseFloat(props.dens),
                            reactivity: reactivity,
                            stability: stability
                        }
                    };

                    const c = this.cache[z].computed;
                    Object.keys(this.bounds).forEach(key => {
                        if (c[key] !== null) {
                            this.bounds[key].min = Math.min(this.bounds[key].min, c[key]);
                            this.bounds[key].max = Math.max(this.bounds[key].max, c[key]);
                        }
                    });
                });
            },

            getPreviousNobleGas(z) {
                if (z <= 2) return 0; if (z <= 10) return 2; if (z <= 18) return 10;
                if (z <= 36) return 18; if (z <= 54) return 36; if (z <= 86) return 54;
                return 86;
            },

            computeReactivity(z, group, ie1, en) {
                if (group === 18) return 0;      
                if (z === 7) return 0.5;         
                if (z === 79 || z === 78) return 1.0; 
                if (z === 9) return 100;         
                if (z === 87) return 100;        
                if (z === 55) return 95;            
                
                if (isNaN(ie1)) return null; 
                let safeEn = isNaN(en) ? 1.0 : en; 
                
                if (safeEn < 2.0 || group <= 12) {
                    return Math.min(90, 10000 / ie1); 
                } else {
                    return Math.min(90, safeEn * safeEn * 3); 
                }
            },

            get(z) { return this.cache[z]; }
        };


        // ==========================================
        // 3. UI STATE
        // ==========================================
        const UIState = {
            mode: 'none',
            compareList: [],
            selectedZ: null,

            toggleCompare(z) {
                if (this.compareList.includes(z)) {

                } else {
                    this.compareList.push(z);
                }
                RenderEngine.updateCompareUI();
            },
            
            clearCompareList() {
                this.compareList = [];
                RenderEngine.updateCompareUI();
            },

            addCompareFromSelect() {
                const sel = document.getElementById('compareSelect');
                const z = parseInt(sel.value);
                if (z && !this.compareList.includes(z)) {
                    this.toggleCompare(z);
                    sel.value = "";
                }

            resetAll() {
                this.mode = 'none';
                document.getElementById('modeSelect').value = 'none';
                this.compareList = [];
                RenderEngine.applyHeatmap();
                RenderEngine.updateResetButton();
                RenderEngine.updateCompareUI();
            }
        };

        // ==========================================
        // 4. RENDER ENGINE (DOM Manipulations)
        // ==========================================
        const RenderEngine = {
            groupToGridCol(group) {
                if (group <= 2) return group + 1;
                if (group >= 3 && group <= 12) return group + 2; 
                return group + 3; 
            },

            formatElectronConfig(str) {
                if (!str || str === 'N/A' || str === '-') return 'N/A';
                const parts = str.split(/([spdf]\d+)/g);
                return parts.map(part => {
                    const match = part.match(/([spdf])(\d+)/);
                    if (match) return `${match[1]}<sup>${match[2]}</sup>`;
                    return part;
                }).join('');
            },

            init() {
                ChemistryEngine.init();
                this.renderGrid();
                
                document.getElementById('modeSelect').addEventListener('change', (e) => {
                    UIState.mode = e.target.value;
                    this.applyHeatmap();
                    this.updateResetButton();
                });

                document.getElementById('resetBtn').addEventListener('click', () => UIState.resetAll());
                document.getElementById('openCompareBtn').addEventListener('click', () => {
                    this.renderCompareTrends();
                    document.getElementById('compareModal').classList.remove('hidden');
                    document.body.style.overflow = 'hidden'; // Prevent background scroll

            renderGrid() {
                const mainTableGrid = document.getElementById('mainTableGrid');
                const fBlockGrid = document.getElementById('fBlockGrid');
                let mainHTML = '';
                
                // Dotted Lines
                const dottedLinesConfig = [

                dottedLinesConfig.forEach((line) => {

                                    <div class="w-[1px] md:w-[2px] h-full border-l md:border-l-[2px] border-dotted border-slate-500/40 mt-1"></div>
                                 </div>`;
                });

                // Highlights & Brackets
                mainHTML += `<div class="border md:border-[2px] border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.6)] rounded z-10 pointer-events-none" style="grid-column: ${this.groupToGridCol(6)}; grid-row: 7 / 11"></div>`;
                mainHTML += `<div class="border md:border-[2px] border-red-500 shadow-[0_0_15px_rgba(239,68,68,0.6)] rounded z-10 pointer-events-none" style="grid-column: ${this.groupToGridCol(11)}; grid-row: 7 / 11"></div>`;
                mainHTML += `
                    <div class="relative z-20 pointer-events-none" style="grid-column: ${this.groupToGridCol(6)} / ${this.groupToGridCol(11) + 1}; grid-row: 6">
                      <div class="absolute top-1/2 left-[8.33%] right-[8.33%] h-[1px] md:h-[2px] bg-red-500 shadow-[0_0_8px_#ef4444]"></div>
                      <div class="absolute top-1/2 bottom-[-10px] left-[8.33%] w-[1px] md:w-[2px] bg-red-500 shadow-[0_0_8px_#ef4444]"></div>

                      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-[#0f172a] px-2 py-0.5 md:px-3 md:py-1 text-red-400 font-bold tracking-wider text-[9px] md:text-sm border border-red-500/50 rounded shadow-[0_0_10px_rgba(239,68,68,0.3)] whitespace-nowrap">
                        ব্যতিক্রম ইলেকট্রন বিন্যাস
                      </div>

                // Headers & Labels...
                const headersData = [
                    { group: 1, roman: "IA", arabic: "1", config: "s¹", name: "ক্ষার ধাতু" }, { group: 2, roman: "IIA", arabic: "2", config: "s²", name: "মৃৎক্ষার ধাতু" },
                    { group: 3, roman: "IIIB", arabic: "3", config: "s²d¹" }, { group: 4, roman: "IVB", arabic: "4", config: "s²d²" },
                    { group: 5, roman: "VB", arabic: "5", config: "s²d³" }, { group: 6, roman: "VIB", arabic: "6", config: "s¹d⁵" },
                    { group: 7, roman: "VIIB", arabic: "7", config: "s²d⁵" }, { group: 8, roman: "VIIIB", arabic: "8", config: "s²d⁶" },
                    { group: 9, roman: "VIIIB", arabic: "9", config: "s²d⁷" }, { group: 10, roman: "VIIIB", arabic: "10", config: "s²d⁸" },
                    { group: 11, roman: "IB", arabic: "11", config: "s¹d¹⁰" }, { group: 12, roman: "IIB", arabic: "12", config: "s²d¹⁰" },
                    { group: 13, roman: "IIIA", arabic: "13", config: "p¹", name: "B-G" }, { group: 14, roman: "IVA", arabic: "14", config: "p²", name: "C-G" },
                    { group: 15, roman: "VA", arabic: "15", config: "p³", name: "N-Group" }, { group: 16, roman: "VIA", arabic: "16", config: "p⁴", name: "Chalcogen" },
                    { group: 17, roman: "VIIA", arabic: "17", config: "p⁵", name: "Halogen" }, { group: 18, roman: "VIIIA/0", arabic: "18", config: "p⁶", name: "Nobel" }
                ];
                headersData.forEach(h => {
                    mainHTML += `<div class="flex items-end justify-center pb-0.5 md:pb-1 px-0.5 md:px-1 z-10" style="grid-column: ${this.groupToGridCol(h.group)}; grid-row: 2; min-height: 24px md:min-height-30px">
                                    ${h.name ? `<span class="text-[0.45rem] sm:text-[0.55rem] md:text-xs text-pink-400 border border-pink-400/50 rounded px-1 py-[2px] text-center leading-tight whitespace-normal break-words max-w-full bg-[#0f172a]">${h.name}</span>` : ''}

                const periodLabels = { 1: "অতি সংক্ষিপ্ত", 2: "সংক্ষিপ্ত", 3: "সংক্ষিপ্ত", 4: "দীর্ঘ", 5: "দীর্ঘ", 6: "অতি দীর্ঘ", 7: "অতি দীর্ঘ" };

                // Elements
                ChemistryEngine.elementsList.forEach(el => {
                    const domEl = this.createAtomElement(el, el.block !== 'f' ? this.groupToGridCol(el.group) : null, el.block !== 'f' ? el.period + 3 : null);
                    if (el.block !== 'f') mainTableGrid.appendChild(domEl);
                    else fBlockGrid.appendChild(domEl);
                });

                this.applyHeatmap();
            },

            createAtomElement(el, gridCol, gridRow) {
                const div = document.createElement('div');
                div.className = `atom-container`;
                if (gridCol) div.style.gridColumn = gridCol;
                if (gridRow) div.style.gridRow = gridRow;

                const semiMetals = [5, 14, 32, 33, 51, 52, 84]; 
                const isSemi = semiMetals.includes(el.z);
                div.dataset.z = el.z;
                div.dataset.issemi = isSemi ? 'true' : 'false';

                div.innerHTML = `
                    <div class="atom-cell relative flex flex-col items-center justify-center aspect-square rounded-sm transition-all p-0.5 md:p-1 group z-10 cursor-pointer md:hover:scale-[1.05] active:scale-95 duration-200 select-none touch-manipulation" onclick="RenderEngine.openElementModal(${el.z})">

                const cells = document.querySelectorAll('.atom-container .atom-cell');
                const legend = document.getElementById('legendContainer');
                
                if (UIState.mode !== 'none') {
                    legend.classList.remove('hidden'); legend.classList.add('inline-flex');

                    legend.classList.add('hidden'); legend.classList.remove('inline-flex');

                cells.forEach(cell => {
                    const z = parseInt(cell.parentElement.dataset.z);
                    const isSemi = cell.parentElement.dataset.issemi === 'true';
                    const computed = ChemistryEngine.get(z).computed;
                    
                    const val = UIState.mode !== 'none' ? computed[UIState.mode] : null;
                    const isGradient = UIState.mode !== 'none' && val !== null && ChemistryEngine.bounds[UIState.mode] !== undefined;

                    let massTxt = cell.querySelector('.mass-text');
                    let symTxt = cell.querySelector('.sym-text');
                    let zTxt = cell.querySelector('.z-text');

                    cell.className = "atom-cell relative flex flex-col items-center justify-center aspect-square rounded-sm transition-all p-0.5 md:p-1 group z-10 cursor-pointer md:hover:scale-[1.05] active:scale-95 duration-200 select-none touch-manipulation";
                    
                    if (isSemi) cell.classList.add('border-[1.5px]', 'border-amber-500/80', 'shadow-[inset_0_0_8px_rgba(245,158,11,0.2)]');
                    else cell.classList.add('border', 'border-slate-700/80');

                    if (UIState.compareList.includes(z)) {
                        cell.classList.add('ring-2', 'ring-blue-400', 'ring-offset-1', 'ring-offset-slate-900');
                        cell.querySelector('.compare-badge').classList.remove('hidden');
                    } else {
                        cell.querySelector('.compare-badge').classList.add('hidden');
                    }

                    if (isGradient) {
                        const { min, max } = ChemistryEngine.bounds[UIState.mode];
                        if (min !== max) {
                            const p = Math.max(0, Math.min(1, (val - min) / (max - min)));
                            const h = 240 - (p * 240); 
                            const l = 35 + (p * 15);   
                            cell.style.backgroundColor = `hsl(${h}, 80%, ${l}%)`;
                        } else {
                            cell.style.backgroundColor = `hsl(120, 80%, 45%)`; 
                        }

                        massTxt.className = "mass-text absolute top-0.5 left-0.5 md:top-1 md:left-1 text-[0.45rem] md:text-xs pointer-events-none tracking-tighter text-heatmap-contrast";
                        symTxt.className = "sym-text text-sm md:text-xl font-bold pointer-events-none text-heatmap-contrast";
                        zTxt.className = "z-text absolute bottom-0.5 left-0.5 md:bottom-1 md:left-1 text-[0.6rem] md:text-sm font-bold pointer-events-none text-heatmap-contrast";
                    } else {
                        cell.style.backgroundColor = '';
                        if (isSemi) cell.classList.add('bg-amber-900/30', 'hover:bg-amber-900/50');
                        else cell.classList.add('bg-slate-800/80', 'hover:bg-slate-700');

                        massTxt.className = "mass-text absolute top-0.5 left-0.5 md:top-1 md:left-1 text-[0.45rem] md:text-xs pointer-events-none tracking-tighter text-slate-400 group-hover:text-slate-300";
                        symTxt.className = "sym-text text-sm md:text-xl font-bold pointer-events-none text-slate-100";
                        zTxt.className = "z-text absolute bottom-0.5 left-0.5 md:bottom-1 md:left-1 text-[0.6rem] md:text-sm font-bold pointer-events-none text-blue-300";
                    }
                });
            },

            updateResetButton() {
                const btn = document.getElementById('resetBtn');
                if (UIState.mode !== 'none' || UIState.compareList.length > 0) btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            },

            updateCompareUI() {
                document.getElementById('compareCountLabel').innerText = `Compare Lab (${UIState.compareList.length})`;
                this.applyHeatmap(); 
                this.updateResetButton();
                if (!document.getElementById('compareModal').classList.contains('hidden')) {
                    this.renderCompareTrends();
                }
            },

            openElementModal(z) {
                UIState.selectedZ = z;
                const data = ChemistryEngine.get(z);
                const c = data.computed;
                
                document.getElementById('modalSymIcon').innerText = data.sym;
                document.getElementById('modalTitle').innerText = `${data.sym} - Element`;
                document.getElementById('modalZ').innerText = `Atomic Number ${data.z}`;

                let ieDisplay = 'N/A';
                const ies = [c.ie1, c.ie2, c.ie3].filter(x => x !== null);
                if (ies.length > 0) ieDisplay = ies.join(', ') + ' kJ/mol';

                const makeRow = (label, val) => `
                    <div class="flex flex-col py-1.5 md:py-2 border-b border-slate-700/50 last:border-0">
                      <span class="text-[10px] md:text-xs text-slate-400 mb-0.5">${label}</span>
                      <span class="text-sm font-medium text-slate-100 break-words">${val !== null && val !== '-' ? val : 'N/A'}</span>
                    </div>`;

                document.getElementById('modalDetailsContainer').innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-0.5 md:gap-y-1">
                        ${makeRow('Proton Number', data.z)}
                        ${makeRow('Neutron Number', Math.round(parseFloat(data.mass)) - data.z)}
                        ${makeRow('Electron Number', data.z)}
                        ${makeRow('Electrons in Last Shell', data.val)}
                        ${makeRow('Atomic Mass', data.mass)}
                        ${makeRow('Atomic Radius', c.rad ? `${c.rad} pm` : null)}
                        ${makeRow('Zeff (Simplified)', c.zeff)}
                        ${makeRow('Charge Density', c.density ? c.density.toFixed(4) : null)}
                        ${makeRow('Melting Point', c.mp ? `${c.mp} K` : null)}
                        ${makeRow('Boiling Point', c.bp ? `${c.bp} K` : null)}
                        ${makeRow('Physical Density', c.physDensity ? `${c.physDensity} g/cm³` : null)}
                    </div>
                    <div class="mt-3 md:mt-4 pt-2 md:pt-3 border-t border-slate-700/50">
                        <div class="grid grid-cols-1 gap-0.5 md:gap-1">
                            ${makeRow('Electron Binnash (Short)', this.formatElectronConfig(data.conf))}
                            ${makeRow('Ionisation Energy (1,2,3)', ieDisplay !== 'N/A' ? ieDisplay : null)}
                            ${makeRow('Electron Affinity', c.ea ? `${c.ea} kJ/mol` : null)}
                            ${makeRow('Pauling Electronegativity', c.en)}
                        </div>
                    </div>
                `;

                this.updateModalCompareBtn();
                document.getElementById('elementModal').classList.remove('hidden');
                document.body.style.overflow = 'hidden'; // Prevent background scroll
            },

            updateModalCompareBtn() {
                const btn = document.getElementById('modalToggleCompareBtn');
                if (UIState.compareList.includes(UIState.selectedZ)) {
                    btn.className = "w-full py-2.5 rounded-md text-sm font-bold transition-all bg-red-500/20 text-red-400 border border-red-500/50 hover:bg-red-500/30 touch-manipulation";
                    btn.innerText = "- Remove from Compare";
                } else {
                    btn.className = "w-full py-2.5 rounded-md text-sm font-bold transition-all bg-blue-600 hover:bg-blue-500 text-white shadow-lg touch-manipulation";
                    btn.innerText = "+ Add to Compare";
                }
                btn.onclick = () => {
                    UIState.toggleCompare(UIState.selectedZ);
                    this.updateModalCompareBtn();
                };
            },

            closeModals() {
                document.getElementById('elementModal').classList.add('hidden');
                document.getElementById('compareModal').classList.add('hidden');
                document.body.style.overflow = ''; // Restore background scroll
                UIState.selectedZ = null;
            },

            renderCompareTrends() {
                // Populate Select
                const sel = document.getElementById('compareSelect');
                sel.innerHTML = '<option value="">-- Select an element to add --</option>';
                ChemistryEngine.elementsList.forEach(e => {
                    if (!UIState.compareList.includes(e.z)) {
                        sel.innerHTML += `<option value="${e.z}">${e.z} - ${e.sym} (${e.mass})</option>`;
                    }
                });

                // Render Chips
                const chipsDiv = document.getElementById('compareChips');
                if (UIState.compareList.length === 0) {
                    chipsDiv.innerHTML = `<span class="text-slate-500 text-sm italic py-1">No elements selected. Add elements to begin.</span>`;
                } else {
                    chipsDiv.innerHTML = UIState.compareList.map(z => `
                        <div class="flex items-center gap-2 bg-slate-800 border border-slate-600 px-3 py-1.5 rounded-full text-sm font-bold text-slate-200">
                            ${ChemistryEngine.get(z).sym}
                            <button onclick="UIState.toggleCompare(${z})" class="text-red-400 hover:text-red-300 ml-1 bg-red-400/10 rounded-full w-6 h-6 flex items-center justify-center touch-manipulation">×</button>
                        </div>`).join('');
                }

                // Render Math Trends
                const makeTrend = (propKey, label, customClass = "bg-slate-800 border-slate-700") => {
                    let html = `<div class="p-3 rounded-lg border ${customClass}">
                                  <div class="text-xs ${customClass.includes('indigo') ? 'text-indigo-300 font-bold' : 'text-slate-400'} mb-1.5">${label}</div>`;

                    if (UIState.compareList.length < 2) return html + `<span class="text-slate-500 italic text-sm">Add more elements...</span></div>`;

                    const valArray = UIState.compareList.map(z => ({ sym: ChemistryEngine.get(z).sym, val: ChemistryEngine.get(z).computed[propKey] }))
                                                        .filter(e => e.val !== null);
                    
                    if (valArray.length === 0) return html + `<span class="text-slate-500 italic text-sm">No data for selected elements</span></div>`;
                    if (valArray.length === 1) return html + `<span class="text-slate-500 italic text-sm">Needs 2+ valid elements</span></div>`;

                    valArray.sort((a, b) => a.val - b.val);
                    let trendStr = "";
                    for (let i = 0; i < valArray.length; i++) {
                        if (i === 0) trendStr += valArray[i].sym;
                        else trendStr += `<span class="text-slate-500 mx-1">${valArray[i].val === valArray[i-1].val ? '=' : '&lt;'}</span>${valArray[i].sym}`;
                    }

                    return html + `<div class="text-emerald-300 font-mono tracking-widest text-sm leading-relaxed overflow-x-auto whitespace-nowrap hide-scrollbar-on-mobile pb-1">${trendStr}</div></div>`;
                };

                document.getElementById('trendsContainer').innerHTML = `
                    ${makeTrend('reactivity', 'Thermodynamic Eagerness (Approx)', 'bg-indigo-900/30 border-indigo-500/40 shadow-inner')}
                    ${makeTrend('stability', 'Relative Stability (Approx)', 'bg-indigo-900/30 border-indigo-500/40 shadow-inner')}
                    ${makeTrend('rad', 'Atomic Radius (Empirical)')}
                    ${makeTrend('zeff', 'Simplified Zeff (Valence Pull)')}
                    ${makeTrend('density', 'Charge Density Approx.')}
                    ${makeTrend('en', 'Pauling Electronegativity')}
                    ${makeTrend('ea', 'Electron Affinity')}
                    ${makeTrend('ie1', '1st Ionisation Energy')}
                    ${makeTrend('ie2', '2nd Ionisation Energy')}
                    ${makeTrend('ie3', '3rd Ionisation Energy')}
                    ${makeTrend('mp', 'Melting Point')}
                    ${makeTrend('bp', 'Boiling Point')}
                    ${makeTrend('physDensity', 'Physical Density')}
                `;
            }
        };

        // Initialize Application
        window.onload = () => RenderEngine.init();

    </script>
</body>
</html>
