<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Study Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
            }
          }
        }
      }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-indigo-500/30 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ==========================================
        // 1. Google Web App URL (আপনার নতুন Apps Script URL এখানে দিন)
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyGMQ-cdbw4GTx2vN01KEqaAoVENMjc6Ulk5sXMFr9Kc3Nl83TojZe0GDSzlEreFAT5/exec"; 
        
        function App() {
            // Theme State
            const [theme, setTheme] = useState(localStorage.getItem('scc_theme') || 'light');

            // Login & Auth State
            const [userLoggedIn, setUserLoggedIn] = useState(localStorage.getItem('study_user_id') || null);
            const [userPassword, setUserPassword] = useState(localStorage.getItem('study_user_pwd') ? atob(localStorage.getItem('study_user_pwd')) : null);
            
            const [loginInput, setLoginInput] = useState('');
            const [passInput, setPassInput] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');

            // App States
            const [chapters, setChapters] = useState([]);
            const [activeSubject, setActiveSubject] = useState('All Subjects');
            const [activePaper, setActivePaper] = useState('All');
            const [viewMode, setViewMode] = useState('tiles'); 
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All Statuses');
            const [confidenceFilter, setConfidenceFilter] = useState('All Levels');
            
            const [loading, setLoading] = useState(false);
            const [pendingUpdates, setPendingUpdates] = useState({});
            const [syncStatus, setSyncStatus] = useState('synced');
            const autoSaveTimerRef = useRef(null);

            // ================== THEME EFFECT ==================
            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('scc_theme', theme);
            }, [theme]);

            const toggleTheme = () => {
                setTheme(prev => prev === 'dark' ? 'light' : 'dark');
            };

            // ================== AUTHENTICATION ==================
            const validatePassword = (pass) => {
                if(pass.length < 6) return "Password must be at least 6 characters long.";
                if(!/\d/.test(pass) || !/[a-zA-Z]/.test(pass)) return "Password must contain both letters and numbers.";
                return null;
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                
                if(loginInput.trim().length < 3) return setAuthError("Student ID must be at least 3 characters.");
                
                const passError = validatePassword(passInput);
                if(passError) return setAuthError(passError);

                setAuthLoading(true);
                const formattedId = loginInput.trim().replace(/\s+/g, '_');

                if (WEB_APP_URL && WEB_APP_URL !== "YOUR_WEB_APP_URL_HERE") {
                    try {
                        const response = await fetch(WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'login', userId: formattedId, password: passInput }),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                        });
                        const data = await response.json();
                        
                        if(data.error) throw new Error(data.error);

                        // Success Login / Registration
                        localStorage.setItem('study_user_id', formattedId);
                        localStorage.setItem('study_user_pwd', btoa(passInput)); // Basic local obfuscation
                        setUserLoggedIn(formattedId);
                        setUserPassword(passInput);
                    } catch (error) {
                        setAuthError(error.message || "Failed to connect to the server.");
                    }
                } else {
                    setAuthError("Backend URL is missing. Please configure WEB_APP_URL.");
                }
                setAuthLoading(false);
            };

            const handleLogout = () => {
                localStorage.removeItem('study_user_id');
                localStorage.removeItem('study_user_pwd');
                setUserLoggedIn(null);
                setUserPassword(null);
                setChapters([]);
                setAuthError('');
            };

            // ================== DATA FETCHING ==================
            useEffect(() => {
                if (!userLoggedIn || !userPassword) return;
                
                const fetchData = async () => {
                    setLoading(true);
                    try {
                        const response = await fetch(WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'fetch', userId: userLoggedIn, password: userPassword }),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                        });
                        const data = await response.json();
                        
                        if(data.error) {
                            if(data.error.includes('Authentication')) handleLogout();
                            throw new Error(data.error);
                        }
                        
                        setChapters(data);
                        setSyncStatus('synced');
                    } catch (error) {
                        console.error("Error fetching data:", error);
                        setSyncStatus('error');
                    }
                    setLoading(false);
                };
                fetchData();
            }, [userLoggedIn, userPassword]);

            // ================== AUTO SAVE & QUEUE ==================
            useEffect(() => {
                const updatesCount = Object.keys(pendingUpdates).length;
                if (updatesCount === 0) return;
                
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                autoSaveTimerRef.current = setTimeout(() => {
                    handleManualSave();
                }, 3000); 
                return () => clearTimeout(autoSaveTimerRef.current);
            }, [pendingUpdates]);

            const handleManualSave = async () => {
                const updatesArray = Object.values(pendingUpdates);
                if (updatesArray.length === 0 || syncStatus === 'saving') return;
                
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                setSyncStatus('saving');

                try {
                    const payload = {
                        action: 'save',
                        userId: userLoggedIn,
                        password: userPassword,
                        updates: updatesArray
                    };
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    if(data.error) throw new Error(data.error);

                    setPendingUpdates({});
                    setSyncStatus('synced');
                } catch (error) {
                    console.error("Save failed:", error);
                    setSyncStatus('error');
                }
            };

            const updateChapter = (id, field, value) => {
                setChapters(prev => prev.map(ch => {
                    if (ch.id === id) {
                        if (field.includes('.')) {
                            const [parent, child] = field.split('.');
                            return { ...ch, [parent]: { ...ch[parent], [child]: value } };
                        }
                        return { ...ch, [field]: value };
                    }
                    return ch;
                }));

                setPendingUpdates(prev => {
                    // rowNum এর পরিবর্তে শুধু id পাঠানো হচ্ছে
                    const chapterInfo = chapters.find(c => c.id === id);
                    const currentChapterQueue = prev[id] || { id: id, rowNum: chapterInfo.rowNum };
                    if (field.includes('.')) {
                        const [parent, child] = field.split('.');
                        currentChapterQueue[parent] = currentChapterQueue[parent] || {};
                        currentChapterQueue[parent][child] = value;
                    } else {
                        currentChapterQueue[field] = value;
                    }
                    return { ...prev, [id]: currentChapterQueue };
                });
                setSyncStatus('unsaved');
            };

            // ================== RENDER HELPERS ==================
            const subjectsList = Array.from(new Set(chapters.map(ch => ch.subject))).filter(s => s !== 'Unknown');
            const papersList = activeSubject !== 'All Subjects' 
                ? Array.from(new Set(chapters.filter(c => c.subject === activeSubject).map(c => c.paper))) : [];

            const getSubjectColor = (sub) => {
                switch(sub) {
                    case 'Physics': return 'text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30 border-indigo-200 dark:border-indigo-700/50';
                    case 'Chemistry': return 'text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-700/50';
                    case 'Higher Math': return 'text-sky-600 dark:text-sky-400 bg-sky-50 dark:bg-sky-900/30 border-sky-200 dark:border-sky-700/50';
                    case 'Biology': return 'text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 border-rose-200 dark:border-rose-700/50';
                    default: return 'text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };

            const getHeaderStyle = (sub) => {
                switch(sub) {
                    case 'All Subjects': return 'bg-gradient-to-r from-blue-900 via-indigo-900 to-violet-900 dark:from-blue-950 dark:via-indigo-950 dark:to-violet-950';
                    case 'Physics': return 'bg-gradient-to-r from-indigo-900 to-indigo-700 dark:from-indigo-950 dark:to-indigo-800';
                    case 'Chemistry': return 'bg-gradient-to-r from-emerald-900 to-teal-800 dark:from-emerald-950 dark:to-teal-900';
                    case 'Higher Math': return 'bg-gradient-to-r from-blue-900 to-cyan-800 dark:from-blue-950 dark:to-cyan-900';
                    case 'Biology': return 'bg-gradient-to-r from-rose-900 to-pink-800 dark:from-rose-950 dark:to-pink-900';
                    default: return 'bg-gradient-to-r from-slate-900 to-slate-700 dark:from-slate-950 dark:to-slate-800';
                }
            };

            const filteredChapters = chapters.filter(ch => {
                if (activeSubject !== 'All Subjects' && ch.subject !== activeSubject) return false;
                if (activePaper !== 'All' && ch.paper !== activePaper) return false;
                if (statusFilter !== 'All Statuses' && ch.status !== statusFilter) return false;
                if (confidenceFilter !== 'All Levels' && ch.confidence !== confidenceFilter) return false;
                const searchLower = searchTerm.toLowerCase();
                return ch.titleEn.toLowerCase().includes(searchLower) || ch.titleBn.includes(searchLower);
            });

            const actionQueueChapters = chapters.filter(ch => ch.status === 'Started' || ch.confidence === 'Low');

            // ==========================================
            // SECURE LOGIN SCREEN
            // ==========================================
            if (!userLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="absolute top-4 right-4">
                            <button onClick={toggleTheme} className="w-10 h-10 rounded-full bg-white dark:bg-slate-800 shadow flex items-center justify-center text-slate-600 dark:text-slate-300 transition hover:bg-slate-100 dark:hover:bg-slate-700">
                                {theme === 'dark' ? <i className="fa-solid fa-sun"></i> : <i className="fa-solid fa-moon"></i>}
                            </button>
                        </div>
                        <div className="bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200 dark:border-slate-800 relative overflow-hidden transition-colors">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-cyan-500"></div>
                            
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-indigo-50 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-100 dark:border-slate-700">
                                    <i className="fa-solid fa-shield-halved text-3xl text-indigo-600 dark:text-indigo-500"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-slate-800 dark:text-white">SCC Secure Portal</h1>
                                <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Universal Study Command Center</p>
                            </div>

                            {authError && (
                                <div className="bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800/50 text-rose-700 dark:text-rose-400 px-4 py-3 rounded-xl text-sm mb-6 flex items-start gap-2">
                                    <i className="fa-solid fa-circle-exclamation mt-0.5"></i> {authError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Student ID / Username</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                                        <input 
                                            type="text" required placeholder="e.g. Student_01"
                                            value={loginInput} onChange={e => setLoginInput(e.target.value)}
                                            className="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl pl-10 pr-4 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-medium"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">Password</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                                        <input 
                                            type={showPass ? "text" : "password"} required placeholder="Enter password"
                                            value={passInput} onChange={e => setPassInput(e.target.value)}
                                            className="w-full bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-800 rounded-xl pl-10 pr-10 py-3 text-slate-800 dark:text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition font-medium"
                                        />
                                        <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300">
                                            <i className={`fa-solid ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                    <p className="text-[10px] text-slate-500 mt-2 font-medium">
                                        <i className="fa-solid fa-circle-info"></i> If you are new, this password will be securely set for your account. Minimum 6 chars.
                                    </p>
                                </div>

                                <button type="submit" disabled={authLoading} className="w-full bg-indigo-600 text-white rounded-xl py-3.5 font-bold hover:bg-indigo-700 dark:hover:bg-indigo-500 transition shadow-lg shadow-indigo-200 dark:shadow-indigo-900/20 disabled:opacity-70 flex items-center justify-center gap-2">
                                    {authLoading ? <><i className="fa-solid fa-spinner fa-spin"></i> Authenticating...</> : <><i className="fa-solid fa-right-to-bracket"></i> Secure Access</>}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // MAIN DASHBOARD RENDER
            // ==========================================
            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-4 text-slate-500 dark:text-slate-300">
                        <i className="fa-solid fa-satellite-dish text-4xl text-indigo-500 animate-pulse"></i>
                        <p className="font-bold tracking-wider">Decrypting & Loading Data...</p>
                    </div>
                );
            }

            return (
                <div className="pb-20 relative min-h-screen transition-colors">
                    <div className="p-4 md:p-6 lg:p-8 max-w-[1400px] mx-auto space-y-6 pt-8">
                        
                        {/* USER PROFILE & ONLINE OPERATOR RIBBON (Merged with Buttons and Sync Pill) */}
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center bg-white dark:bg-slate-900 px-5 py-3 rounded-2xl shadow-sm dark:shadow-lg border border-slate-200 dark:border-slate-800 transition-colors gap-4">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-cyan-500 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-inner">
                                    {userLoggedIn.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div className="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Operator Online</div>
                                    <div className="font-bold text-slate-800 dark:text-slate-200">{userLoggedIn}</div>
                                </div>
                            </div>
                            
                            <div className="flex flex-wrap gap-2 items-center w-full md:w-auto justify-end">
                                {/* SYNC PILL (Inside the ribbon) */}
                                <div className="mr-1 md:mr-3">
                                    {syncStatus === 'unsaved' && (
                                        <button onClick={handleManualSave} className="flex items-center gap-2 bg-yellow-500 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-xl shadow font-bold transition-transform hover:scale-105 active:scale-95 animate-pulse-ring text-xs md:text-sm">
                                            <i className="fa-solid fa-cloud-arrow-up"></i> Save
                                            <span className="bg-black/20 px-1.5 py-0.5 rounded text-[10px] ml-1 text-white">{Object.keys(pendingUpdates).length}</span>
                                        </button>
                                    )}
                                    {syncStatus === 'saving' && (
                                        <div className="flex items-center gap-2 bg-blue-600 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-xl shadow font-bold text-xs md:text-sm"><i className="fa-solid fa-spinner fa-spin"></i> Saving...</div>
                                    )}
                                    {syncStatus === 'synced' && (
                                        <div className="flex items-center gap-1.5 bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/30 text-emerald-600 dark:text-emerald-400 px-3 md:px-4 py-1.5 md:py-2 rounded-xl shadow-sm font-bold text-xs md:text-sm"><i className="fa-solid fa-check-circle"></i> Synced</div>
                                    )}
                                    {syncStatus === 'error' && (
                                        <button onClick={handleManualSave} className="flex items-center gap-2 bg-rose-500 text-white px-3 md:px-4 py-1.5 md:py-2 rounded-xl shadow font-bold text-xs md:text-sm"><i className="fa-solid fa-triangle-exclamation"></i> Retry</button>
                                    )}
                                </div>

                                {/* THEME TOGGLE BUTTON */}
                                <button onClick={toggleTheme} className="w-9 h-9 md:w-10 md:h-10 rounded-xl flex items-center justify-center text-slate-500 hover:text-indigo-600 dark:text-slate-400 dark:hover:text-indigo-400 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 transition">
                                    {theme === 'dark' ? <i className="fa-solid fa-sun"></i> : <i className="fa-solid fa-moon"></i>}
                                </button>
                                
                                {/* LOGOUT BUTTON */}
                                <button onClick={handleLogout} className="w-9 h-9 md:h-10 md:w-auto md:px-4 flex items-center justify-center gap-2 text-sm font-bold bg-slate-50 dark:bg-slate-800 text-rose-500 hover:bg-rose-600 dark:hover:bg-rose-400 rounded-xl transition border border-slate-200 dark:border-slate-700">
                                    <i className="fa-solid fa-power-off"></i> <span className="hidden md:inline">Logout</span>
                                </button>
                            </div>
                        </div>

                        {/* Top Subject Navigation Ribbon */}
                        <div className="bg-white dark:bg-slate-900 rounded-full shadow-sm dark:shadow-lg border border-slate-200 dark:border-slate-800 p-1.5 flex items-center gap-1 overflow-x-auto custom-scrollbar transition-colors">
                            <button onClick={() => { setActiveSubject('All Subjects'); setActivePaper('All'); }} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold transition whitespace-nowrap ${activeSubject === 'All Subjects' ? 'bg-slate-800 dark:bg-indigo-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
                                <i className="fa-solid fa-layer-group"></i> All Subjects Hub
                            </button>
                            <div className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-2"></div>
                            {subjectsList.map((sub, idx) => {
                                const subTotal = chapters.filter(c => c.subject === sub).length;
                                const subCompleted = chapters.filter(c => c.subject === sub && c.status === 'Completed').length;
                                const subProgress = subTotal === 0 ? 0 : Math.round((subCompleted / subTotal) * 100);
                                return (
                                    <button key={idx} onClick={() => { setActiveSubject(sub); setActivePaper('All'); }} className={`flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-medium transition whitespace-nowrap ${activeSubject === sub ? 'bg-indigo-50 dark:bg-slate-800 text-indigo-700 dark:text-indigo-400 border border-indigo-200 dark:border-slate-700 shadow-sm' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 border border-transparent'}`}>
                                        {sub} <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${activeSubject === sub ? 'bg-indigo-100 dark:bg-slate-700 text-indigo-800 dark:text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}`}>{subProgress}% ({subTotal})</span>
                                    </button>
                                )
                            })}
                        </div>

                        {/* UNIVERSAL DASHBOARD VIEW */}
                        {activeSubject === 'All Subjects' && (
                            <div className="space-y-8">
                                <div className={`${getHeaderStyle('All Subjects')} rounded-3xl p-6 md:p-10 text-white shadow-xl relative overflow-hidden`}>
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-white dark:bg-indigo-500 opacity-10 rounded-full -translate-y-1/2 translate-x-1/3 blur-3xl"></div>
                                    <div className="relative z-10">
                                        <div className="flex items-center gap-3 mb-2 opacity-80 dark:text-indigo-400 dark:opacity-100">
                                            <i className="fa-solid fa-earth-americas"></i>
                                            <span className="text-sm font-medium tracking-wide uppercase">Universal Multi-Subject Master Hub</span>
                                        </div>
                                        <h1 className="text-3xl md:text-5xl font-extrabold mb-4">Study Command Center</h1>
                                        <p className="max-w-2xl text-slate-200 dark:text-slate-400 text-sm md:text-base">Track syllabus mastery, chapters, topics, Written practice, MCQ practice, Question Bank solves, and revision counters securely.</p>
                                    </div>
                                </div>

                                <div>
                                    <div className="flex items-center gap-2 mb-4 text-slate-700 dark:text-slate-300">
                                        <i className="fa-solid fa-satellite-dish text-indigo-600 dark:text-indigo-500"></i>
                                        <h2 className="text-lg font-bold">All Subject Study Command Hubs</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {subjectsList.map(sub => {
                                            const subChaps = chapters.filter(c => c.subject === sub);
                                            const subCompleted = subChaps.filter(c => c.status === 'Completed').length;
                                            const progress = subChaps.length === 0 ? 0 : Math.round((subCompleted / subChaps.length) * 100);

                                            return (
                                                <div key={sub} className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm dark:shadow-lg hover:shadow-md dark:hover:border-slate-600 transition-all group cursor-pointer" onClick={() => setActiveSubject(sub)}>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <div className="flex items-center gap-3">
                                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center font-extrabold text-lg ${getSubjectColor(sub).replace('border-', 'bg-opacity-20 ')}`}>{sub.substring(0, 2).toUpperCase()}</div>
                                                            <div>
                                                                <h3 className="font-bold text-slate-800 dark:text-slate-200 leading-tight">{sub}</h3>
                                                                <p className="text-xs text-slate-500 font-medium">{subChaps.length} Chapters</p>
                                                            </div>
                                                        </div>
                                                        <span className={`font-black text-xl ${getSubjectColor(sub).split(' ')[0]}`}>{progress}%</span>
                                                    </div>
                                                    <div className="w-full bg-slate-100 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                                                        <div className={`h-full rounded-full ${getSubjectColor(sub).split(' ')[0].replace('text', 'bg')}`} style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm dark:shadow-lg">
                                    <div className="flex items-center justify-between mb-6 border-b border-slate-100 dark:border-slate-800 pb-4">
                                        <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800 dark:text-slate-200"><i className="fa-solid fa-clock-rotate-left text-orange-500"></i> Action Queue: Weak Topics & In-Progress</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                                        {actionQueueChapters.slice(0, 6).map(chapter => <ChapterCard key={chapter.id} chapter={chapter} onUpdate={updateChapter} subjectColor={getSubjectColor(chapter.subject)} />)}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SPECIFIC SUBJECT DASHBOARD VIEW */}
                        {activeSubject !== 'All Subjects' && (
                            <div className="space-y-6">
                                <div className={`${getHeaderStyle(activeSubject)} rounded-3xl p-8 text-white shadow-xl relative`}>
                                    <div className="flex flex-col justify-between items-start gap-4 relative z-10">
                                        <div className="flex items-center gap-2 text-white/70 dark:text-slate-400 text-sm mb-1 font-medium">
                                            <button onClick={() => setActiveSubject('All Subjects')} className="hover:text-white transition"><i className="fa-solid fa-layer-group"></i> All Subjects</button>
                                            <span>/</span> <span className="dark:text-slate-200">{activeSubject}</span>
                                        </div>
                                        <h1 className="text-4xl font-extrabold flex items-center gap-3"><i className="fa-solid fa-book-open opacity-80"></i> {activeSubject} Command Center</h1>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <button onClick={() => setActivePaper('All')} className={`p-5 rounded-2xl border text-left transition-all ${activePaper === 'All' ? 'bg-indigo-50 border-indigo-500 dark:bg-slate-800 dark:border-indigo-500 shadow-md ring-2 ring-indigo-500 ring-offset-2 dark:ring-offset-slate-950' : 'bg-white border-slate-200 dark:bg-slate-900 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-slate-600'}`}>
                                            <div className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider mb-2">Overview</div>
                                            <div className="font-bold text-xl text-slate-800 dark:text-slate-200">All Papers Combined</div>
                                        </button>
                                        {papersList.map(paper => {
                                            const pChaps = chapters.filter(c => c.subject === activeSubject && c.paper === paper);
                                            const pComp = pChaps.filter(c => c.status === 'Completed').length;
                                            const pProg = pChaps.length === 0 ? 0 : Math.round((pComp / pChaps.length) * 100);
                                            return (
                                                <button key={paper} onClick={() => setActivePaper(paper)} className={`p-5 rounded-2xl border text-left transition-all ${activePaper === paper ? 'bg-indigo-50 border-indigo-500 dark:bg-slate-800 dark:border-indigo-500 shadow-md ring-2 ring-indigo-500 ring-offset-2 dark:ring-offset-slate-950' : 'bg-white border-slate-200 dark:bg-slate-900 dark:border-slate-800 hover:border-indigo-300 dark:hover:border-slate-600'}`}>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <div className="font-bold text-xl text-slate-800 dark:text-slate-200">{paper}</div>
                                                        <div className="font-black text-xl text-indigo-900 dark:text-indigo-400">{pProg}%</div>
                                                    </div>
                                                    <div className="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full mt-4"><div className="bg-indigo-500 h-2 rounded-full" style={{width: `${pProg}%`}}></div></div>
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>

                                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm dark:shadow-lg border border-slate-200 dark:border-slate-800 p-2 flex flex-col lg:flex-row gap-4 items-center justify-between">
                                    <div className="flex items-center p-1 bg-slate-100 dark:bg-slate-950 rounded-xl w-full lg:w-auto">
                                        <button onClick={() => setViewMode('tiles')} className={`flex-1 flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'tiles' ? 'bg-white text-indigo-700 dark:bg-slate-800 dark:text-indigo-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}><i className="fa-solid fa-border-all"></i> Interactive Tiles</button>
                                        <button onClick={() => setViewMode('table')} className={`flex-1 flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'table' ? 'bg-white text-indigo-700 dark:bg-slate-800 dark:text-indigo-400 shadow-sm' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}><i className="fa-solid fa-table-list"></i> Master Table</button>
                                    </div>
                                    <div className="flex-1 w-full flex flex-col md:flex-row items-center gap-3 px-2">
                                        <div className="relative flex-1 w-full">
                                            <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500"></i>
                                            <input type="text" placeholder="Search chapter or topic..." className="w-full bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                        </div>
                                    </div>
                                </div>

                                {viewMode === 'tiles' ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                                        {filteredChapters.map((chapter) => <ChapterCard key={chapter.id} chapter={chapter} onUpdate={updateChapter} subjectColor={getSubjectColor(chapter.subject)} />)}
                                    </div>
                                ) : (
                                    <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm dark:shadow-xl overflow-hidden overflow-x-auto">
                                        <table className="w-full text-left text-sm whitespace-nowrap text-slate-700 dark:text-slate-300">
                                            <thead className="bg-slate-100 dark:bg-slate-950 text-slate-500 font-bold uppercase text-[10px] border-b border-slate-200 dark:border-slate-800 tracking-wider">
                                                <tr>
                                                    <th className="px-5 py-4">Chapter</th>
                                                    <th className="px-5 py-4">Status</th>
                                                    <th className="px-5 py-4 text-center">Theory</th>
                                                    <th className="px-5 py-4 text-center">Textbook</th>
                                                    <th className="px-5 py-4 text-center">CQ</th>
                                                    <th className="px-5 py-4 text-center">QB Solves</th>
                                                    <th className="px-5 py-4">Confidence</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800/50">
                                                {filteredChapters.map(ch => (
                                                    <tr key={ch.id} className="hover:bg-indigo-50/50 dark:hover:bg-slate-800/50 transition-colors">
                                                        <td className="px-5 py-4"><div className="font-bold text-slate-800 dark:text-slate-200 text-base">{ch.titleEn}</div><div className="text-[11px] font-medium text-slate-500">{ch.paper} • Ch {ch.chapterNo}</div></td>
                                                        <td className="px-5 py-4">
                                                            <select value={ch.status} onChange={(e) => updateChapter(ch.id, 'status', e.target.value)} className="text-sm font-bold bg-transparent dark:bg-slate-900 outline-none cursor-pointer text-indigo-700 dark:text-indigo-400 border border-transparent dark:border-slate-700 rounded p-1">
                                                                <option value="Not Started">Not Started</option><option value="Started">Started</option><option value="Completed">Completed</option>
                                                            </select>
                                                        </td>
                                                        <td className="px-5 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.theory', !ch.milestones.theory)}>{ch.milestones.theory ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-5 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.textbook', !ch.milestones.textbook)}>{ch.milestones.textbook ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-5 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.written', !ch.milestones.written)}>{ch.milestones.written ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}</td>
                                                        <td className="px-5 py-4 text-center">
                                                            <div className="flex items-center justify-center gap-3 bg-slate-50 dark:bg-slate-950 p-1.5 rounded-lg border border-slate-200 dark:border-slate-800">
                                                                <button onClick={() => updateChapter(ch.id, 'qbSolved', Math.max(0, ch.qbSolved - 1))} className="text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 w-6 h-6 flex items-center justify-center bg-white dark:bg-slate-800 rounded shadow-sm font-bold">-</button>
                                                                <span className="font-bold w-4 text-indigo-900 dark:text-indigo-400">{ch.qbSolved}</span>
                                                                <button onClick={() => updateChapter(ch.id, 'qbSolved', ch.qbSolved + 1)} className="text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 w-6 h-6 flex items-center justify-center bg-white dark:bg-slate-800 rounded shadow-sm font-bold">+</button>
                                                            </div>
                                                        </td>
                                                        <td className="px-5 py-4"><select value={ch.confidence} onChange={(e) => updateChapter(ch.id, 'confidence', e.target.value)} className="text-sm font-bold bg-transparent dark:bg-slate-900 border border-transparent dark:border-slate-700 rounded p-1 outline-none cursor-pointer text-slate-700 dark:text-slate-300"><option value="Unrated">Unrated</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // SUB-COMPONENTS
        // ==========================================
        function ChapterCard({ chapter, onUpdate, subjectColor }) {
            const { id, subject, paper, chapterNo, titleEn, titleBn, status, milestones, qbSolved, revisions, writtenScore, mcqScore, confidence } = chapter;
            const [localWritten, setLocalWritten] = useState(writtenScore || '');
            const [localMcq, setLocalMcq] = useState(mcqScore || '');

            useEffect(() => { setLocalWritten(writtenScore || ''); }, [writtenScore]);
            useEffect(() => { setLocalMcq(mcqScore || ''); }, [mcqScore]);

            const toggleMilestone = (field) => onUpdate(id, `milestones.${field}`, !milestones[field]);

            const getConfidenceStyle = (conf) => {
                switch(conf) {
                    case 'High': return 'text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-700/50';
                    case 'Medium': return 'text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-700/50';
                    case 'Low': return 'text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 border-rose-200 dark:border-rose-700/50';
                    default: return 'text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };

            const getStatusColor = (stat) => {
                switch(stat) {
                    case 'Completed': return 'text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-500/50';
                    case 'Started': return 'text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-500/50';
                    default: return 'text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };

            return (
                <div className="bg-white dark:bg-slate-900 rounded-2xl shadow-sm dark:shadow-lg hover:shadow-md dark:hover:border-slate-600 transition-all duration-300 border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden group">
                    <div className="p-5 border-b border-slate-100 dark:border-slate-800/50">
                        <div className="flex justify-between items-start mb-4">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className={`text-[10px] font-bold px-2 py-1 rounded uppercase border ${subjectColor}`}>{subject}</span>
                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded border border-transparent dark:border-slate-700">{paper} • Ch {chapterNo}</span>
                            </div>
                            {confidence && confidence !== 'Unrated' && (
                                <span className={`text-[10px] font-bold px-2 py-1 rounded flex items-center gap-1 border ${getConfidenceStyle(confidence)}`}>
                                    {confidence === 'Low' && <i className="fa-solid fa-triangle-exclamation"></i>} {confidence}
                                </span>
                            )}
                        </div>

                        <h3 className="font-extrabold text-slate-800 dark:text-white text-lg leading-tight mb-1">{titleEn}</h3>
                        <p className="text-sm font-medium text-slate-500">{titleBn}</p>
                        
                        <div className="mt-5 flex items-center justify-between bg-slate-50 dark:bg-slate-950 p-2 rounded-xl border border-slate-100 dark:border-slate-800">
                            <span className="text-xs font-bold text-slate-500 ml-2">Status:</span>
                            <select value={status} onChange={(e) => onUpdate(id, 'status', e.target.value)} className={`text-xs font-bold px-3 py-1.5 rounded-lg border outline-none cursor-pointer appearance-none ${getStatusColor(status)}`}>
                                <option value="Not Started">Not Started</option><option value="Started">Started</option><option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div className="p-5 bg-slate-50/50 dark:bg-slate-800/20 flex-1">
                        <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3">Study Milestones</h4>
                        <div className="grid grid-cols-2 gap-2">
                            <MilestoneCheckbox label="Theory" checked={milestones.theory} onChange={() => toggleMilestone('theory')} />
                            <MilestoneCheckbox label="Textbook" checked={milestones.textbook} onChange={() => toggleMilestone('textbook')} />
                            <MilestoneCheckbox label="Written" checked={milestones.written} onChange={() => toggleMilestone('written')} />
                            <MilestoneCheckbox label="Question Bank" checked={milestones.questionBank} onChange={() => toggleMilestone('questionBank')} />
                        </div>

                        <div className="grid grid-cols-2 gap-3 mt-5">
                            <div className="bg-white dark:bg-slate-900 border border-yellow-100 dark:border-slate-700 rounded-xl p-3 shadow-sm dark:shadow-none">
                                <div className="flex items-center gap-1 text-[10px] font-bold text-yellow-600 dark:text-amber-500 uppercase mb-2"><i className="fa-solid fa-clock-rotate-left"></i> QB Solved</div>
                                <div className="flex items-center justify-between bg-yellow-50 dark:bg-slate-950 rounded-lg p-1.5 border border-yellow-200/50 dark:border-slate-800">
                                    <button onClick={() => onUpdate(id, 'qbSolved', Math.max(0, qbSolved - 1))} className="w-7 h-7 flex items-center justify-center text-yellow-700 dark:text-slate-400 bg-white dark:bg-slate-800 hover:text-slate-800 dark:hover:text-white rounded shadow-sm font-bold">-</button>
                                    <span className="font-extrabold text-yellow-900 dark:text-amber-500 text-lg">{qbSolved}</span>
                                    <button onClick={() => onUpdate(id, 'qbSolved', qbSolved + 1)} className="w-7 h-7 flex items-center justify-center text-yellow-700 dark:text-slate-400 bg-white dark:bg-slate-800 hover:text-slate-800 dark:hover:text-white rounded shadow-sm font-bold">+</button>
                                </div>
                            </div>
                            
                            <div className="bg-white dark:bg-slate-900 border border-blue-100 dark:border-slate-700 rounded-xl p-3 shadow-sm dark:shadow-none">
                                <div className="flex items-center gap-1 text-[10px] font-bold text-blue-600 dark:text-indigo-400 uppercase mb-2"><i className="fa-solid fa-rotate-right"></i> Revisions</div>
                                <div className="flex items-center justify-between bg-blue-50 dark:bg-slate-950 rounded-lg p-1.5 border border-blue-200/50 dark:border-slate-800">
                                    <button onClick={() => onUpdate(id, 'revisions', Math.max(0, revisions - 1))} className="w-7 h-7 flex items-center justify-center text-blue-700 dark:text-slate-400 bg-white dark:bg-slate-800 hover:text-slate-800 dark:hover:text-white rounded shadow-sm font-bold">-</button>
                                    <span className="font-extrabold text-blue-900 dark:text-indigo-400 text-lg">{revisions}</span>
                                    <button onClick={() => onUpdate(id, 'revisions', revisions + 1)} className="w-7 h-7 flex items-center justify-center text-blue-700 dark:text-slate-400 bg-white dark:bg-slate-800 hover:text-slate-800 dark:hover:text-white rounded shadow-sm font-bold">+</button>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-3 mt-5 pt-5 border-t border-slate-200/60 dark:border-slate-800">
                            <div>
                                <label className="text-[10px] text-slate-500 font-bold block mb-1">Written:</label>
                                <input type="text" placeholder="42" value={localWritten} onChange={(e) => setLocalWritten(e.target.value)} onBlur={() => onUpdate(id, 'writtenScore', localWritten)} className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-bold block mb-1">MCQ Score:</label>
                                <input type="text" placeholder="28/30" value={localMcq} onChange={(e) => setLocalMcq(e.target.value)} onBlur={() => onUpdate(id, 'mcqScore', localMcq)} className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-bold block mb-1">Conf:</label>
                                <select value={confidence} onChange={(e) => onUpdate(id, 'confidence', e.target.value)} className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center appearance-none cursor-pointer">
                                    <option value="Unrated">-</option><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MilestoneCheckbox({ label, checked, onChange }) {
            return (
                <div onClick={onChange} className={`flex items-center gap-2 p-2 rounded-xl border cursor-pointer transition-all ${checked ? 'bg-indigo-50 dark:bg-indigo-900/30 border-indigo-200 dark:border-indigo-500/50 text-indigo-700 dark:text-indigo-400 shadow-inner' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                    {checked ? <i className="fa-solid fa-circle-check text-indigo-600 text-lg"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600 text-lg"></i>}
                    <span className="text-[11px] font-bold leading-none select-none">{label}</span>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
