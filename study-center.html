<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Study Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
            }
          }
        }
      }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #64748b; }
        .glass-panel { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .animate-pulse-ring { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-indigo-500/30">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 1. Google Web App URL (আপনার নতুন Apps Script URL এখানে দিন)
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzjzpjBiGjDvmOK-2iJ3awi2fEG5Ap-e605LpYt969H609k4LVKqVN2Sf218SepcknO/exec"; 
        
        function App() {
            // Auth State
            const [userLoggedIn, setUserLoggedIn] = useState(localStorage.getItem('study_user_id') || null);
            const [userPassword, setUserPassword] = useState(localStorage.getItem('study_user_pwd') ? atob(localStorage.getItem('study_user_pwd')) : null);
            
            const [loginInput, setLoginInput] = useState('');
            const [passInput, setPassInput] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');

            // App States
            const [chapters, setChapters] = useState([]);
            const [activeSubject, setActiveSubject] = useState('All Subjects');
            const [activePaper, setActivePaper] = useState('All');
            const [viewMode, setViewMode] = useState('tiles'); 
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All Statuses');
            const [confidenceFilter, setConfidenceFilter] = useState('All Levels');
            
            const [loading, setLoading] = useState(false);
            const [pendingUpdates, setPendingUpdates] = useState({});
            const [syncStatus, setSyncStatus] = useState('synced');
            const [showResetModal, setShowResetModal] = useState(false);
            
            const autoSaveTimerRef = useRef(null);

            // ================== AUTHENTICATION ==================
            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');
                if(loginInput.trim().length < 3) return setAuthError("ID must be at least 3 characters.");
                if(passInput.length < 6) return setAuthError("Password must be at least 6 characters.");

                setAuthLoading(true);
                const formattedId = loginInput.trim().replace(/\s+/g, '_');

                if (WEB_APP_URL && WEB_APP_URL !== "YOUR_WEB_APP_URL_HERE") {
                    try {
                        const response = await fetch(WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'login', userId: formattedId, password: passInput }),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                        });
                        const data = await response.json();
                        if(data.error) throw new Error(data.error);

                        localStorage.setItem('study_user_id', formattedId);
                        localStorage.setItem('study_user_pwd', btoa(passInput));
                        setUserLoggedIn(formattedId);
                        setUserPassword(passInput);
                    } catch (error) {
                        setAuthError(error.message || "Connection failed.");
                    }
                } else {
                    setAuthError("Backend URL is missing.");
                }
                setAuthLoading(false);
            };

            const handleLogout = () => {
                localStorage.removeItem('study_user_id');
                localStorage.removeItem('study_user_pwd');
                setUserLoggedIn(null); setUserPassword(null); setChapters([]);
            };

            // ================== DATA FETCHING ==================
            const fetchWorkspaceData = async () => {
                setLoading(true);
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'fetch', userId: userLoggedIn, password: userPassword }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    if(data.error) {
                        if(data.error.includes('Authentication')) handleLogout();
                        throw new Error(data.error);
                    }
                    setChapters(data);
                    setSyncStatus('synced');
                } catch (error) {
                    console.error(error);
                    setSyncStatus('error');
                }
                setLoading(false);
            };

            useEffect(() => {
                if (userLoggedIn && userPassword) fetchWorkspaceData();
            }, [userLoggedIn, userPassword]);

            // ================== RESET PROGRESS ==================
            const executeReset = async () => {
                setShowResetModal(false);
                setLoading(true);
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'reset', userId: userLoggedIn, password: userPassword }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    if(data.error) throw new Error(data.error);
                    
                    setPendingUpdates({}); // ক্লিয়ার কিউ
                    await fetchWorkspaceData(); // নতুন ফ্রেশ ডেটা ফেচ
                } catch (error) {
                    alert("Reset Failed: " + error.message);
                }
                setLoading(false);
            };

            // ================== AUTO SAVE & QUEUE ==================
            useEffect(() => {
                if (Object.keys(pendingUpdates).length === 0) return;
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                autoSaveTimerRef.current = setTimeout(() => handleManualSave(), 3000); 
                return () => clearTimeout(autoSaveTimerRef.current);
            }, [pendingUpdates]);

            const handleManualSave = async () => {
                const updatesArray = Object.values(pendingUpdates);
                if (updatesArray.length === 0 || syncStatus === 'saving') return;
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                setSyncStatus('saving');

                try {
                    const payload = { action: 'save', userId: userLoggedIn, password: userPassword, updates: updatesArray };
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    if(data.error) throw new Error(data.error);
                    setPendingUpdates({});
                    setSyncStatus('synced');
                } catch (error) {
                    setSyncStatus('error');
                }
            };

            const updateChapter = (id, field, value) => {
                setChapters(prev => prev.map(ch => {
                    if (ch.id === id) {
                        if (field.includes('.')) {
                            const [parent, child] = field.split('.');
                            return { ...ch, [parent]: { ...ch[parent], [child]: value } };
                        }
                        return { ...ch, [field]: value };
                    }
                    return ch;
                }));

                setPendingUpdates(prev => {
                    const chapterInfo = chapters.find(c => c.id === id);
                    const currentChapterQueue = prev[id] || { rowNum: chapterInfo.rowNum };
                    if (field.includes('.')) {
                        const [parent, child] = field.split('.');
                        currentChapterQueue[parent] = currentChapterQueue[parent] || {};
                        currentChapterQueue[parent][child] = value;
                    } else {
                        currentChapterQueue[field] = value;
                    }
                    return { ...prev, [id]: currentChapterQueue };
                });
                setSyncStatus('unsaved');
            };

            // ================== RENDER HELPERS ==================
            const subjectsList = Array.from(new Set(chapters.map(ch => ch.subject))).filter(s => s !== 'Unknown');
            const papersList = activeSubject !== 'All Subjects' 
                ? Array.from(new Set(chapters.filter(c => c.subject === activeSubject).map(c => c.paper))) : [];

            const getSubjectColor = (sub) => {
                switch(sub) {
                    case 'Physics': return 'text-indigo-400 bg-indigo-900/30 border-indigo-700/50';
                    case 'Chemistry': return 'text-emerald-400 bg-emerald-900/30 border-emerald-700/50';
                    case 'Higher Math': return 'text-sky-400 bg-sky-900/30 border-sky-700/50';
                    case 'Biology': return 'text-rose-400 bg-rose-900/30 border-rose-700/50';
                    default: return 'text-slate-400 bg-slate-800 border-slate-700';
                }
            };

            const filteredChapters = chapters.filter(ch => {
                if (activeSubject !== 'All Subjects' && ch.subject !== activeSubject) return false;
                if (activePaper !== 'All' && ch.paper !== activePaper) return false;
                if (statusFilter !== 'All Statuses' && ch.status !== statusFilter) return false;
                if (confidenceFilter !== 'All Levels' && ch.confidence !== confidenceFilter) return false;
                const searchLower = searchTerm.toLowerCase();
                return ch.titleEn.toLowerCase().includes(searchLower) || ch.titleBn.includes(searchLower);
            });

            const actionQueueChapters = chapters.filter(ch => ch.status === 'In Progress' || ch.confidence === 'Low');

            // ==========================================
            // SECURE LOGIN SCREEN (DARK)
            // ==========================================
            if (!userLoggedIn) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-950 p-4 font-sans text-slate-200">
                        <div className="bg-slate-900 p-8 rounded-2xl shadow-2xl max-w-md w-full border border-slate-800 relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-500 to-cyan-500"></div>
                            
                            <div className="text-center mb-8">
                                <div className="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-slate-700">
                                    <i className="fa-solid fa-shield-halved text-3xl text-indigo-500"></i>
                                </div>
                                <h1 className="text-2xl font-bold text-white">SCC Secure Portal</h1>
                                <p className="text-slate-400 text-sm mt-1">Universal Study Command Center</p>
                            </div>

                            {authError && (
                                <div className="bg-rose-900/30 border border-rose-800/50 text-rose-400 px-4 py-3 rounded-xl text-sm mb-6 flex items-start gap-2">
                                    <i className="fa-solid fa-circle-exclamation mt-0.5"></i> {authError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-300 mb-1">Student ID / Username</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                                        <input 
                                            type="text" required placeholder="e.g. Student_01"
                                            value={loginInput} onChange={e => setLoginInput(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition font-medium"
                                        />
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold text-slate-300 mb-1">Password</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-500"></i>
                                        <input 
                                            type={showPass ? "text" : "password"} required placeholder="Enter password"
                                            value={passInput} onChange={e => setPassInput(e.target.value)}
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-10 pr-10 py-3 text-white focus:outline-none focus:border-indigo-500 transition font-medium"
                                        />
                                        <button type="button" onClick={() => setShowPass(!showPass)} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300">
                                            <i className={`fa-solid ${showPass ? 'fa-eye-slash' : 'fa-eye'}`}></i>
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" disabled={authLoading} className="w-full bg-indigo-600 text-white rounded-xl py-3.5 font-bold hover:bg-indigo-500 transition shadow-lg shadow-indigo-900/20 disabled:opacity-70 flex items-center justify-center gap-2">
                                    {authLoading ? <><i className="fa-solid fa-spinner fa-spin"></i> Authenticating...</> : <><i className="fa-solid fa-right-to-bracket"></i> Secure Access</>}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // ==========================================
            // MAIN DASHBOARD RENDER (DARK)
            // ==========================================
            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-4 bg-slate-950 text-slate-300">
                        <i className="fa-solid fa-satellite-dish text-4xl text-indigo-500 animate-pulse"></i>
                        <p className="font-bold tracking-wider">Syncing Data Securely...</p>
                    </div>
                );
            }

            return (
                <div className="pb-20 relative min-h-screen">
                    
                    {/* RESET CONFIRMATION MODAL */}
                    {showResetModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-sm p-4">
                            <div className="bg-slate-900 border border-rose-900/50 p-6 md:p-8 rounded-2xl shadow-2xl max-w-md w-full animate-fade-in text-center">
                                <div className="w-16 h-16 bg-rose-900/30 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/50">
                                    <i className="fa-solid fa-triangle-exclamation text-3xl text-rose-500"></i>
                                </div>
                                <h2 className="text-2xl font-bold text-white mb-2">Danger Zone</h2>
                                <p className="text-slate-400 text-sm mb-6">
                                    Are you absolutely sure you want to reset all your study progress? This action will permanently erase your checkmarks, scores, and revisions. <strong>This cannot be undone!</strong>
                                </p>
                                <div className="flex gap-3">
                                    <button onClick={() => setShowResetModal(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl transition">
                                        Cancel
                                    </button>
                                    <button onClick={executeReset} className="flex-1 bg-rose-600 hover:bg-rose-500 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-rose-900/50">
                                        Yes, Reset All
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FLOATING SAVE BUTTON */}
                    <div className="fixed bottom-6 right-6 md:top-6 md:bottom-auto md:right-8 z-50 flex flex-col gap-3 items-end">
                        {syncStatus === 'unsaved' && (
                            <button onClick={handleManualSave} className="flex items-center gap-2 bg-yellow-500 text-slate-900 px-5 py-2.5 rounded-full shadow-lg shadow-yellow-900/20 font-bold transition-transform hover:scale-105 active:scale-95 animate-pulse-ring">
                                <i className="fa-solid fa-cloud-arrow-up"></i> Save Progress
                                <span className="bg-slate-900/20 px-2 py-0.5 rounded-full text-xs ml-1">{Object.keys(pendingUpdates).length}</span>
                            </button>
                        )}
                        {syncStatus === 'saving' && (
                            <div className="flex items-center gap-2 bg-indigo-600 text-white px-5 py-2.5 rounded-full shadow-lg font-bold"><i className="fa-solid fa-spinner fa-spin"></i> Encrypting...</div>
                        )}
                        {syncStatus === 'synced' && (
                            <div className="flex items-center gap-2 bg-emerald-500/20 border border-emerald-500/50 text-emerald-400 px-4 py-2 rounded-full shadow-md font-medium text-sm backdrop-blur"><i className="fa-solid fa-check-circle"></i> Synced</div>
                        )}
                    </div>

                    <div className="p-4 md:p-6 lg:p-8 max-w-[1400px] mx-auto space-y-6 pt-16 md:pt-8">
                        
                        {/* USER PROFILE & LOGOUT RIBBON */}
                        <div className="flex justify-between items-center bg-slate-900 px-5 py-3 rounded-2xl shadow-lg border border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-cyan-500 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-inner">
                                    {userLoggedIn.charAt(0).toUpperCase()}
                                </div>
                                <div>
                                    <div className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Operator Online</div>
                                    <div className="font-bold text-slate-200">{userLoggedIn}</div>
                                </div>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowResetModal(true)} className="text-sm font-bold bg-slate-800 text-rose-400 hover:bg-slate-700 px-3 md:px-4 py-2 rounded-xl transition flex items-center gap-2 border border-slate-700">
                                    <i className="fa-solid fa-rotate-left"></i> <span className="hidden md:inline">Reset Data</span>
                                </button>
                                <button onClick={handleLogout} className="text-sm font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 px-3 md:px-4 py-2 rounded-xl transition flex items-center gap-2 border border-slate-700">
                                    <i className="fa-solid fa-power-off"></i> <span className="hidden md:inline">Logoff</span>
                                </button>
                            </div>
                        </div>

                        {/* Top Subject Navigation Ribbon */}
                        <div className="bg-slate-900 rounded-full shadow-lg border border-slate-800 p-1.5 flex items-center gap-1 overflow-x-auto custom-scrollbar">
                            <button onClick={() => { setActiveSubject('All Subjects'); setActivePaper('All'); }} className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold transition whitespace-nowrap ${activeSubject === 'All Subjects' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-400 hover:bg-slate-800'}`}>
                                <i className="fa-solid fa-layer-group"></i> Master Hub
                            </button>
                            <div className="w-px h-6 bg-slate-700 mx-2"></div>
                            {subjectsList.map((sub, idx) => {
                                const subTotal = chapters.filter(c => c.subject === sub).length;
                                const subCompleted = chapters.filter(c => c.subject === sub && c.status === 'Completed').length;
                                const subProgress = subTotal === 0 ? 0 : Math.round((subCompleted / subTotal) * 100);
                                return (
                                    <button key={idx} onClick={() => { setActiveSubject(sub); setActivePaper('All'); }} className={`flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-medium transition whitespace-nowrap ${activeSubject === sub ? 'bg-slate-800 text-indigo-400 border border-slate-700 shadow-sm' : 'text-slate-400 hover:bg-slate-800 border border-transparent'}`}>
                                        {sub} <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${activeSubject === sub ? 'bg-slate-700 text-white' : 'bg-slate-800 text-slate-500'}`}>{subProgress}%</span>
                                    </button>
                                )
                            })}
                        </div>

                        {/* UNIVERSAL DASHBOARD VIEW */}
                        {activeSubject === 'All Subjects' && (
                            <div className="space-y-8">
                                <div className="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 rounded-3xl p-6 md:p-10 text-white shadow-2xl border border-slate-800 relative overflow-hidden">
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-indigo-500 opacity-10 rounded-full -translate-y-1/2 translate-x-1/3 blur-3xl"></div>
                                    <div className="relative z-10">
                                        <div className="flex items-center gap-3 mb-2 text-indigo-400">
                                            <i className="fa-solid fa-earth-americas"></i>
                                            <span className="text-sm font-bold tracking-widest uppercase">System Overview</span>
                                        </div>
                                        <h1 className="text-3xl md:text-5xl font-black mb-4">Command Center</h1>
                                        <p className="max-w-2xl text-slate-400 text-sm md:text-base">Monitor your syllabus integrity, analyze weaknesses, and track combat readiness across all operational subjects.</p>
                                    </div>
                                </div>

                                <div>
                                    <div className="flex items-center gap-2 mb-4 text-slate-300">
                                        <i className="fa-solid fa-satellite-dish text-indigo-500"></i>
                                        <h2 className="text-lg font-bold">Subject Modules</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {subjectsList.map(sub => {
                                            const subChaps = chapters.filter(c => c.subject === sub);
                                            const subCompleted = subChaps.filter(c => c.status === 'Completed').length;
                                            const progress = subChaps.length === 0 ? 0 : Math.round((subCompleted / subChaps.length) * 100);
                                            const color = getSubjectColor(sub).split(' ')[0]; // text-color
                                            const bg = getSubjectColor(sub).split(' ')[1]; // bg-color

                                            return (
                                                <div key={sub} className="bg-slate-900 rounded-2xl border border-slate-800 p-5 shadow-lg hover:border-slate-600 transition-all group cursor-pointer" onClick={() => setActiveSubject(sub)}>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <div className="flex items-center gap-3">
                                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center font-black text-lg ${bg} ${color}`}>{sub.substring(0, 2).toUpperCase()}</div>
                                                            <div>
                                                                <h3 className="font-bold text-slate-200 leading-tight">{sub}</h3>
                                                                <p className="text-xs text-slate-500 font-medium">{subChaps.length} Nodes</p>
                                                            </div>
                                                        </div>
                                                        <span className={`font-black text-xl ${color}`}>{progress}%</span>
                                                    </div>
                                                    <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                                        <div className={`h-full rounded-full ${color.replace('text', 'bg')}`} style={{ width: `${progress}%` }}></div>
                                                    </div>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                <div className="bg-slate-900 rounded-2xl border border-slate-800 p-6 shadow-lg">
                                    <div className="flex items-center justify-between mb-6 border-b border-slate-800 pb-4">
                                        <h2 className="text-lg font-bold flex items-center gap-2 text-slate-200"><i className="fa-solid fa-triangle-exclamation text-amber-500"></i> Priority Action Queue</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                                        {actionQueueChapters.slice(0, 6).map(chapter => <ChapterCard key={chapter.id} chapter={chapter} onUpdate={updateChapter} subjectColor={getSubjectColor(chapter.subject)} />)}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* SPECIFIC SUBJECT DASHBOARD VIEW */}
                        {activeSubject !== 'All Subjects' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 rounded-3xl p-8 shadow-2xl border border-slate-800 relative">
                                    <div className="flex flex-col justify-between items-start gap-4 relative z-10">
                                        <div className="flex items-center gap-2 text-slate-400 text-sm mb-1 font-medium">
                                            <button onClick={() => setActiveSubject('All Subjects')} className="hover:text-white transition"><i className="fa-solid fa-layer-group"></i> Master Hub</button>
                                            <span>/</span> <span className="text-slate-200">{activeSubject}</span>
                                        </div>
                                        <h1 className="text-4xl font-black text-white flex items-center gap-3"><i className={`fa-solid fa-book-open opacity-80 ${getSubjectColor(activeSubject).split(' ')[0]}`}></i> {activeSubject} Modules</h1>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <button onClick={() => setActivePaper('All')} className={`p-5 rounded-2xl border text-left transition-all ${activePaper === 'All' ? 'bg-slate-800 border-indigo-500 shadow-lg' : 'bg-slate-900 border-slate-800 hover:border-slate-600'}`}>
                                        <div className="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Global View</div>
                                        <div className="font-bold text-xl text-slate-200">All Papers</div>
                                    </button>
                                    {papersList.map(paper => {
                                        const pChaps = chapters.filter(c => c.subject === activeSubject && c.paper === paper);
                                        const pComp = pChaps.filter(c => c.status === 'Completed').length;
                                        const pProg = pChaps.length === 0 ? 0 : Math.round((pComp / pChaps.length) * 100);
                                        return (
                                            <button key={paper} onClick={() => setActivePaper(paper)} className={`p-5 rounded-2xl border text-left transition-all ${activePaper === paper ? 'bg-slate-800 border-indigo-500 shadow-lg' : 'bg-slate-900 border-slate-800 hover:border-slate-600'}`}>
                                                <div className="flex justify-between items-start mb-2">
                                                    <div className="font-bold text-xl text-slate-200">{paper}</div>
                                                    <div className="font-black text-xl text-indigo-400">{pProg}%</div>
                                                </div>
                                                <div className="w-full bg-slate-800 h-2 rounded-full mt-4"><div className="bg-indigo-500 h-2 rounded-full" style={{width: `${pProg}%`}}></div></div>
                                            </button>
                                        )
                                    })}
                                </div>

                                <div className="bg-slate-900 rounded-2xl shadow-lg border border-slate-800 p-2 flex flex-col lg:flex-row gap-4 items-center justify-between">
                                    <div className="flex items-center p-1 bg-slate-950 rounded-xl w-full lg:w-auto">
                                        <button onClick={() => setViewMode('tiles')} className={`flex-1 flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'tiles' ? 'bg-slate-800 text-indigo-400 shadow-md' : 'text-slate-500 hover:text-slate-300'}`}><i className="fa-solid fa-border-all"></i> Interface</button>
                                        <button onClick={() => setViewMode('table')} className={`flex-1 flex items-center justify-center gap-2 px-5 py-2.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'table' ? 'bg-slate-800 text-indigo-400 shadow-md' : 'text-slate-500 hover:text-slate-300'}`}><i className="fa-solid fa-table-list"></i> Database</button>
                                    </div>
                                    <div className="flex-1 w-full flex flex-col md:flex-row items-center gap-3 px-2">
                                        <div className="relative flex-1 w-full">
                                            <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                                            <input type="text" placeholder="Search parameters..." className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-4 py-3 text-sm font-medium text-slate-200 focus:outline-none focus:border-indigo-500" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                                        </div>
                                    </div>
                                </div>

                                {viewMode === 'tiles' ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                                        {filteredChapters.map((chapter) => <ChapterCard key={chapter.id} chapter={chapter} onUpdate={updateChapter} subjectColor={getSubjectColor(chapter.subject)} />)}
                                    </div>
                                ) : (
                                    <div className="bg-slate-900 rounded-2xl border border-slate-800 shadow-xl overflow-hidden overflow-x-auto">
                                        <table className="w-full text-left text-sm whitespace-nowrap text-slate-300">
                                            <thead className="bg-slate-950 text-slate-500 font-bold uppercase text-[10px] border-b border-slate-800 tracking-wider">
                                                <tr>
                                                    <th className="px-5 py-4">Node</th>
                                                    <th className="px-5 py-4">Status</th>
                                                    <th className="px-5 py-4 text-center">Theory</th>
                                                    <th className="px-5 py-4 text-center">Textbk</th>
                                                    <th className="px-5 py-4 text-center">CQ</th>
                                                    <th className="px-5 py-4 text-center">QB Solves</th>
                                                    <th className="px-5 py-4">Conf</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800/50">
                                                {filteredChapters.map(ch => (
                                                    <tr key={ch.id} className="hover:bg-slate-800/50 transition-colors">
                                                        <td className="px-5 py-4"><div className="font-bold text-slate-200 text-base">{ch.titleEn}</div><div className="text-[11px] font-medium text-slate-500">{ch.paper} • Ch {ch.chapterNo}</div></td>
                                                        <td className="px-5 py-4"><select value={ch.status} onChange={(e) => updateChapter(ch.id, 'status', e.target.value)} className="text-sm font-bold bg-slate-900 border border-slate-700 rounded p-1 outline-none cursor-pointer text-indigo-400"><option value="Not Started">Pending</option><option value="In Progress">Active</option><option value="Completed">Secure</option></select></td>
                                                        <td className="px-5 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.theory', !ch.milestones.theory)}>{ch.milestones.theory ? <i className="fa-solid fa-square-check text-indigo-500"></i> : <i className="fa-regular fa-square text-slate-600"></i>}</td>
                                                        <td className="px-5 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.textbook', !ch.milestones.textbook)}>{ch.milestones.textbook ? <i className="fa-solid fa-square-check text-indigo-500"></i> : <i className="fa-regular fa-square text-slate-600"></i>}</td>
                                                        <td className="px-5 py-4 text-center cursor-pointer text-lg" onClick={() => updateChapter(ch.id, 'milestones.written', !ch.milestones.written)}>{ch.milestones.written ? <i className="fa-solid fa-square-check text-indigo-500"></i> : <i className="fa-regular fa-square text-slate-600"></i>}</td>
                                                        <td className="px-5 py-4 text-center">
                                                            <div className="flex items-center justify-center gap-3 bg-slate-950 p-1.5 rounded-lg border border-slate-800">
                                                                <button onClick={() => updateChapter(ch.id, 'qbSolved', Math.max(0, ch.qbSolved - 1))} className="text-slate-400 hover:text-slate-200 w-6 h-6 flex items-center justify-center bg-slate-800 rounded shadow font-bold">-</button>
                                                                <span className="font-bold w-4 text-indigo-400">{ch.qbSolved}</span>
                                                                <button onClick={() => updateChapter(ch.id, 'qbSolved', ch.qbSolved + 1)} className="text-slate-400 hover:text-slate-200 w-6 h-6 flex items-center justify-center bg-slate-800 rounded shadow font-bold">+</button>
                                                            </div>
                                                        </td>
                                                        <td className="px-5 py-4"><select value={ch.confidence} onChange={(e) => updateChapter(ch.id, 'confidence', e.target.value)} className="text-sm font-bold bg-slate-900 border border-slate-700 rounded p-1 outline-none cursor-pointer text-slate-300"><option value="Unrated">N/A</option><option value="Low">Low</option><option value="Medium">Med</option><option value="High">High</option></select></td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // SUB-COMPONENTS (DARK)
        // ==========================================
        function ChapterCard({ chapter, onUpdate, subjectColor }) {
            const { id, subject, paper, chapterNo, titleEn, titleBn, status, milestones, qbSolved, revisions, writtenScore, mcqScore, confidence } = chapter;
            const [localWritten, setLocalWritten] = useState(writtenScore || '');
            const [localMcq, setLocalMcq] = useState(mcqScore || '');

            useEffect(() => { setLocalWritten(writtenScore || ''); }, [writtenScore]);
            useEffect(() => { setLocalMcq(mcqScore || ''); }, [mcqScore]);

            const toggleMilestone = (field) => onUpdate(id, `milestones.${field}`, !milestones[field]);

            const getConfidenceStyle = (conf) => {
                switch(conf) {
                    case 'High': return 'text-emerald-400 bg-emerald-900/30 border-emerald-700/50';
                    case 'Medium': return 'text-amber-400 bg-amber-900/30 border-amber-700/50';
                    case 'Low': return 'text-rose-400 bg-rose-900/30 border-rose-700/50';
                    default: return 'text-slate-400 bg-slate-800 border-slate-700';
                }
            };

            const getStatusStyle = (stat) => {
                switch(stat) {
                    case 'Completed': return 'text-emerald-400 border-emerald-500/50 bg-emerald-900/20';
                    case 'In Progress': return 'text-amber-400 border-amber-500/50 bg-amber-900/20';
                    default: return 'text-slate-400 border-slate-700 bg-slate-800';
                }
            };

            return (
                <div className="bg-slate-900 rounded-2xl shadow-lg hover:border-slate-600 transition-all duration-300 border border-slate-800 flex flex-col overflow-hidden group">
                    <div className="p-5 border-b border-slate-800/50 relative overflow-hidden">
                        <div className="flex justify-between items-start mb-4 relative z-10">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className={`text-[10px] font-bold px-2 py-1 rounded uppercase border ${subjectColor}`}>{subject}</span>
                                <span className="text-xs font-bold text-slate-400 bg-slate-800 px-2 py-1 rounded border border-slate-700">{paper} • Ch {chapterNo}</span>
                            </div>
                            {confidence && confidence !== 'Unrated' && (
                                <span className={`text-[10px] font-bold px-2 py-1 rounded flex items-center gap-1 border ${getConfidenceStyle(confidence)}`}>
                                    {confidence === 'Low' && <i className="fa-solid fa-triangle-exclamation"></i>} {confidence}
                                </span>
                            )}
                        </div>

                        <h3 className="font-extrabold text-white text-lg leading-tight mb-1 relative z-10">{titleEn}</h3>
                        <p className="text-sm font-medium text-slate-500 relative z-10">{titleBn}</p>
                        
                        <div className="mt-5 flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800 relative z-10">
                            <span className="text-xs font-bold text-slate-500 ml-2">Status:</span>
                            <select value={status} onChange={(e) => onUpdate(id, 'status', e.target.value)} className={`text-xs font-bold px-3 py-1.5 rounded-lg border outline-none cursor-pointer appearance-none ${getStatusStyle(status)}`}>
                                <option value="Not Started">Pending</option><option value="In Progress">Active</option><option value="Completed">Secure</option>
                            </select>
                        </div>
                    </div>

                    <div className="p-5 bg-slate-800/20 flex-1">
                        <h4 className="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3">Milestones</h4>
                        <div className="grid grid-cols-2 gap-2">
                            <MilestoneCheckbox label="Theory" checked={milestones.theory} onChange={() => toggleMilestone('theory')} />
                            <MilestoneCheckbox label="Textbook" checked={milestones.textbook} onChange={() => toggleMilestone('textbook')} />
                            <MilestoneCheckbox label="Written" checked={milestones.written} onChange={() => toggleMilestone('written')} />
                            <MilestoneCheckbox label="Bank Solves" checked={milestones.questionBank} onChange={() => toggleMilestone('questionBank')} />
                        </div>

                        <div className="grid grid-cols-2 gap-3 mt-5">
                            <div className="bg-slate-900 border border-slate-700 rounded-xl p-3">
                                <div className="flex items-center gap-1 text-[10px] font-bold text-amber-500 uppercase mb-2"><i className="fa-solid fa-crosshairs"></i> Solves</div>
                                <div className="flex items-center justify-between bg-slate-950 rounded-lg p-1.5 border border-slate-800">
                                    <button onClick={() => onUpdate(id, 'qbSolved', Math.max(0, qbSolved - 1))} className="w-7 h-7 flex items-center justify-center text-slate-400 bg-slate-800 hover:text-white rounded font-bold">-</button>
                                    <span className="font-extrabold text-amber-500 text-lg">{qbSolved}</span>
                                    <button onClick={() => onUpdate(id, 'qbSolved', qbSolved + 1)} className="w-7 h-7 flex items-center justify-center text-slate-400 bg-slate-800 hover:text-white rounded font-bold">+</button>
                                </div>
                            </div>
                            
                            <div className="bg-slate-900 border border-slate-700 rounded-xl p-3">
                                <div className="flex items-center gap-1 text-[10px] font-bold text-indigo-400 uppercase mb-2"><i className="fa-solid fa-rotate-right"></i> Revs</div>
                                <div className="flex items-center justify-between bg-slate-950 rounded-lg p-1.5 border border-slate-800">
                                    <button onClick={() => onUpdate(id, 'revisions', Math.max(0, revisions - 1))} className="w-7 h-7 flex items-center justify-center text-slate-400 bg-slate-800 hover:text-white rounded font-bold">-</button>
                                    <span className="font-extrabold text-indigo-400 text-lg">{revisions}</span>
                                    <button onClick={() => onUpdate(id, 'revisions', revisions + 1)} className="w-7 h-7 flex items-center justify-center text-slate-400 bg-slate-800 hover:text-white rounded font-bold">+</button>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-3 mt-5 pt-5 border-t border-slate-800">
                            <div>
                                <label className="text-[10px] text-slate-500 font-bold block mb-1">Written:</label>
                                <input type="text" placeholder="--" value={localWritten} onChange={(e) => setLocalWritten(e.target.value)} onBlur={() => onUpdate(id, 'writtenScore', localWritten)} className="w-full text-xs font-bold text-slate-300 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 focus:border-indigo-500 outline-none text-center" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-bold block mb-1">MCQ:</label>
                                <input type="text" placeholder="--" value={localMcq} onChange={(e) => setLocalMcq(e.target.value)} onBlur={() => onUpdate(id, 'mcqScore', localMcq)} className="w-full text-xs font-bold text-slate-300 bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 focus:border-indigo-500 outline-none text-center" />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-bold block mb-1">Conf:</label>
                                <select value={confidence} onChange={(e) => onUpdate(id, 'confidence', e.target.value)} className="w-full text-xs font-bold text-slate-300 bg-slate-900 border border-slate-700 rounded-lg px-1 py-2 focus:border-indigo-500 outline-none text-center appearance-none">
                                    <option value="Unrated">N/A</option><option value="Low">Low</option><option value="Medium">Med</option><option value="High">High</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MilestoneCheckbox({ label, checked, onChange }) {
            return (
                <div onClick={onChange} className={`flex items-center gap-2 p-2 rounded-xl border cursor-pointer transition-all ${checked ? 'bg-indigo-900/30 border-indigo-500/50 text-indigo-400 shadow-inner' : 'bg-slate-900 border-slate-700 text-slate-400 hover:bg-slate-800'}`}>
                    {checked ? <i className="fa-solid fa-square-check text-lg"></i> : <i className="fa-regular fa-square text-lg"></i>}
                    <span className="text-[11px] font-bold leading-none select-none">{label}</span>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
