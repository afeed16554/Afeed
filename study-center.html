<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Study Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' }
            }
          }
        }
      }
    </script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { transition: background-color 0.25s ease, color 0.25s ease; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(234, 179, 8, 0); }
            100% { transform: scale(0.97); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        .animate-pulse-ring { animation: pulse-ring 1.8s infinite; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-indigo-500/30 bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ==========================================
        // 1. Google Web App URL (API Gateway)
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyhZCvSQ1QzeKE5Plb38rKw5RcAh56-ZDo1zMmnVDlP6ghJHWP_elAZDgsD5v28eEuI/exec"; 
        const AUTO_SAVE_DELAY_MS = 750; // Rapid 0.75s debounce for snappy saving

        const MILESTONE_KEYS = [
            { key: 'theory', label: 'Theory', short: 'Theory' },
            { key: 'textbook', label: 'Textbook', short: 'T.Book' },
            { key: 'written', label: 'Written', short: 'CQ' },
            { key: 'questionBank', label: 'Question Bank', short: 'QB' },
            { key: 'mistakeCorrection', label: 'Mistakes', short: 'Mistakes' },
            { key: 'conceptBook', label: 'Concept Book', short: 'C.Book' },
            { key: 'lectureSlide', label: 'Lecture Slide', short: 'Slides' },
            { key: 'engMcq', label: 'Eng. MCQ', short: 'EngMCQ', highlight: true },
            { key: 'varsityMcq', label: 'Varsity MCQ', short: 'VarMCQ', highlight: true }
        ];

        function encodeCSV(val) {
            if (val === null || val === undefined) return '';
            let str = String(val);
            if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        function parseCSV(str) {
            const arr = [];
            let quote = false;
            for (let row = 0, col = 0, c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                if (cc === '"') { quote = !quote; continue; }
                if (cc === ',' && !quote) { ++col; continue; }
                if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc === '\n' && !quote) { ++row; col = 0; continue; }
                if (cc === '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }

        function calculateMilestoneProgress(milestones) {
            if (!milestones) return { done: 0, total: MILESTONE_KEYS.length, pct: 0 };
            const done = MILESTONE_KEYS.reduce((acc, m) => acc + (milestones[m.key] ? 1 : 0), 0);
            return {
                done,
                total: MILESTONE_KEYS.length,
                pct: Math.round((done / MILESTONE_KEYS.length) * 100)
            };
        }

        function App() {
            const [theme, setTheme] = useState(() => localStorage.getItem('scc_theme') || 'light');
            
            // Auth State
            const [userLoggedIn, setUserLoggedIn] = useState(() => localStorage.getItem('study_user_id') || null);
            const [sessionToken, setSessionToken] = useState(() => localStorage.getItem('study_session_token') || null);
            const [isRegisterMode, setIsRegisterMode] = useState(false);
            const [loginInput, setLoginInput] = useState('');
            const [passInput, setPassInput] = useState('');
            const [showPass, setShowPass] = useState(false);
            const [authLoading, setAuthLoading] = useState(false);
            const [authError, setAuthError] = useState('');
            const [authSuccessMsg, setAuthSuccessMsg] = useState('');

            // App Data States (Hydrated immediately from localStorage for 0ms startup)
            const [chapters, setChapters] = useState(() => {
                const uid = localStorage.getItem('study_user_id');
                if (!uid) return [];
                try {
                    const cached = localStorage.getItem(`scc_cache_chapters_${uid}`);
                    return cached ? JSON.parse(cached) : [];
                } catch (e) { return []; }
            });

            const [pendingUpdates, setPendingUpdates] = useState(() => {
                const uid = localStorage.getItem('study_user_id');
                if (!uid) return {};
                try {
                    const cached = localStorage.getItem(`scc_pending_updates_${uid}`);
                    return cached ? JSON.parse(cached) : {};
                } catch (e) { return {}; }
            });

            // Navigation & Filters
            const [activeSubject, setActiveSubject] = useState('All Subjects');
            const [activePaper, setActivePaper] = useState('All');
            const [statusFilter, setStatusFilter] = useState('All');
            const [confidenceFilter, setConfidenceFilter] = useState('All');
            const [sortBy, setSortBy] = useState('default');
            const [viewMode, setViewMode] = useState('tiles'); 
            const [searchTerm, setSearchTerm] = useState('');

            // UI Layout States
            const [showWeakTopics, setShowWeakTopics] = useState(true);
            const [showInProgress, setShowInProgress] = useState(true);
            const [weakTopicSubjectFilter, setWeakTopicSubjectFilter] = useState('All');
            const [weakTopicPaperFilter, setWeakTopicPaperFilter] = useState('All');
            
            // Sync & Network States
            const [initialLoading, setInitialLoading] = useState(false);
            const [isBackgroundFetching, setIsBackgroundFetching] = useState(false);
            const [syncStatus, setSyncStatus] = useState(() => {
                const uid = localStorage.getItem('study_user_id');
                if (!uid) return 'synced';
                try {
                    const cached = JSON.parse(localStorage.getItem(`scc_pending_updates_${uid}`) || '{}');
                    return Object.keys(cached).length > 0 ? 'unsaved' : 'synced';
                } catch (e) { return 'synced'; }
            });
            const [syncErrorMsg, setSyncErrorMsg] = useState('');
            const [lastSyncedAt, setLastSyncedAt] = useState(null);
            const [showResetModal, setShowResetModal] = useState(false);
            
            // Refs for synchronous access inside callbacks and timers (Fixes stale React state closure bugs)
            const chaptersRef = useRef(chapters);
            const pendingUpdatesRef = useRef(pendingUpdates);
            const isSavingRef = useRef(false);
            const autoSaveTimerRef = useRef(null);
            const fileInputRef = useRef(null);

            useEffect(() => {
                chaptersRef.current = chapters;
                if (userLoggedIn && chapters.length > 0) {
                    try {
                        localStorage.setItem(`scc_cache_chapters_${userLoggedIn}`, JSON.stringify(chapters));
                    } catch (e) {}
                }
            }, [chapters, userLoggedIn]);

            useEffect(() => {
                pendingUpdatesRef.current = pendingUpdates;
                if (userLoggedIn) {
                    try {
                        localStorage.setItem(`scc_pending_updates_${userLoggedIn}`, JSON.stringify(pendingUpdates));
                    } catch (e) {}
                }
            }, [pendingUpdates, userLoggedIn]);

            useEffect(() => {
                if (theme === 'dark') document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('scc_theme', theme);
            }, [theme]);

            useEffect(() => {
                if (localStorage.getItem('study_user_pwd')) localStorage.removeItem('study_user_pwd');
            }, []);

            // Warn user before closing tab if changes are still syncing
            useEffect(() => {
                const handleBeforeUnload = (e) => {
                    if (Object.keys(pendingUpdatesRef.current).length > 0 || isSavingRef.current) {
                        e.preventDefault();
                        e.returnValue = '';
                    }
                };
                window.addEventListener('beforeunload', handleBeforeUnload);
                return () => window.removeEventListener('beforeunload', handleBeforeUnload);
            }, []);

            const toggleTheme = () => setTheme(prev => prev === 'dark' ? 'light' : 'dark');

            // Apply any locally queued edits on top of freshly fetched server chapters
            const mergePendingOntoChapters = useCallback((serverChapters, pendingMap) => {
                if (!pendingMap || Object.keys(pendingMap).length === 0) return serverChapters;
                return serverChapters.map(ch => {
                    const pending = pendingMap[ch.id];
                    if (!pending) return ch;
                    return {
                        ...ch,
                        ...pending,
                        version: ch.version, // Always adopt latest server version so the next save succeeds
                        milestones: {
                            ...(ch.milestones || {}),
                            ...(pending.milestones || {})
                        }
                    };
                });
            }, []);

            const handleAuth = async (e) => {
                e.preventDefault();
                setAuthError(''); setAuthSuccessMsg('');
                
                const formattedId = loginInput.trim().replace(/\s+/g, '_');
                if (!/^[A-Za-z0-9_]{3,30}$/.test(formattedId)) {
                    return setAuthError("ID must be 3-30 characters, alphanumeric & underscores only.");
                }
                if (passInput.length < 6) {
                    return setAuthError("Password must be at least 6 characters.");
                }

                setAuthLoading(true);

                try {
                    const action = isRegisterMode ? 'register' : 'login';
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action, userId: formattedId, password: passInput }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);

                    if (isRegisterMode) {
                        setIsRegisterMode(false);
                        setPassInput('');
                        setAuthSuccessMsg("Account registered! Logging you in...");
                    }

                    localStorage.setItem('study_user_id', formattedId);
                    localStorage.setItem('study_session_token', data.sessionToken);
                    setUserLoggedIn(formattedId);
                    setSessionToken(data.sessionToken);
                } catch (error) {
                    setAuthError(error.message || "Connection failed. Please check your internet.");
                }
                setAuthLoading(false);
            };

            const handleLogout = useCallback(() => {
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                localStorage.removeItem('study_user_id');
                localStorage.removeItem('study_session_token');
                setUserLoggedIn(null);
                setSessionToken(null);
                setChapters([]);
                setPendingUpdates({});
                setSyncErrorMsg('');
            }, []);

            const fetchWorkspaceData = useCallback(async (isSilent = false) => {
                if (!userLoggedIn || !sessionToken) return;
                const hasCachedData = chaptersRef.current.length > 0;
                if (!isSilent && !hasCachedData) setInitialLoading(true);
                else setIsBackgroundFetching(true);

                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'fetch', userId: userLoggedIn, sessionToken }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    if (data.error) {
                        if (data.error.includes('Session') || data.error.includes('Authentication')) {
                            handleLogout();
                        }
                        throw new Error(data.error);
                    }

                    if (Array.isArray(data.chapters)) {
                        // Reconcile server versions with any unsaved local edits
                        const currentPending = pendingUpdatesRef.current;
                        const merged = mergePendingOntoChapters(data.chapters, currentPending);
                        setChapters(merged);

                        // Also upgrade version numbers inside pendingUpdates so they never conflict
                        if (Object.keys(currentPending).length > 0) {
                            const versionMap = {};
                            data.chapters.forEach(c => { versionMap[c.id] = c.version; });
                            setPendingUpdates(prev => {
                                const next = { ...prev };
                                Object.keys(next).forEach(id => {
                                    if (versionMap[id] !== undefined) {
                                        next[id] = { ...next[id], version: versionMap[id] };
                                    }
                                });
                                pendingUpdatesRef.current = next;
                                return next;
                            });
                            setSyncStatus('unsaved');
                        } else {
                            setSyncStatus('synced');
                            setSyncErrorMsg('');
                        }
                        setLastSyncedAt(new Date());
                    }
                } catch (error) {
                    setSyncErrorMsg(error.message || 'Could not reach server. Changes are saved locally.');
                    if (Object.keys(pendingUpdatesRef.current).length > 0) {
                        setSyncStatus('error');
                    }
                } finally {
                    setInitialLoading(false);
                    setIsBackgroundFetching(false);
                }
            }, [userLoggedIn, sessionToken, handleLogout, mergePendingOntoChapters]);

            useEffect(() => {
                if (userLoggedIn && sessionToken) {
                    // Load cached chapters if switching accounts
                    try {
                        const cached = localStorage.getItem(`scc_cache_chapters_${userLoggedIn}`);
                        if (cached && chaptersRef.current.length === 0) {
                            setChapters(JSON.parse(cached));
                        }
                    } catch (e) {}
                    fetchWorkspaceData(false);
                }
            }, [userLoggedIn, sessionToken, fetchWorkspaceData]);

            const handleManualSave = useCallback(async () => {
                const snapshotUpdates = { ...pendingUpdatesRef.current };
                const updatesArray = Object.values(snapshotUpdates);
                
                if (updatesArray.length === 0 || isSavingRef.current) return;
                
                if (autoSaveTimerRef.current) {
                    clearTimeout(autoSaveTimerRef.current);
                    autoSaveTimerRef.current = null;
                }

                isSavingRef.current = true;
                setSyncStatus('saving');
                setSyncErrorMsg('');

                try {
                    // Ensure every update carries the latest known version from chaptersRef
                    const currentChaptersMap = {};
                    chaptersRef.current.forEach(ch => { currentChaptersMap[ch.id] = ch.version; });

                    const payloadUpdates = updatesArray.map(u => ({
                        ...u,
                        version: currentChaptersMap[u.id] || u.version || 1
                    }));

                    const payload = {
                        action: 'save',
                        userId: userLoggedIn,
                        sessionToken,
                        updates: payloadUpdates
                    };

                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    
                    if (data.error) {
                        if (data.error.includes('Session')) handleLogout();
                        throw new Error(data.error);
                    }

                    const savedVersions = data.saved || {};
                    const failedIds = Array.isArray(data.failed) ? data.failed : [];

                    // 1. Update chapter versions immediately in both state and ref
                    if (Object.keys(savedVersions).length > 0) {
                        setChapters(prev => {
                            const updated = prev.map(ch => {
                                if (savedVersions[ch.id] !== undefined) {
                                    return { ...ch, version: savedVersions[ch.id] };
                                }
                                return ch;
                            });
                            chaptersRef.current = updated;
                            return updated;
                        });
                    }

                    // 2. Remove saved items from pendingUpdates unless the user made newer edits while saving
                    let remainingCount = 0;
                    setPendingUpdates(prev => {
                        const next = { ...prev };
                        for (const key of Object.keys(snapshotUpdates)) {
                            if (!failedIds.includes(key)) {
                                if (JSON.stringify(next[key]) === JSON.stringify(snapshotUpdates[key])) {
                                    delete next[key];
                                } else if (next[key]) {
                                    // User made another edit while network request was in flight!
                                    next[key] = {
                                        ...next[key],
                                        version: savedVersions[key] || next[key].version
                                    };
                                }
                            }
                        }
                        remainingCount = Object.keys(next).length;
                        pendingUpdatesRef.current = next;
                        return next;
                    });

                    setLastSyncedAt(new Date());

                    if (failedIds.length > 0) {
                        // Re-fetch latest versions from server and seamlessly re-apply user's pending changes!
                        await fetchWorkspaceData(true);
                        setSyncStatus('unsaved');
                    } else if (remainingCount > 0) {
                        setSyncStatus('unsaved');
                    } else {
                        setSyncStatus('synced');
                    }
                } catch (error) {
                    setSyncStatus('error');
                    setSyncErrorMsg(error.message || 'Network error while saving. Retrying automatically...');
                } finally {
                    isSavingRef.current = false;
                }
            }, [userLoggedIn, sessionToken, handleLogout, fetchWorkspaceData]);

            // Rapid Auto-Save Effect
            useEffect(() => {
                const pendingCount = Object.keys(pendingUpdates).length;
                if (pendingCount === 0) return;

                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                autoSaveTimerRef.current = setTimeout(() => {
                    handleManualSave();
                }, AUTO_SAVE_DELAY_MS);

                return () => {
                    if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                };
            }, [pendingUpdates, syncStatus, handleManualSave]);

            // FIXED: Synchronous version lookup from chaptersRef so chapterVersion is NEVER stale!
            const updateChapter = useCallback((id, field, value) => {
                const targetChapter = chaptersRef.current.find(ch => ch.id === id);
                if (!targetChapter) return;

                // Skip redundant updates if value hasn't actually changed
                if (field.includes('.')) {
                    const [parent, child] = field.split('.');
                    if (targetChapter[parent]?.[child] === value) return;
                } else {
                    if (targetChapter[field] === value) return;
                }

                const accurateVersion = targetChapter.version || 1;

                setChapters(prevChapters => {
                    const nextChapters = prevChapters.map(ch => {
                        if (ch.id === id) {
                            if (field.includes('.')) {
                                const [parent, child] = field.split('.');
                                return { ...ch, [parent]: { ...(ch[parent] || {}), [child]: value } };
                            }
                            return { ...ch, [field]: value };
                        }
                        return ch;
                    });
                    chaptersRef.current = nextChapters;
                    return nextChapters;
                });

                setPendingUpdates(prevPending => {
                    const existingEntry = prevPending[id]
                        ? { ...prevPending[id], version: accurateVersion }
                        : { id, version: accurateVersion };

                    if (field.includes('.')) {
                        const [parent, child] = field.split('.');
                        existingEntry[parent] = { ...(existingEntry[parent] || {}), [child]: value };
                    } else {
                        existingEntry[field] = value;
                    }

                    const nextPending = { ...prevPending, [id]: existingEntry };
                    pendingUpdatesRef.current = nextPending;
                    return nextPending;
                });

                setSyncStatus('unsaved');
            }, []);

            // Batch update helper for marking all milestones in a chapter
            const markAllMilestones = useCallback((id, targetState) => {
                const targetChapter = chaptersRef.current.find(ch => ch.id === id);
                if (!targetChapter) return;
                const accurateVersion = targetChapter.version || 1;

                const newMilestones = {};
                MILESTONE_KEYS.forEach(m => { newMilestones[m.key] = targetState; });
                const newStatus = targetState ? 'Completed' : targetChapter.status;

                setChapters(prev => {
                    const next = prev.map(ch => ch.id === id ? { ...ch, status: newStatus, milestones: newMilestones } : ch);
                    chaptersRef.current = next;
                    return next;
                });

                setPendingUpdates(prev => {
                    const existing = prev[id] ? { ...prev[id], version: accurateVersion } : { id, version: accurateVersion };
                    existing.milestones = { ...(existing.milestones || {}), ...newMilestones };
                    existing.status = newStatus;
                    const next = { ...prev, [id]: existing };
                    pendingUpdatesRef.current = next;
                    return next;
                });

                setSyncStatus('unsaved');
            }, []);

            const executeReset = async () => {
                setShowResetModal(false);
                setInitialLoading(true);
                try {
                    const response = await fetch(WEB_APP_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'reset', userId: userLoggedIn, sessionToken }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    });
                    const data = await response.json();
                    if (data.error) throw new Error(data.error);
                    setPendingUpdates({});
                    pendingUpdatesRef.current = {};
                    localStorage.removeItem(`scc_pending_updates_${userLoggedIn}`);
                    await fetchWorkspaceData(false);
                } catch (error) {
                    setSyncErrorMsg("Reset failed: " + error.message);
                }
                setInitialLoading(false);
            };

            const handleExportCSV = () => {
                if (chapters.length === 0) return;
                const headers = ["id", "subject", "paper", "chapterNo", "titleEn", "titleBn", "status", "theory", "textbook", "written", "questionBank", "mistakeCorrection", "conceptBook", "lectureSlide", "engMcq", "varsityMcq", "qbSolved", "revisions", "writtenScore", "mcqScore", "confidence", "notes", "version"];
                let csvContent = headers.join(',') + '\n';
                chapters.forEach(ch => {
                    const safeMilestones = ch.milestones || {};
                    const row = [
                        ch.id, ch.subject, ch.paper, ch.chapterNo, ch.titleEn, ch.titleBn, ch.status,
                        safeMilestones.theory || false, safeMilestones.textbook || false, safeMilestones.written || false,
                        safeMilestones.questionBank || false, safeMilestones.mistakeCorrection || false,
                        safeMilestones.conceptBook || false, safeMilestones.lectureSlide || false,
                        safeMilestones.engMcq || false, safeMilestones.varsityMcq || false,
                        ch.qbSolved || 0, ch.revisions || 0, ch.writtenScore || '', ch.mcqScore || '',
                        ch.confidence || 'Unrated', ch.notes || '', ch.version || 1
                    ];
                    csvContent += row.map(encodeCSV).join(',') + '\n';
                });
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `StudyData_${userLoggedIn}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleImportCSV = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    const rows = parseCSV(e.target.result);
                    if (rows.length < 2) return setSyncErrorMsg("CSV file is empty or invalid.");
                    const headers = rows[0];
                    if (!headers.includes("id")) return setSyncErrorMsg("Invalid CSV format: Missing 'id' column.");

                    let newPending = { ...pendingUpdatesRef.current };
                    let updatedChapters = JSON.parse(JSON.stringify(chaptersRef.current)); 

                    for (let i = 1; i < rows.length; i++) {
                        const row = rows[i];
                        if (row.length < 2) continue;
                        const rowData = {};
                        headers.forEach((h, idx) => rowData[h] = row[idx]);

                        const chapterIndex = updatedChapters.findIndex(c => String(c.id) === String(rowData.id));
                        if (chapterIndex === -1) continue; 

                        const existing = updatedChapters[chapterIndex];
                        if (!existing.milestones) existing.milestones = {};
                        let chUpdates = {};
                        let hasChanges = false;

                        const checkUpdate = (field, type = 'string') => {
                            let val = rowData[field];
                            if (val === undefined || val === null) return;
                            if (type === 'boolean') val = (String(val).toLowerCase() === 'true');
                            if (type === 'number') val = Number(val) || 0;

                            const mFields = ['theory', 'textbook', 'written', 'questionBank', 'mistakeCorrection', 'conceptBook', 'lectureSlide', 'engMcq', 'varsityMcq'];
                            if (mFields.includes(field)) {
                                if (existing.milestones[field] !== val) {
                                    existing.milestones[field] = val;
                                    if (!chUpdates.milestones) chUpdates.milestones = {};
                                    chUpdates.milestones[field] = val;
                                    hasChanges = true;
                                }
                            } else {
                                if (existing[field] !== val) {
                                    existing[field] = val;
                                    chUpdates[field] = val;
                                    hasChanges = true;
                                }
                            }
                        };

                        checkUpdate('status', 'string');
                        checkUpdate('theory', 'boolean');
                        checkUpdate('textbook', 'boolean');
                        checkUpdate('written', 'boolean');
                        checkUpdate('questionBank', 'boolean');
                        checkUpdate('mistakeCorrection', 'boolean');
                        checkUpdate('conceptBook', 'boolean');
                        checkUpdate('lectureSlide', 'boolean');
                        checkUpdate('engMcq', 'boolean');
                        checkUpdate('varsityMcq', 'boolean');
                        checkUpdate('qbSolved', 'number');
                        checkUpdate('revisions', 'number');
                        checkUpdate('writtenScore', 'string');
                        checkUpdate('mcqScore', 'string');
                        checkUpdate('confidence', 'string');
                        checkUpdate('notes', 'string');

                        if (hasChanges) {
                            newPending[existing.id] = {
                                ...(newPending[existing.id] || { id: existing.id, version: existing.version }),
                                ...chUpdates,
                                milestones: {
                                    ...(newPending[existing.id]?.milestones || {}),
                                    ...(chUpdates.milestones || {})
                                }
                            };
                        }
                    }
                    chaptersRef.current = updatedChapters;
                    pendingUpdatesRef.current = newPending;
                    setChapters(updatedChapters);
                    setPendingUpdates(newPending);
                    if (Object.keys(newPending).length > 0) setSyncStatus('unsaved');
                    event.target.value = null;
                };
                reader.readAsText(file);
            };

            const subjectsList = useMemo(() => (
                Array.from(new Set(chapters.map(ch => ch.subject))).filter(s => s && s !== 'Unknown')
            ), [chapters]);

            const availablePapersForSubject = useMemo(() => (
                activeSubject !== 'All Subjects'

                    case 'Higher Math': return 'bg-gradient-to-r from-sky-600 to-cyan-700 dark:from-blue-900 dark:to-cyan-800 text-white';
                    case 'Biology': return 'bg-gradient-to-r from-rose-600 to-pink-700 dark:from-rose-900 dark:to-pink-800 text-white';
                    default: return 'bg-gradient-to-r from-slate-600 to-slate-800 dark:from-slate-900 dark:to-slate-700 text-white';
                }
            };

            // Filtered & Sorted Chapters for Subject View
            const filteredChapters = useMemo(() => {
                const searchLower = searchTerm.toLowerCase();
                let list = chapters.filter(ch => {
                    if (activeSubject !== 'All Subjects' && ch.subject !== activeSubject) return false;
                    if (activePaper !== 'All' && ch.paper !== activePaper) return false;
                    if (statusFilter !== 'All' && ch.status !== statusFilter) return false;
                    if (confidenceFilter !== 'All' && ch.confidence !== confidenceFilter) return false;
                    if (!searchLower) return true;
                    return (
                        (ch.titleEn || '').toLowerCase().includes(searchLower) ||
                        (ch.titleBn || '').includes(searchLower) ||
                        String(ch.chapterNo || '').toLowerCase().includes(searchLower) ||
                        (ch.notes || '').toLowerCase().includes(searchLower)

                });

                if (sortBy === 'progress_desc') {
                    list = [...list].sort((a, b) => calculateMilestoneProgress(b.milestones).pct - calculateMilestoneProgress(a.milestones).pct);
                } else if (sortBy === 'progress_asc') {
                    list = [...list].sort((a, b) => calculateMilestoneProgress(a.milestones).pct - calculateMilestoneProgress(b.milestones).pct);
                } else if (sortBy === 'qb_desc') {
                    list = [...list].sort((a, b) => (b.qbSolved || 0) - (a.qbSolved || 0));
                } else if (sortBy === 'rev_desc') {
                    list = [...list].sort((a, b) => (b.revisions || 0) - (a.revisions || 0));
                }
                return list;
            }, [chapters, activeSubject, activePaper, statusFilter, confidenceFilter, searchTerm, sortBy]);

            // Global Dashboard Stats
            const globalStats = useMemo(() => {
                const total = chapters.length;
                const completed = chapters.filter(c => c.status === 'Completed').length;
                const started = chapters.filter(c => c.status === 'Started').length;
                const totalQb = chapters.reduce((acc, c) => acc + (c.qbSolved || 0), 0);
                const totalRev = chapters.reduce((acc, c) => acc + (c.revisions || 0), 0);
                const pct = total === 0 ? 0 : Math.round((completed / total) * 100);
                return { total, completed, started, totalQb, totalRev, pct };
            }, [chapters]);

            // Weak Topics Filter System
            const allWeakTopicsChapters = useMemo(() => chapters.filter(ch => ch.confidence === 'Low'), [chapters]);
            const availableWeakSubjects = useMemo(() => Array.from(new Set(allWeakTopicsChapters.map(c => c.subject))), [allWeakTopicsChapters]);
            const availableWeakPapers = useMemo(() => (
                weakTopicSubjectFilter !== 'All'

                            <button onClick={() => { setActiveSubject('All Subjects'); setActivePaper('All'); }} className={`flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-bold transition whitespace-nowrap ${activeSubject === 'All Subjects' ? 'bg-slate-800 dark:bg-indigo-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}`}><i className="fa-solid fa-layer-group"></i> All Subjects</button>
                            <div className="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-1"></div>

                        {/* DASHBOARD VIEW */}
                        {activeSubject === 'All Subjects' && (

                                    <div className="flex flex-col lg:flex-row gap-3 items-stretch lg:items-center justify-between">
                                        <div className="flex items-center p-1 bg-slate-100 dark:bg-slate-950 rounded-xl">
                                            <button onClick={() => setViewMode('tiles')} className={`flex-1 lg:flex-initial flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all ${viewMode === 'tiles' ? 'bg-white text-indigo-700 shadow-sm dark:bg-slate-800 dark:text-indigo-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}><i className="fa-solid fa-border-all"></i> Cards</button>
                                            <button onClick={() => setViewMode('table')} className={`flex-1 lg:flex-initial flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-xs font-bold transition-all ${viewMode === 'table' ? 'bg-white text-indigo-700 shadow-sm dark:bg-slate-800 dark:text-indigo-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}><i className="fa-solid fa-table-list"></i> Compact Table</button>

                                            <select value={statusFilter} onChange={e => setStatusFilter(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 outline-none">
                                                <option value="All">Status: All</option>

                                            </select>

                                            <select value={confidenceFilter} onChange={e => setConfidenceFilter(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 outline-none">
                                                <option value="All">Confidence: All</option>

                                            <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 rounded-xl px-3 py-2 text-xs font-bold text-slate-700 dark:text-slate-300 outline-none">
                                                <option value="default">Sort: Default Order</option>
                                                <option value="progress_desc">Milestone % (High → Low)</option>
                                                <option value="progress_asc">Milestone % (Low → High)</option>
                                                <option value="qb_desc">QB Solved (High → Low)</option>
                                                <option value="rev_desc">Revisions (High → Low)</option>

                                        </div>
                                    </div>
                                </div>

                                {viewMode === 'tiles' ? (

                                        {filteredChapters.map((chapter) => (

                                                key={chapter.id}

                                                    <th className="px-3 py-3.5 text-center">Revisions</th>
                                                    <th className="px-3 py-3.5 text-center">Written</th>

                                                    <TableRow

                                        {filteredChapters.length === 0 && <div className="text-center py-10 text-slate-500 font-medium border-t border-slate-200 dark:border-slate-800">No chapters match the selected filters.</div>}

        }

        function TableRow({ ch, isPending, updateChapter }) {
            const [localWritten, setLocalWritten] = useState(ch.writtenScore || '');
            const [localMcq, setLocalMcq] = useState(ch.mcqScore || '');
            const scoreTimerRef = useRef(null);

            useEffect(() => { setLocalWritten(ch.writtenScore || ''); }, [ch.writtenScore]);
            useEffect(() => { setLocalMcq(ch.mcqScore || ''); }, [ch.mcqScore]);

            const handleScoreChange = (field, val, setter) => {
                setter(val);
                if (scoreTimerRef.current) clearTimeout(scoreTimerRef.current);
                scoreTimerRef.current = setTimeout(() => {
                    updateChapter(ch.id, field, val);
                }, 400);
            };

            return (
                <tr className="hover:bg-indigo-50/40 dark:hover:bg-slate-800/40 transition-colors">
                    <td className="px-3 py-3">
                        <div className="font-bold text-slate-800 dark:text-slate-200 text-sm flex items-center gap-2">
                            <span>{ch.titleEn}</span>
                            {isPending && <span className="w-2 h-2 rounded-full bg-amber-500" title="Queued for save"></span>}
                        </div>
                        <div className="text-[11px] font-medium text-slate-500">{ch.paper} • Ch {ch.chapterNo}</div>
                    </td>
                    <td className="px-3 py-3">
                        <select value={ch.status} onChange={(e) => updateChapter(ch.id, 'status', e.target.value)} className="text-xs font-bold bg-slate-50 dark:bg-slate-950 outline-none cursor-pointer text-indigo-700 dark:text-indigo-400 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5">
                            <option value="Not Started">Not Started</option>
                            <option value="Started">Started</option>
                            <option value="Paused">Paused</option>
                            <option value="Completed">Completed</option>

                    </td>
                    {MILESTONE_KEYS.map(m => {

                            <td key={m.key} className={`px-2.5 py-3 text-center cursor-pointer text-base ${m.highlight ? 'bg-blue-50/20 dark:bg-blue-900/10' : ''}`} onClick={() => updateChapter(ch.id, `milestones.${m.key}`, !checked)}>
                                {checked
                                    ? <i className={`fa-solid fa-circle-check ${m.highlight ? 'text-blue-600' : 'text-indigo-600'}`}></i>
                                    : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600"></i>}
                            </td>
                        );
                    })}
                    <td className="px-3 py-3 text-center">
                        <div className="inline-flex items-center gap-2 bg-slate-50 dark:bg-slate-950 p-1 rounded-lg border border-slate-200 dark:border-slate-800">
                            <button onClick={() => updateChapter(ch.id, 'qbSolved', Math.max(0, (ch.qbSolved || 0) - 1))} className="text-slate-500 w-6 h-6 bg-white dark:bg-slate-800 rounded font-bold hover:bg-slate-100">-</button>
                            <span className="font-bold min-w-[1.25rem] text-center text-amber-600 dark:text-amber-400">{ch.qbSolved || 0}</span>
                            <button onClick={() => updateChapter(ch.id, 'qbSolved', (ch.qbSolved || 0) + 1)} className="text-slate-500 w-6 h-6 bg-white dark:bg-slate-800 rounded font-bold hover:bg-slate-100">+</button>
                        </div>
                    </td>
                    <td className="px-3 py-3 text-center">
                        <div className="inline-flex items-center gap-2 bg-slate-50 dark:bg-slate-950 p-1 rounded-lg border border-slate-200 dark:border-slate-800">
                            <button onClick={() => updateChapter(ch.id, 'revisions', Math.max(0, (ch.revisions || 0) - 1))} className="text-slate-500 w-6 h-6 bg-white dark:bg-slate-800 rounded font-bold hover:bg-slate-100">-</button>
                            <span className="font-bold min-w-[1.25rem] text-center text-indigo-600 dark:text-indigo-400">{ch.revisions || 0}</span>
                            <button onClick={() => updateChapter(ch.id, 'revisions', (ch.revisions || 0) + 1)} className="text-slate-500 w-6 h-6 bg-white dark:bg-slate-800 rounded font-bold hover:bg-slate-100">+</button>
                        </div>
                    </td>
                    <td className="px-3 py-3 text-center">
                        <input type="text" placeholder="-" value={localWritten} onChange={e => handleScoreChange('writtenScore', e.target.value, setLocalWritten)} onBlur={() => updateChapter(ch.id, 'writtenScore', localWritten)} className="w-16 text-xs font-bold text-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 outline-none focus:ring-1 focus:ring-indigo-500" />
                    </td>
                    <td className="px-3 py-3 text-center">
                        <input type="text" placeholder="-" value={localMcq} onChange={e => handleScoreChange('mcqScore', e.target.value, setLocalMcq)} onBlur={() => updateChapter(ch.id, 'mcqScore', localMcq)} className="w-16 text-xs font-bold text-center bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 outline-none focus:ring-1 focus:ring-indigo-500" />
                    </td>
                    <td className="px-3 py-3">
                        <select value={ch.confidence} onChange={(e) => updateChapter(ch.id, 'confidence', e.target.value)} className="text-xs font-bold bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-1.5 outline-none text-slate-700 dark:text-slate-300">
                            <option value="Unrated">Unrated</option>
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </td>
                </tr>
            );
        }

        function ChapterCard({ chapter, isPending, onUpdate, onMarkAll, subjectColor }) {
            const { id, subject, paper, chapterNo, titleEn, titleBn, status, milestones, qbSolved, revisions, writtenScore, mcqScore, confidence, notes, version } = chapter;
            const [localWritten, setLocalWritten] = useState(writtenScore || '');
            const [localMcq, setLocalMcq] = useState(mcqScore || '');
            const [localNotes, setLocalNotes] = useState(notes || '');
            const [showNotes, setShowNotes] = useState(Boolean(notes));
            const inputDebounceRef = useRef(null);

            useEffect(() => { setLocalWritten(writtenScore || ''); }, [writtenScore]);
            useEffect(() => { setLocalMcq(mcqScore || ''); }, [mcqScore]);
            useEffect(() => { setLocalNotes(notes || ''); }, [notes]);

            // Debounced live text update so user doesn't even need to click outside before clicking Save
            const handleTextChange = (field, val, setter) => {
                setter(val);
                if (inputDebounceRef.current) clearTimeout(inputDebounceRef.current);
                inputDebounceRef.current = setTimeout(() => {
                    onUpdate(id, field, val);
                }, 400);
            };

            const safeMilestones = milestones || {};
            const progress = calculateMilestoneProgress(safeMilestones);
            const allDone = progress.done === progress.total;

            const toggleMilestone = (field) => onUpdate(id, `milestones.${field}`, !safeMilestones[field]);

            const getConfidenceStyle = (conf) => {
                switch(conf) {
                    case 'High': return 'text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/30 border-emerald-200 dark:border-emerald-700/50';
                    case 'Medium': return 'text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 border-amber-200 dark:border-amber-700/50';
                    case 'Low': return 'text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 border-rose-200 dark:border-rose-700/50';
                    default: return 'text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };
            const getStatusColor = (stat) => {
                switch(stat) {
                    case 'Completed': return 'text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-900/20 border-emerald-200 dark:border-emerald-500/50';
                    case 'Started': return 'text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-500/50';
                    case 'Paused': return 'text-purple-700 dark:text-purple-400 bg-purple-50 dark:bg-purple-900/20 border-purple-200 dark:border-purple-500/50';
                    default: return 'text-slate-600 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                }
            };

            return (
                <div className={`bg-white dark:bg-slate-900 rounded-2xl shadow-sm dark:shadow-lg border transition-all flex flex-col overflow-hidden ${isPending ? 'border-amber-400/80 dark:border-amber-500/60' : 'border-slate-200 dark:border-slate-800'}`}>
                    <div className="p-5 border-b border-slate-100 dark:border-slate-800/50">
                        <div className="flex justify-between items-start mb-3">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className={`text-[10px] font-bold px-2 py-1 rounded uppercase border ${subjectColor}`}>{subject}</span>
                                <span className="text-xs font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded">{paper} • Ch {chapterNo}</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                                {isPending && <span className="text-[10px] font-bold text-amber-600 dark:text-amber-400 bg-amber-50 dark:bg-amber-900/30 px-2 py-0.5 rounded-full flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span> Queued</span>}
                                <span className="text-[10px] text-slate-300 dark:text-slate-600">v{version}</span>
                            </div>
                        </div>

                        <h3 className="font-extrabold text-slate-800 dark:text-white text-lg leading-tight mb-1">{titleEn}</h3>
                        <p className="text-sm font-medium text-slate-500 mb-3">{titleBn}</p>

                        <div className="flex items-center justify-between text-xs font-bold text-slate-500 mb-1.5">
                            <span>Milestones ({progress.done}/{progress.total})</span>
                            <span className="text-indigo-600 dark:text-indigo-400">{progress.pct}%</span>
                        </div>
                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden mb-4">
                            <div className="bg-indigo-600 dark:bg-indigo-500 h-full rounded-full transition-all duration-300" style={{ width: `${progress.pct}%` }}></div>
                        </div>
                        
                        <div className="flex items-center justify-between bg-slate-50 dark:bg-slate-950 p-2 rounded-xl border border-slate-100 dark:border-slate-800">
                            <div className="flex items-center gap-2">
                                <span className="text-xs font-bold text-slate-500 ml-1.5">Status:</span>
                                {confidence && confidence !== 'Unrated' && (
                                    <span className={`text-[10px] inline-flex font-bold px-2 py-0.5 rounded items-center gap-1 border ${getConfidenceStyle(confidence)}`}>
                                        {confidence === 'Low' && <i className="fa-solid fa-triangle-exclamation"></i>} {confidence}
                                    </span>
                                )}
                            </div>
                            <select value={status} onChange={(e) => onUpdate(id, 'status', e.target.value)} className={`text-xs font-bold px-3 py-1.5 rounded-lg border outline-none cursor-pointer ${getStatusColor(status)}`}>
                                <option value="Not Started">Not Started</option>
                                <option value="Started">Started</option>
                                <option value="Paused">Paused</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div className="p-5 bg-slate-50/50 dark:bg-slate-800/20 flex-1 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center justify-between mb-3">
                                <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Study Milestones</h4>
                                <button
                                    type="button"
                                    onClick={() => onMarkAll(id, !allDone)}
                                    className="text-[11px] font-bold text-indigo-600 dark:text-indigo-400 hover:underline"
                                >
                                    {allDone ? 'Uncheck All' : 'Check All'}
                                </button>
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                                {MILESTONE_KEYS.map(m => (
                                    <MilestoneCheckbox
                                        key={m.key}
                                        label={m.label}
                                        checked={Boolean(safeMilestones[m.key])}
                                        onChange={() => toggleMilestone(m.key)}
                                    />
                                ))}
                            </div>
                        </div>

                        <div>
                            <div className="grid grid-cols-2 gap-3 mt-4">
                                <div className="bg-white dark:bg-slate-900 border border-yellow-100 dark:border-slate-700 rounded-xl p-2.5">
                                    <div className="text-[10px] font-bold text-yellow-600 dark:text-amber-500 uppercase mb-1.5">QB Solved</div>
                                    <div className="flex items-center justify-between bg-yellow-50 dark:bg-slate-950 rounded-lg p-1 border border-yellow-200/50 dark:border-slate-800">
                                        <button onClick={() => onUpdate(id, 'qbSolved', Math.max(0, (qbSolved || 0) - 1))} className="w-7 h-7 bg-white dark:bg-slate-800 text-yellow-700 dark:text-slate-300 rounded font-bold hover:bg-yellow-100 transition">-</button>
                                        <span className="font-extrabold text-yellow-900 dark:text-amber-500 text-base">{qbSolved || 0}</span>
                                        <button onClick={() => onUpdate(id, 'qbSolved', (qbSolved || 0) + 1)} className="w-7 h-7 bg-white dark:bg-slate-800 text-yellow-700 dark:text-slate-300 rounded font-bold hover:bg-yellow-100 transition">+</button>
                                    </div>
                                </div>
                                <div className="bg-white dark:bg-slate-900 border border-blue-100 dark:border-slate-700 rounded-xl p-2.5">
                                    <div className="text-[10px] font-bold text-blue-600 dark:text-indigo-400 uppercase mb-1.5">Revisions</div>
                                    <div className="flex items-center justify-between bg-blue-50 dark:bg-slate-950 rounded-lg p-1 border border-blue-200/50 dark:border-slate-800">
                                        <button onClick={() => onUpdate(id, 'revisions', Math.max(0, (revisions || 0) - 1))} className="w-7 h-7 bg-white dark:bg-slate-800 text-blue-700 dark:text-slate-300 rounded font-bold hover:bg-blue-100 transition">-</button>
                                        <span className="font-extrabold text-blue-900 dark:text-indigo-400 text-base">{revisions || 0}</span>
                                        <button onClick={() => onUpdate(id, 'revisions', (revisions || 0) + 1)} className="w-7 h-7 bg-white dark:bg-slate-800 text-blue-700 dark:text-slate-300 rounded font-bold hover:bg-blue-100 transition">+</button>
                                    </div>
                                </div>
                            </div>

                            <div className="grid grid-cols-3 gap-2.5 mt-4 pt-4 border-t border-slate-200/60 dark:border-slate-800">
                                <div>
                                    <label className="text-[10px] text-slate-500 font-bold block mb-1">Written:</label>
                                    <input
                                        type="text"
                                        placeholder="42/50"
                                        value={localWritten}
                                        onChange={(e) => handleTextChange('writtenScore', e.target.value, setLocalWritten)}
                                        onBlur={() => onUpdate(id, 'writtenScore', localWritten)}
                                        className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center"
                                    />
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-500 font-bold block mb-1">MCQ:</label>
                                    <input
                                        type="text"
                                        placeholder="28/30"
                                        value={localMcq}
                                        onChange={(e) => handleTextChange('mcqScore', e.target.value, setLocalMcq)}
                                        onBlur={() => onUpdate(id, 'mcqScore', localMcq)}
                                        className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center"
                                    />
                                </div>
                                <div>
                                    <label className="text-[10px] text-slate-500 font-bold block mb-1">Conf:</label>
                                    <select value={confidence} onChange={(e) => onUpdate(id, 'confidence', e.target.value)} className="w-full text-xs font-bold text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-2 py-2 focus:ring-2 focus:ring-indigo-500 outline-none text-center cursor-pointer">
                                        <option value="Unrated">-</option>
                                        <option value="Low">Low</option>
                                        <option value="Medium">Med</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>

                            {/* Quick Notes Section */}
                            <div className="mt-3">
                                {!showNotes ? (
                                    <button onClick={() => setShowNotes(true)} className="text-[11px] font-bold text-slate-400 hover:text-indigo-500 flex items-center gap-1">
                                        <i className="fa-regular fa-note-sticky"></i> Add study note...
                                    </button>
                                ) : (
                                    <input
                                        type="text"
                                        placeholder="Quick note (e.g., revise पेज 45 formulas)..."
                                        value={localNotes}
                                        onChange={(e) => handleTextChange('notes', e.target.value, setLocalNotes)}
                                        onBlur={() => onUpdate(id, 'notes', localNotes)}
                                        className="w-full text-xs font-medium text-slate-700 dark:text-slate-300 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-indigo-500 outline-none"
                                    />
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MilestoneCheckbox({ label, checked, onChange }) {
            return (
                <div onClick={onChange} className={`flex items-center gap-2 p-2 rounded-xl border cursor-pointer transition-all select-none ${checked ? 'bg-indigo-50 dark:bg-indigo-900/30 border-indigo-200 dark:border-indigo-500/50 text-indigo-700 dark:text-indigo-400 shadow-inner' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800'}`}>
                    {checked ? <i className="fa-solid fa-circle-check text-indigo-600 text-base"></i> : <i className="fa-regular fa-circle text-slate-300 dark:text-slate-600 text-base"></i>}
                    <span className="text-[11px] font-bold leading-none">{label}</span>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
