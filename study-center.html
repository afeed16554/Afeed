<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Study Command Center</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f3f4f6; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fas fa-graduation-cap text-2xl"></i>
                <h1 class="text-xl font-bold tracking-tight">Study Command Center</h1>
            </div>
            <div class="text-sm font-medium bg-indigo-800 px-3 py-1 rounded-full">
                Beta v1.0
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left Column: Input Form -->
        <div class="lg:col-span-1 space-y-6">
            <div class="glass-panel rounded-2xl shadow-sm p-6">
                <h2 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2">
                    <i class="fas fa-plus-circle text-indigo-600 mr-2"></i>Log Study Session
                </h2>
                
                <form id="study-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                        <input type="text" name="name" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="Enter your name">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Date</label>
                        <input type="date" name="date" id="date-input" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Subject</label>
                        <select name="subject" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                            <option value="" disabled selected>Select a subject...</option>
                            <option value="Physics">Physics</option>
                            <option value="Mathematics">Mathematics</option>
                            <option value="Chemistry">Chemistry</option>
                            <option value="Biology">Biology</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Literature">Literature</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Topic / Module</label>
                        <input type="text" name="topic" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="e.g. Quantum Mechanics">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Duration (Minutes)</label>
                        <input type="number" name="duration" min="1" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all" placeholder="60">
                    </div>

                    <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition-colors flex justify-center items-center gap-2">
                        <span>Save to Database</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </form>

                <!-- Status Message Box -->
                <div id="status-message" class="hidden mt-4 p-3 rounded-lg text-sm text-center font-medium"></div>
            </div>
        </div>

        <!-- Right Column: Data Display -->
        <div class="lg:col-span-2 space-y-6">
            <div class="glass-panel rounded-2xl shadow-sm p-6 flex flex-col h-full">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-lg font-bold text-gray-900">
                        <i class="fas fa-table text-indigo-600 mr-2"></i>Global Study Logs
                    </h2>
                    <button onclick="fetchData()" class="text-sm text-indigo-600 hover:text-indigo-800 flex items-center gap-1 transition-colors">
                        <i class="fas fa-sync-alt" id="refresh-icon"></i> Refresh
                    </button>
                </div>
                
                <div class="flex-grow overflow-hidden flex flex-col">
                    <div class="overflow-x-auto flex-grow h-[400px]">
                        <table class="w-full text-sm text-left whitespace-nowrap">
                            <thead class="text-xs text-gray-700 uppercase bg-gray-100 sticky top-0">
                                <tr>
                                    <th scope="col" class="px-6 py-3 rounded-tl-lg">Date</th>
                                    <th scope="col" class="px-6 py-3">Name</th>
                                    <th scope="col" class="px-6 py-3">Subject</th>
                                    <th scope="col" class="px-6 py-3">Topic</th>
                                    <th scope="col" class="px-6 py-3 rounded-tr-lg">Duration</th>
                                </tr>
                            </thead>
                            <tbody id="data-table-body" class="divide-y divide-gray-200">
                                <!-- Data will be injected here by JavaScript -->
                                <tr>
                                    <td colspan="5" class="px-6 py-8 text-center text-gray-500">
                                        <i class="fas fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i><br>
                                        Loading data from Google Sheets...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ======================================================================
        // IMPORTANT: PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BELOW
        // ======================================================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2Y-5YX7wUHRA6w9JHUh0YB-1viVaEQo4NtBW7UzX95fOi9HtiB8SiQJgC4PEnbtc/exec'; // <--- PASTE HERE
        
        // Setup initial date
        document.getElementById('date-input').valueAsDate = new Date();

        const form = document.getElementById('study-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-message');
        const tableBody = document.getElementById('data-table-body');
        const refreshIcon = document.getElementById('refresh-icon');

        // Helper function to show messages
        function showMessage(text, type) {
            statusMsg.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700', 'bg-blue-100', 'text-blue-700');
            statusMsg.textContent = text;
            
            if (type === 'success') {
                statusMsg.classList.add('bg-green-100', 'text-green-700');
            } else if (type === 'error') {
                statusMsg.classList.add('bg-red-100', 'text-red-700');
            } else {
                statusMsg.classList.add('bg-blue-100', 'text-blue-700');
            }
            statusMsg.classList.remove('hidden');
            
            // Auto hide after 5 seconds if success
            if(type === 'success') {
                setTimeout(() => { statusMsg.classList.add('hidden'); }, 5000);
            }
        }

        // Handle Form Submission (Saving to Google Sheets)
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            if (SCRIPT_URL === 'YOUR_WEB_APP_URL_HERE') {
                showMessage('Error: You need to add your Google Script URL to the code.', 'error');
                return;
            }

            // Update UI to show loading
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');

            const formData = new FormData(form);

            fetch(SCRIPT_URL, { method: 'POST', body: formData })
                .then(response => {
                    if(!response.ok) throw new Error('Network response was not ok');
                    showMessage('Success! Study session logged.', 'success');
                    form.reset();
                    document.getElementById('date-input').valueAsDate = new Date(); // reset date
                    fetchData(); // Refresh table
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    showMessage('Failed to save data. Please try again.', 'error');
                })
                .finally(() => {
                    // Restore button UI
                    submitBtn.innerHTML = originalBtnHtml;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                });
        });

        // Handle Fetching Data (Reading from Google Sheets)
        function fetchData() {
            if (SCRIPT_URL === 'YOUR_WEB_APP_URL_HERE') {
                tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500 font-medium">Please add your Web App URL in the HTML code to see data.</td></tr>';
                return;
            }

            refreshIcon.classList.add('fa-spin');
            
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    tableBody.innerHTML = ''; // Clear table
                    
                    if (data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-gray-500">No logs found yet. Start studying!</td></tr>';
                        return;
                    }

                    // Reverse data to show newest at the top
                    data.reverse().forEach(row => {
                        // Format the date if it looks like an ISO string
                        let displayDate = row['Date'];
                        if(displayDate && displayDate.includes('T')) {
                            displayDate = new Date(displayDate).toLocaleDateString();
                        }

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition-colors";
                        tr.innerHTML = `
                            <td class="px-6 py-4 font-medium text-gray-900">${displayDate || '-'}</td>
                            <td class="px-6 py-4">${row['Name'] || '-'}</td>
                            <td class="px-6 py-4">
                                <span class="bg-indigo-100 text-indigo-800 text-xs font-medium px-2.5 py-0.5 rounded">${row['Subject'] || '-'}</span>
                            </td>
                            <td class="px-6 py-4 text-gray-600">${row['Topic'] || '-'}</td>
                            <td class="px-6 py-4 font-semibold text-gray-700">${row['Duration (Mins)'] || '-'} min</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error(err);
                    tableBody.innerHTML = '<tr><td colspan="5" class="px-6 py-8 text-center text-red-500">Error loading data.</td></tr>';
                })
                .finally(() => {
                    refreshIcon.classList.remove('fa-spin');
                });
        }

        // Fetch data when page loads
        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
