<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Study Command Center</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // ==========================================
        // 1. Google Web App URL (আপনার Apps Script URL এখানে দিন)
        // ==========================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxxLD3VoJ2lCxbFwedHwUD3YdVzgnhAejkvxXrjgXADntBI86jS_7quvS4pZGTDmL8_/exec"; 
        
        // ফলব্যাক ডেটা পার্সিং (ফাঁকা কলাম ফিক্স সহ)
        const parseFallbackTSV = (tsv) => {
            const lines = tsv.trim().split('\n');
            let lastSubject = 'Unknown';
            let lastPaper = 'Unknown';

            return lines.slice(1).map((line, index) => {
                const cols = line.split('\t');
                const paperStr = cols[0] ? cols[0].trim() : '';

                if (paperStr !== '') {
                    const subjectParts = paperStr.split(' - ');
                    lastSubject = subjectParts[0] ? subjectParts[0].trim() : 'Unknown';
                    lastPaper = subjectParts[1] ? subjectParts[1].trim() : 'Unknown';
                }

                return {
                    id: `ch-${index}`, rowNum: index + 2, 
                    subject: lastSubject, 
                    paper: lastPaper,
                    chapterNo: cols[1] || '', titleEn: cols[2] || '', titleBn: cols[3] || '', status: cols[4] || 'Not Started',
                    milestones: { theory: cols[5] === 'Done', textbook: cols[6] === 'Done', written: cols[7] === 'Done', questionBank: false },
                    mcqScore: cols[8] || '', qbSolved: parseInt(cols[9]) || 0, revisions: parseInt(cols[10]) || 0,
                    confidence: cols[11] || 'Unrated', writtenScore: cols[12] || '', notes: cols[13] || ''
                };
            });
        };

        const rawTSVData = `Paper	Chapter No.	Chapter Title (English)	Chapter Title (Bangla)	Status	Theory / Lectures	Textbook & Notes	CQ Practice	MCQ Practice Score	Board Questions Solved	Revision Count	Confidence Level	Mock Test / Exam Marks	Notes & Weak Topics
Physics - 1st Paper	1	Physical World and Measurement	ভৌতজগৎ ও পরিমাপ	Not Started						0	Low		
	2	Vector	ভেক্টর	Not Started	Pending	Pending				0			
	3	Dynamics	গতিবিদ্যা	Not Started						0			`;

        // ==========================================
        // MAIN APPLICATION COMPONENT
        // ==========================================
        function App() {
            const [chapters, setChapters] = useState([]);
            const [activeSubject, setActiveSubject] = useState('All Subjects');
            const [activePaper, setActivePaper] = useState('All');
            const [viewMode, setViewMode] = useState('tiles'); // 'tiles', 'table'
            const [searchTerm, setSearchTerm] = useState('');
            const [statusFilter, setStatusFilter] = useState('All Statuses');
            const [confidenceFilter, setConfidenceFilter] = useState('All Levels');
            
            const [loading, setLoading] = useState(true);
            const [syncStatus, setSyncStatus] = useState('synced');

            // Data Fetching
            useEffect(() => {
                const fetchData = async () => {
                    if (WEB_APP_URL && WEB_APP_URL !== "YOUR_WEB_APP_URL_HERE") {
                        try {
                            const response = await fetch(WEB_APP_URL);
                            const data = await response.json();
                            setChapters(data);
                            setSyncStatus('synced');
                        } catch (error) {
                            console.error("Error fetching data:", error);
                            setChapters(parseFallbackTSV(rawTSVData));
                            setSyncStatus('error');
                        }
                    } else {
                        setChapters(parseFallbackTSV(rawTSVData));
                        setSyncStatus('error');
                    }
                    setLoading(false);
                };
                fetchData();
            }, []);

            // Data Syncing Function
            const updateChapter = async (id, field, value) => {
                const targetChapter = chapters.find(c => c.id === id);
                let updatedFields = {};

                setChapters(prev => prev.map(ch => {
                    if (ch.id === id) {
                        if (field.includes('.')) {
                            const [parent, child] = field.split('.');
                            updatedFields = { [parent]: { ...ch[parent], [child]: value } };
                            return { ...ch, ...updatedFields };
                        }
                        updatedFields = { [field]: value };
                        return { ...ch, [field]: value };
                    }
                    return ch;
                }));

                if (WEB_APP_URL && WEB_APP_URL !== "YOUR_WEB_APP_URL_HERE") {
                    setSyncStatus('syncing');
                    try {
                        const payload = { rowNum: targetChapter.rowNum, ...updatedFields };
                        await fetch(WEB_APP_URL, {
                            method: 'POST',
                            body: JSON.stringify(payload),
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                        });
                        setSyncStatus('synced');
                    } catch (error) {
                        setSyncStatus('error');
                    }
                }
            };

            // Helpers
            const subjectsList = Array.from(new Set(chapters.map(ch => ch.subject))).filter(s => s !== 'Unknown');
            const papersList = activeSubject !== 'All Subjects' 
                ? Array.from(new Set(chapters.filter(c => c.subject === activeSubject).map(c => c.paper))) 
                : [];

            const getSubjectColor = (sub) => {
                switch(sub) {
                    case 'Physics': return 'text-indigo-600 bg-indigo-50 border-indigo-200';
                    case 'Chemistry': return 'text-emerald-600 bg-emerald-50 border-emerald-200';
                    case 'Higher Math': return 'text-blue-600 bg-blue-50 border-blue-200';
                    case 'Biology': return 'text-rose-600 bg-rose-50 border-rose-200';
                    default: return 'text-slate-600 bg-slate-50 border-slate-200';
                }
            };

            const getHeaderStyle = (sub) => {
                switch(sub) {
                    case 'All Subjects': return 'bg-gradient-to-r from-blue-900 via-indigo-900 to-violet-900';
                    case 'Physics': return 'bg-gradient-to-r from-indigo-900 to-indigo-700';
                    case 'Chemistry': return 'bg-gradient-to-r from-emerald-900 to-teal-800';
                    case 'Higher Math': return 'bg-gradient-to-r from-blue-900 to-cyan-800';
                    case 'Biology': return 'bg-gradient-to-r from-rose-900 to-pink-800';
                    default: return 'bg-gradient-to-r from-slate-900 to-slate-700';
                }
            };

            const getSubjectPrefix = (sub) => {
                switch(sub) {
                    case 'Physics': return 'PH';
                    case 'Chemistry': return 'CH';
                    case 'Higher Math': return 'HM';
                    case 'Biology': return 'BI';
                    default: return 'SUB';
                }
            };

            // Filtering Logic for Subject View
            const filteredChapters = chapters.filter(ch => {
                if (activeSubject !== 'All Subjects' && ch.subject !== activeSubject) return false;
                if (activePaper !== 'All' && ch.paper !== activePaper) return false;
                if (statusFilter !== 'All Statuses' && ch.status !== statusFilter) return false;
                if (confidenceFilter !== 'All Levels' && ch.confidence !== confidenceFilter) return false;
                
                const searchLower = searchTerm.toLowerCase();
                return ch.titleEn.toLowerCase().includes(searchLower) || ch.titleBn.includes(searchLower);
            });

            // Action Needed Logic (For Universal Dashboard)
            const actionQueueChapters = chapters.filter(ch => 
                ch.status === 'In Progress' || ch.confidence === 'Low'
            );

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center gap-3">
                        <i className="fa-solid fa-spinner fa-spin text-3xl text-indigo-500"></i>
                        <p className="font-medium animate-pulse text-slate-500">Fetching live data from Google Sheets...</p>
                    </div>
                );
            }

            return (
                <div className="pb-20">
                    <div className="p-4 md:p-6 lg:p-8 max-w-[1400px] mx-auto space-y-6">
                        
                        {/* Status Warnings */}
                        {WEB_APP_URL === "YOUR_WEB_APP_URL_HERE" && (
                            <div className="bg-amber-50 border border-amber-200 text-amber-800 px-4 py-3 rounded-xl text-sm flex items-start gap-3">
                               <i className="fa-solid fa-triangle-exclamation mt-1"></i>
                               <div>
                                  <strong>Live connection not active!</strong> Update <code>WEB_APP_URL</code> in code with your Google Apps Script Deployment URL.
                               </div>
                            </div>
                        )}

                        {/* Top Subject Navigation Ribbon */}
                        <div className="bg-white rounded-full shadow-sm border border-slate-200 p-1.5 flex items-center gap-1 overflow-x-auto custom-scrollbar">
                            <button 
                                onClick={() => { setActiveSubject('All Subjects'); setActivePaper('All'); }}
                                className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-bold transition whitespace-nowrap ${
                                    activeSubject === 'All Subjects' ? 'bg-slate-800 text-white' : 'text-slate-600 hover:bg-slate-100'
                                }`}
                            >
                                <i className="fa-solid fa-layer-group"></i> All Subjects Hub
                            </button>
                            <div className="w-px h-6 bg-slate-200 mx-2"></div>
                            {subjectsList.map((sub, idx) => {
                                const subTotal = chapters.filter(c => c.subject === sub).length;
                                const subCompleted = chapters.filter(c => c.subject === sub && c.status === 'Completed').length;
                                const subProgress = subTotal === 0 ? 0 : Math.round((subCompleted / subTotal) * 100);
                                
                                return (
                                    <button 
                                        key={idx}
                                        onClick={() => { setActiveSubject(sub); setActivePaper('All'); }}
                                        className={`flex items-center gap-2 px-4 py-1.5 rounded-full text-sm font-medium transition whitespace-nowrap ${
                                            activeSubject === sub 
                                            ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 shadow-sm' 
                                            : 'text-slate-600 hover:bg-slate-50 border border-transparent'
                                        }`}
                                    >
                                        {sub} <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${activeSubject === sub ? 'bg-indigo-100' : 'bg-slate-100'}`}>{subProgress}% ({subTotal})</span>
                                    </button>
                                )
                            })}
                        </div>

                        {/* UNIVERSAL DASHBOARD VIEW */}
                        {activeSubject === 'All Subjects' && (
                            <div className="space-y-8">
                                {/* Header */}
                                <div className={`${getHeaderStyle('All Subjects')} rounded-2xl p-6 md:p-8 text-white shadow-lg relative overflow-hidden`}>
                                    <div className="absolute right-0 top-0 w-64 h-64 bg-white opacity-5 rounded-full -translate-y-1/2 translate-x-1/3 blur-3xl"></div>
                                    <div className="relative z-10">
                                        <div className="flex items-center gap-3 mb-2 opacity-80">
                                            <i className="fa-solid fa-earth-americas"></i>
                                            <span className="text-sm font-medium tracking-wide uppercase">Universal Multi-Subject Master Hub</span>
                                        </div>
                                        <h1 className="text-3xl md:text-4xl font-bold mb-4">Universal Study Command Center</h1>
                                        <p className="max-w-2xl text-slate-200 text-sm md:text-base mb-8">
                                            Track syllabus mastery, chapters, topics, Written practice, MCQ practice, Question Bank solves, and revision counters across all subjects in real time.
                                        </p>
                                        
                                        <div className="flex gap-4">
                                            <div className="glass-panel px-4 py-3 rounded-xl flex items-center gap-3">
                                                <div className="bg-white/20 p-2 rounded-lg"><i className="fa-solid fa-book text-xl"></i></div>
                                                <div>
                                                    <div className="text-xs text-slate-300">Total Subjects Active</div>
                                                    <div className="font-bold text-xl">{subjectsList.length}</div>
                                                </div>
                                            </div>
                                            <div className="glass-panel px-4 py-3 rounded-xl flex items-center gap-3">
                                                <div className="bg-white/20 p-2 rounded-lg"><i className="fa-solid fa-list-check text-xl"></i></div>
                                                <div>
                                                    <div className="text-xs text-slate-300">Total Chapters</div>
                                                    <div className="font-bold text-xl">{chapters.length}</div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Subject Hubs Grid */}
                                <div>
                                    <div className="flex items-center gap-2 mb-4 text-slate-700">
                                        <i className="fa-solid fa-satellite-dish text-indigo-600"></i>
                                        <h2 className="text-lg font-bold">All Subject Study Command Hubs</h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                        {subjectsList.map(sub => {
                                            const subChaps = chapters.filter(c => c.subject === sub);
                                            const subCompleted = subChaps.filter(c => c.status === 'Completed').length;
                                            const subInProgress = subChaps.filter(c => c.status === 'In Progress').length;
                                            const progress = subChaps.length === 0 ? 0 : Math.round((subCompleted / subChaps.length) * 100);
                                            const uniquePapers = Array.from(new Set(subChaps.map(c => c.paper))).length;

                                            return (
                                                <div key={sub} className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all group">
                                                    <div className="flex justify-between items-start mb-4">
                                                        <div className="flex items-center gap-3">
                                                            <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm ${getSubjectColor(sub).replace('border-', 'bg-opacity-20 ')}`}>
                                                                {getSubjectPrefix(sub)}
                                                            </div>
                                                            <div>
                                                                <h3 className="font-bold text-slate-800 leading-tight">{sub}</h3>
                                                                <p className="text-xs text-slate-500">{subChaps.length} Chapters • {uniquePapers} Papers</p>
                                                            </div>
                                                        </div>
                                                        <span className={`font-bold text-lg ${getSubjectColor(sub).split(' ')[0]}`}>{progress}%</span>
                                                    </div>

                                                    <div className="w-full bg-slate-100 h-1.5 rounded-full mb-4 overflow-hidden">
                                                        <div className={`h-full rounded-full ${getSubjectColor(sub).split(' ')[0].replace('text', 'bg')}`} style={{ width: `${progress}%` }}></div>
                                                    </div>

                                                    <div className="grid grid-cols-3 gap-2 mb-4">
                                                        <div className="text-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                            <div className="text-[10px] text-slate-400 uppercase font-bold mb-1">In Progress</div>
                                                            <div className="font-bold text-orange-600">{subInProgress} ch</div>
                                                        </div>
                                                        <div className="text-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                            <div className="text-[10px] text-slate-400 uppercase font-bold mb-1">Completed</div>
                                                            <div className="font-bold text-emerald-600">{subCompleted} ch</div>
                                                        </div>
                                                        <div className="text-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                                                            <div className="text-[10px] text-slate-400 uppercase font-bold mb-1">Revisions</div>
                                                            <div className="font-bold text-blue-600">{subChaps.reduce((acc, c) => acc + c.revisions, 0)}</div>
                                                        </div>
                                                    </div>

                                                    <button 
                                                        onClick={() => setActiveSubject(sub)}
                                                        className="w-full py-2 text-sm font-bold text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors flex items-center justify-center gap-2"
                                                    >
                                                        Open {sub} Center <i className="fa-solid fa-arrow-right text-xs"></i>
                                                    </button>
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>

                                {/* Active Study Queue (Weak / In Progress) */}
                                <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                                    <div className="flex items-center justify-between mb-4 border-b border-slate-100 pb-4">
                                        <div>
                                            <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                                                <i className="fa-solid fa-clock-rotate-left text-orange-500"></i> Currently In-Progress & Weak Topics Queue
                                            </h2>
                                            <p className="text-sm text-slate-500">Quickly track and update chapters that need your attention.</p>
                                        </div>
                                        <div className="px-3 py-1 bg-orange-50 text-orange-700 font-bold rounded-lg text-sm border border-orange-200">
                                            {actionQueueChapters.length} Action Items
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                                        {actionQueueChapters.slice(0, 6).map(chapter => (
                                            <ChapterCard key={chapter.id} chapter={chapter} onUpdate={updateChapter} subjectColor={getSubjectColor(chapter.subject)} />
                                        ))}
                                    </div>
                                    {actionQueueChapters.length === 0 && (
                                        <div className="text-center py-8 text-slate-400">
                                            <i className="fa-solid fa-clipboard-check text-4xl mb-3 opacity-50"></i>
                                            <p>No chapters in progress or marked as low confidence. Great job!</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* SPECIFIC SUBJECT DASHBOARD VIEW */}
                        {activeSubject !== 'All Subjects' && (
                            <div className="space-y-6">
                                {/* Subject Header */}
                                <div className={`${getHeaderStyle(activeSubject)} rounded-2xl p-6 text-white shadow-lg relative`}>
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 relative z-10">
                                        <div>
                                            <div className="flex items-center gap-2 text-white/70 text-sm mb-3">
                                                <button onClick={() => setActiveSubject('All Subjects')} className="hover:text-white transition"><i className="fa-solid fa-layer-group"></i> All Subjects</button>
                                                <span>/</span>
                                                <span>{activeSubject} Command Center</span>
                                            </div>
                                            <h1 className="text-3xl font-bold flex items-center gap-3">
                                                <i className="fa-solid fa-book-open opacity-80"></i> {activeSubject} Command Center
                                            </h1>
                                        </div>
                                        
                                        <div className="flex items-center gap-2 bg-black/20 px-3 py-1.5 rounded-full text-xs font-medium">
                                           {syncStatus === 'syncing' ? <i className="fa-solid fa-spinner fa-spin text-blue-300"></i> 
                                            : syncStatus === 'error' ? <i className="fa-solid fa-cloud-bolt text-rose-400"></i> 
                                            : <i className="fa-solid fa-cloud-check text-emerald-400"></i>}
                                           {syncStatus === 'syncing' ? 'Saving...' : syncStatus === 'error' ? 'Local Mode' : 'Synced'}
                                        </div>
                                    </div>
                                </div>

                                {/* Papers Selection Section */}
                                <div className="space-y-3">
                                    <div className="flex items-center justify-between">
                                        <h2 className="text-lg font-bold flex items-center gap-2 text-slate-800">
                                            <i className="fa-solid fa-layer-group text-indigo-500"></i> Modules & Papers
                                        </h2>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <button 
                                            onClick={() => setActivePaper('All')}
                                            className={`p-4 rounded-xl border text-left transition-all ${activePaper === 'All' ? 'bg-indigo-50 border-indigo-500 shadow-md ring-1 ring-indigo-500' : 'bg-white border-slate-200 hover:border-indigo-300'}`}
                                        >
                                            <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Overview</div>
                                            <div className="font-bold text-lg text-slate-800">All Papers Combined</div>
                                            <div className="text-sm text-slate-500 mt-1">{chapters.filter(c=>c.subject===activeSubject).length} Total Chapters</div>
                                        </button>
                                        
                                        {papersList.map(paper => {
                                            const pChaps = chapters.filter(c => c.subject === activeSubject && c.paper === paper);
                                            const pComp = pChaps.filter(c => c.status === 'Completed').length;
                                            const pProg = pChaps.length === 0 ? 0 : Math.round((pComp / pChaps.length) * 100);
                                            
                                            return (
                                                <button 
                                                    key={paper}
                                                    onClick={() => setActivePaper(paper)}
                                                    className={`p-4 rounded-xl border text-left transition-all ${activePaper === paper ? 'bg-indigo-50 border-indigo-500 shadow-md ring-1 ring-indigo-500' : 'bg-white border-slate-200 hover:border-indigo-300'}`}
                                                >
                                                    <div className="flex justify-between items-start mb-1">
                                                        <div className="text-xs font-bold text-indigo-600 bg-indigo-100/50 px-2 py-0.5 rounded uppercase tracking-wider">{activeSubject}</div>
                                                        <div className="font-bold text-lg text-indigo-900">{pProg}%</div>
                                                    </div>
                                                    <div className="font-bold text-lg text-slate-800">{paper}</div>
                                                    <div className="text-sm text-slate-500 mt-1">{pChaps.length} Chapters</div>
                                                    <div className="w-full bg-slate-200 h-1.5 rounded-full mt-3">
                                                        <div className="bg-indigo-500 h-1.5 rounded-full" style={{width: `${pProg}%`}}></div>
                                                    </div>
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>

                                {/* Toolbar & View Ribbon */}
                                <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-2 flex flex-col lg:flex-row gap-4 items-center justify-between">
                                    {/* View Toggle */}
                                    <div className="flex items-center p-1 bg-slate-100 rounded-lg w-full lg:w-auto">
                                        <button 
                                            onClick={() => setViewMode('tiles')}
                                            className={`flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'tiles' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                        >
                                            <i className="fa-solid fa-border-all"></i> Interactive Tiles
                                        </button>
                                        <button 
                                            onClick={() => setViewMode('table')}
                                            className={`flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-md text-sm font-bold transition-all ${viewMode === 'table' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                                        >
                                            <i className="fa-solid fa-table-list"></i> Master Table
                                        </button>
                                    </div>
                                    
                                    {/* Filters */}
                                    <div className="flex-1 w-full flex flex-col md:flex-row items-center gap-3 px-2">
                                        <div className="relative flex-1 w-full">
                                            <i className="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                                            <input 
                                                type="text" 
                                                placeholder="Search chapter or topic..." 
                                                className="w-full bg-slate-50 border border-slate-200 rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                                                value={searchTerm}
                                                onChange={(e) => setSearchTerm(e.target.value)}
                                            />
                                        </div>
                                        <select 
                                            value={statusFilter} onChange={e => setStatusFilter(e.target.value)}
                                            className="w-full md:w-auto bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-indigo-500"
                                        >
                                            <option value="All Statuses">Status: All</option>
                                            <option value="Not Started">Not Started</option>
                                            <option value="In Progress">In Progress</option>
                                            <option value="Completed">Completed</option>
                                        </select>
                                        <select 
                                            value={confidenceFilter} onChange={e => setConfidenceFilter(e.target.value)}
                                            className="w-full md:w-auto bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-medium focus:ring-2 focus:ring-indigo-500"
                                        >
                                            <option value="All Levels">Confidence: All</option>
                                            <option value="Unrated">Unrated</option>
                                            <option value="Low">Low</option>
                                            <option value="Medium">Medium</option>
                                            <option value="High">High</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Content Area: Tiles OR Table */}
                                {viewMode === 'tiles' ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6">
                                        {filteredChapters.map((chapter) => (
                                            <ChapterCard key={chapter.id} chapter={chapter} onUpdate={updateChapter} subjectColor={getSubjectColor(chapter.subject)} />
                                        ))}
                                    </div>
                                ) : (
                                    <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left text-sm whitespace-nowrap">
                                                <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] border-b border-slate-200">
                                                    <tr>
                                                        <th className="px-4 py-3">Chapter</th>
                                                        <th className="px-4 py-3">Status</th>
                                                        <th className="px-4 py-3 text-center">Theory</th>
                                                        <th className="px-4 py-3 text-center">Textbook</th>
                                                        <th className="px-4 py-3 text-center">CQ</th>
                                                        <th className="px-4 py-3 text-center">MCQ Score</th>
                                                        <th className="px-4 py-3 text-center">QB Solves</th>
                                                        <th className="px-4 py-3 text-center">Rev</th>
                                                        <th className="px-4 py-3">Confidence</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {filteredChapters.map(ch => (
                                                        <tr key={ch.id} className="hover:bg-slate-50 transition-colors">
                                                            <td className="px-4 py-3">
                                                                <div className="font-bold text-slate-800">{ch.titleEn}</div>
                                                                <div className="text-[10px] text-slate-500">{ch.paper} • Ch {ch.chapterNo}</div>
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <select 
                                                                    value={ch.status} onChange={(e) => updateChapter(ch.id, 'status', e.target.value)}
                                                                    className="text-xs font-bold bg-transparent outline-none cursor-pointer"
                                                                >
                                                                    <option value="Not Started">Not Started</option>
                                                                    <option value="In Progress">In Progress</option>
                                                                    <option value="Completed">Completed</option>
                                                                </select>
                                                            </td>
                                                            <td className="px-4 py-3 text-center cursor-pointer" onClick={() => updateChapter(ch.id, 'milestones.theory', !ch.milestones.theory)}>
                                                                {ch.milestones.theory ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300"></i>}
                                                            </td>
                                                            <td className="px-4 py-3 text-center cursor-pointer" onClick={() => updateChapter(ch.id, 'milestones.textbook', !ch.milestones.textbook)}>
                                                                {ch.milestones.textbook ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300"></i>}
                                                            </td>
                                                            <td className="px-4 py-3 text-center cursor-pointer" onClick={() => updateChapter(ch.id, 'milestones.written', !ch.milestones.written)}>
                                                                {ch.milestones.written ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300"></i>}
                                                            </td>
                                                            <td className="px-4 py-3">
                                                                <input 
                                                                    type="text" defaultValue={ch.mcqScore} onBlur={(e) => updateChapter(ch.id, 'mcqScore', e.target.value)}
                                                                    className="w-16 text-center text-xs bg-white border border-slate-200 rounded px-1 py-1 focus:ring-1 focus:ring-indigo-500 outline-none"
                                                                    placeholder="0/30"
                                                                />
                                                            </td>
                                                            <td className="px-4 py-3 text-center">
                                                                <div className="flex items-center justify-center gap-2">
                                                                    <button onClick={() => updateChapter(ch.id, 'qbSolved', Math.max(0, ch.qbSolved - 1))} className="text-slate-400 hover:text-slate-700">-</button>
                                                                    <span className="font-bold w-4">{ch.qbSolved}</span>
                                                                    <button onClick={() => updateChapter(ch.id, 'qbSolved', ch.qbSolved + 1)} className="text-slate-400 hover:text-slate-700">+</button>
                                                                </div>
                                                            </td>
                                                            <td className="px-4 py-3 text-center font-bold text-blue-600">{ch.revisions}</td>
                                                            <td className="px-4 py-3">
                                                                <select 
                                                                    value={ch.confidence} onChange={(e) => updateChapter(ch.id, 'confidence', e.target.value)}
                                                                    className="text-xs font-bold bg-transparent outline-none cursor-pointer"
                                                                >
                                                                    <option value="Unrated">Unrated</option>
                                                                    <option value="Low">Low</option>
                                                                    <option value="Medium">Medium</option>
                                                                    <option value="High">High</option>
                                                                </select>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                )}
                                
                                {filteredChapters.length === 0 && (
                                    <div className="text-center py-12 text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">
                                        <i className="fa-solid fa-folder-open text-4xl mb-3 opacity-50"></i>
                                        <p>No chapters found matching your selected filters.</p>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // SUB-COMPONENTS
        // ==========================================
        function ChapterCard({ chapter, onUpdate, subjectColor }) {
            const { id, subject, paper, chapterNo, titleEn, titleBn, status, milestones, qbSolved, revisions, writtenScore, mcqScore, confidence } = chapter;
            const [localWritten, setLocalWritten] = useState(writtenScore || '');
            const [localMcq, setLocalMcq] = useState(mcqScore || '');

            useEffect(() => { setLocalWritten(writtenScore || ''); }, [writtenScore]);
            useEffect(() => { setLocalMcq(mcqScore || ''); }, [mcqScore]);

            const toggleMilestone = (field) => onUpdate(id, `milestones.${field}`, !milestones[field]);

            const getConfidenceStyle = (conf) => {
                switch(conf) {
                    case 'High': return 'text-emerald-700 bg-emerald-50 border-emerald-200';
                    case 'Medium': return 'text-amber-700 bg-amber-50 border-amber-200';
                    case 'Low': return 'text-rose-700 bg-rose-50 border-rose-200';
                    default: return 'text-slate-500 bg-slate-50 border-slate-200';
                }
            };

            const getStatusColor = (stat) => {
                switch(stat) {
                    case 'Completed': return 'text-emerald-700 bg-emerald-50 border-emerald-200';
                    case 'In Progress': return 'text-orange-700 bg-orange-50 border-orange-200';
                    default: return 'text-slate-600 bg-slate-100 border-slate-200';
                }
            };

            return (
                <div className="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-slate-200 flex flex-col overflow-hidden relative group">
                    <div className="p-4 border-b border-slate-100">
                        <div className="flex justify-between items-start mb-3">
                            <div className="flex items-center gap-2 flex-wrap">
                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase border ${subjectColor}`}>
                                    {subject}
                                </span>
                                <span className="text-xs font-medium text-slate-500">{paper} • Ch {chapterNo}</span>
                                {confidence && confidence !== 'Unrated' && (
                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded flex items-center gap-1 border ${getConfidenceStyle(confidence)}`}>
                                        {confidence === 'Low' && <i className="fa-solid fa-triangle-exclamation"></i>}
                                        {confidence}
                                    </span>
                                )}
                            </div>
                        </div>

                        <h3 className="font-bold text-slate-800 leading-tight mb-1">{titleEn}</h3>
                        <p className="text-sm font-medium text-slate-500">{titleBn}</p>
                        
                        <div className="mt-4 flex items-center gap-2">
                            <span className="text-xs font-medium text-slate-500">Status:</span>
                            <select 
                                value={status}
                                onChange={(e) => onUpdate(id, 'status', e.target.value)}
                                className={`text-xs font-bold px-3 py-1.5 rounded-lg border outline-none cursor-pointer appearance-none ${getStatusColor(status)}`}
                            >
                                <option value="Not Started">Not Started</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>

                    <div className="p-4 bg-slate-50/50 flex-1">
                        <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-3">Study Milestones</h4>
                        <div className="grid grid-cols-2 gap-2">
                            <MilestoneCheckbox label="Theory / Lectures" checked={milestones.theory} onChange={() => toggleMilestone('theory')} />
                            <MilestoneCheckbox label="Textbook & Notes" checked={milestones.textbook} onChange={() => toggleMilestone('textbook')} />
                            <MilestoneCheckbox label="Written Practice" checked={milestones.written} onChange={() => toggleMilestone('written')} />
                            <MilestoneCheckbox label="Question Bank" checked={milestones.questionBank} onChange={() => toggleMilestone('questionBank')} />
                        </div>

                        <div className="grid grid-cols-2 gap-3 mt-4">
                            <div className="bg-white border border-yellow-100 rounded-lg p-2 shadow-sm">
                                <div className="flex items-center gap-1 text-[10px] font-bold text-yellow-600 uppercase mb-2">
                                    <i className="fa-solid fa-clock-rotate-left"></i> QB Solved:
                                </div>
                                <div className="flex items-center justify-between bg-yellow-50 rounded-md p-1 border border-yellow-200/50">
                                    <button onClick={() => onUpdate(id, 'qbSolved', Math.max(0, qbSolved - 1))} className="w-6 h-6 flex items-center justify-center text-yellow-700 hover:bg-yellow-200 rounded font-bold">-</button>
                                    <span className="font-bold text-yellow-900">{qbSolved}x</span>
                                    <button onClick={() => onUpdate(id, 'qbSolved', qbSolved + 1)} className="w-6 h-6 flex items-center justify-center text-yellow-700 hover:bg-yellow-200 rounded font-bold">+</button>
                                </div>
                            </div>
                            
                            <div className="bg-white border border-blue-100 rounded-lg p-2 shadow-sm">
                                <div className="flex items-center gap-1 text-[10px] font-bold text-blue-600 uppercase mb-2">
                                    <i className="fa-solid fa-rotate-right"></i> Revisions:
                                </div>
                                <div className="flex items-center justify-between bg-blue-50 rounded-md p-1 border border-blue-200/50">
                                    <button onClick={() => onUpdate(id, 'revisions', Math.max(0, revisions - 1))} className="w-6 h-6 flex items-center justify-center text-blue-700 hover:bg-blue-200 rounded font-bold">-</button>
                                    <span className="font-bold text-blue-900">{revisions}</span>
                                    <button onClick={() => onUpdate(id, 'revisions', revisions + 1)} className="w-6 h-6 flex items-center justify-center text-blue-700 hover:bg-blue-200 rounded font-bold">+</button>
                                </div>
                            </div>
                        </div>

                        <div className="grid grid-cols-3 gap-2 mt-4 pt-4 border-t border-slate-200/60">
                            <div>
                                <label className="text-[10px] text-slate-500 font-medium block mb-1">Written Score:</label>
                                <input 
                                    type="text" 
                                    placeholder="e.g. 42/50" 
                                    value={localWritten}
                                    onChange={(e) => setLocalWritten(e.target.value)}
                                    onBlur={() => onUpdate(id, 'writtenScore', localWritten)}
                                    className="w-full text-xs bg-white border border-slate-200 rounded px-2 py-1.5 focus:ring-1 focus:ring-indigo-500 outline-none"
                                />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-medium block mb-1">MCQ Score:</label>
                                <input 
                                    type="text" 
                                    placeholder="e.g. 28/30" 
                                    value={localMcq}
                                    onChange={(e) => setLocalMcq(e.target.value)}
                                    onBlur={() => onUpdate(id, 'mcqScore', localMcq)}
                                    className="w-full text-xs bg-white border border-slate-200 rounded px-2 py-1.5 focus:ring-1 focus:ring-indigo-500 outline-none"
                                />
                            </div>
                            <div>
                                <label className="text-[10px] text-slate-500 font-medium block mb-1">Confidence:</label>
                                <select 
                                    value={confidence}
                                    onChange={(e) => onUpdate(id, 'confidence', e.target.value)}
                                    className="w-full text-xs bg-white border border-slate-200 rounded px-2 py-1.5 focus:ring-1 focus:ring-indigo-500 outline-none font-medium"
                                >
                                    <option value="Unrated">Select</option>
                                    <option value="Low">Low</option>
                                    <option value="Medium">Medium</option>
                                    <option value="High">High</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function MilestoneCheckbox({ label, checked, onChange }) {
            return (
                <div 
                    onClick={onChange}
                    className={`flex items-center gap-2 p-2 rounded-lg border cursor-pointer transition-colors ${
                        checked 
                        ? 'bg-indigo-50 border-indigo-200 text-indigo-700' 
                        : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                    }`}
                >
                    {checked ? <i className="fa-solid fa-circle-check text-indigo-600"></i> : <i className="fa-regular fa-circle text-slate-300"></i>}
                    <span className="text-[11px] font-medium leading-none select-none">{label}</span>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
